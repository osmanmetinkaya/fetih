@media (max-width:767px){:root{--hud-h:48px;--t-sm:calc(14.5px*var(--ts));--t-md:calc(16px*var(--ts));--t-lg:calc(18px*var(--ts));--t-2xl:calc(25px*var(--ts));--t-3xl:calc(34px*var(--ts))}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cilt) var(--tex-cilt);color:var(--tx-1);font:400 var(--t-md)/1.45 var(--font-ui);font-variant-numeric:lining-nums;font-kerning:normal;font-synthesis:none;display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea,optgroup{font-family:inherit}
small{font-size:max(.85em,var(--t-xs))}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:1.15em;height:1.15em;fill:currentColor;flex:none;vertical-align:-.22em;overflow:visible}
.k-tahil{color:var(--r-tahil)}.k-odun{color:var(--r-odun)}.k-tas{color:var(--r-tas)}.k-demir{color:var(--r-demir)}.k-altin{color:var(--r-altin)}.k-bilgi{color:var(--r-bilgi)}.k-nufus{color:var(--r-nufus)}.k-moral{color:var(--r-moral)}
.k-good{color:var(--good)}.k-bad{color:var(--bad)}.k-warn{color:var(--warn)}.k-brand{color:var(--brand)}.k-mut{color:var(--tx-2)}.k-info{color:var(--info)}
.c{white-space:nowrap}
.pos,.good{color:var(--good)}.neg,.bad{color:var(--bad)}.muted{color:var(--tx-2)}.ok{color:var(--good);font-weight:700}
/* ---- üst çubuk (HUD) ---- */
header{position:relative;z-index:var(--z-hud);display:flex;align-items:center;gap:8px;height:calc(var(--hud-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:var(--bg-1);border-bottom:1px solid var(--line);flex:none}
.title{font:700 calc(16px*var(--ts))/1 var(--font-display);letter-spacing:.14em;color:var(--brand);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding-right:4px}
.title .ic{width:18px;height:18px}
#menuBtn{flex:none}
.resw{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.resi{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.resi::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,transparent,var(--bg-1));pointer-events:none;opacity:0;transition:opacity .2s}
.resw.more .resi::after{opacity:1}
/* Final QA G1: öncelikli HUD. Yıl + 6 kaynak + nüfus/moral/asker her zaman görünür; sığmazsa sırayla: eğilim yalnız ok (c1) → ikincil çipler "⋯" açılırına (fold) → eğilim/üst sınır gizli, sıkı çip (c3) → wordmark ve "Yıl" sözcüğü gizli (c4) */
.res2{flex:none;display:flex;gap:6px;align-items:center;margin-left:6px}.res2:empty{display:none}
.hc.hmore{display:none;margin-left:6px;min-width:44px;justify-content:center}
header.fold .hc.hmore{display:inline-flex}
header.fold .res2{display:none;position:absolute;right:0;top:calc(100% + 6px);margin:0;flex-direction:column;align-items:stretch;gap:6px;padding:8px;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--rad-md);box-shadow:var(--e-3);z-index:var(--z-hud)}
header.fold .res2 .hc{height:44px}
header.fold.hopen .res2{display:flex}header.hopen{z-index:var(--z-toast)}header.c5 .hmore .ring{display:none}
.hmore .hcnt{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--brand);color:var(--ink);font:700 12px/16px var(--font-num);font-variant-numeric:var(--num);font-style:normal;text-align:center;pointer-events:none}header.c5 .hmore b{display:none}header.c5 .hc.hmore::after{content:'';position:absolute;right:4px;bottom:6px;border:4px solid transparent;border-bottom:0;border-top-color:currentColor;opacity:.8}header.c5 .hc.hmore{min-width:44px;padding:0 6px;gap:2px}
.hmore.warnc,.hmore.decl{animation:none}
header.c1 .res .tr{font-size:0;gap:0}
header.c3 .res .tr,header.c3 .res .hc small{display:none}header.c3 .res .hc{padding:0 7px 0 6px;gap:4px}header.c3 .res{gap:4px}header.c3 .hsep{display:none}
header.c4 .title{display:none}header.c4 #yr small{display:none}header.c4 #yr{padding:0 8px 0 6px;gap:4px}
header.c5 .res .hc{padding:0 5px 0 4px;gap:3px}header.c5 .res .hc .ic{width:15px;height:15px}header.c5 .res .hc b{font-size:var(--t-md)}header.c5 .res{gap:3px}header.c5{gap:4px}header.c6 #sndBtn{display:none}header.c5 .hc.hmore,header.c5 .res2{margin-left:4px}
.res{flex:1;min-width:0;height:44px;display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.res::-webkit-scrollbar{display:none}
.hc{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 8px;border:0;border-left:2px solid var(--rc,transparent);border-radius:var(--rad-sm);background:var(--bg-2);box-shadow:var(--e-1);color:var(--tx-1);font:500 var(--t-sm)/1.2 var(--font-ui);white-space:nowrap;cursor:pointer;position:relative;scroll-snap-align:start;--icon-cut:var(--bg-2)}
.hc::before{content:'';position:absolute;inset:-4px 0}
@media (hover:hover){.hc:hover{background:var(--bg-3)}}
.hc .ic{width:18px;height:18px;color:var(--rc,var(--tx-2))}
.hc b{font:700 var(--t-lg)/1 var(--font-num);font-variant-numeric:var(--num)}
.hc small{color:var(--tx-2);font:500 var(--t-xs)/1 var(--font-num);font-variant-numeric:var(--num)}
.tr{font:600 var(--t-xs)/1 var(--font-num);font-variant-numeric:var(--num);display:inline-flex;align-items:center;gap:2px}
.tr.up{color:var(--good)}.tr.dn{color:var(--bad)}.tr.z{color:var(--tx-3)}
.tr.up::before,.tr.dn::before{content:'';width:0;height:0;border:4px solid transparent}
.tr.up::before{border-top:0;border-bottom:6px solid currentColor}.tr.dn::before{border-bottom:0;border-top:6px solid currentColor}
.hc.crit{box-shadow:inset 0 0 0 1px var(--bad)}.hc.crit .w{color:var(--bad)}
.hc.bad b{color:var(--bad)}
.hc[data-r=tahil]{--rc:var(--r-tahil)}.hc[data-r=odun]{--rc:var(--r-odun)}.hc[data-r=tas]{--rc:var(--r-tas)}.hc[data-r=demir]{--rc:var(--r-demir)}.hc[data-r=altin]{--rc:var(--r-altin)}.hc[data-r=bilgi]{--rc:var(--r-bilgi)}
.hc[data-r=nufus]{--rc:var(--r-nufus);border-left-color:transparent}.hc[data-r=moral]{--rc:var(--r-moral);border-left-color:transparent}.hc[data-r=asker]{--rc:var(--tx-2);border-left-color:transparent}
.hc.yr{--rc:var(--tx-2);border-left-color:transparent;cursor:default}.hc.yr:empty{display:none}
.hc.vic{border-left-color:transparent}.hc.warnc{--rc:var(--bad);border-left-color:var(--bad);background:var(--bad-wash)}
.hc.decl{background:var(--brand);color:var(--ink);--rc:var(--ink);border-left-color:transparent;font-weight:700;animation:glow 2s var(--ease-io) infinite}
.hsep{flex:none;width:1px;height:24px;background:var(--line)}
@keyframes glow{50%{box-shadow:var(--e-glow)}}
.ring{width:22px;height:22px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:4}
.ring .rt{stroke:var(--bg-3)}.ring .rf{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset var(--d-5) var(--ease-out)}
/* ---- ana yerleşim ---- */
main{flex:1;display:flex;min-height:0;position:relative}
#mapWrap{flex:1;position:relative;min-width:0;min-height:0;background:var(--bg-map);overflow:hidden;touch-action:none}
#view{display:block;cursor:grab}#view.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:var(--z-mapui)}
.mapctl .btn{width:44px;padding:0;background:var(--bg-2);border-color:var(--line);box-shadow:var(--e-2)}
.hint{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--scrim-map);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--rad-sm);padding:6px 10px;font-size:var(--t-xs);color:var(--tx-2);pointer-events:none;z-index:var(--z-mapui);transition:opacity var(--d-5)}
.hint.off{opacity:0}
#tip,#tipx{position:absolute;pointer-events:none;background:var(--bg-3);border:1px solid var(--line);box-shadow:var(--e-2);border-radius:var(--rad-sm);padding:8px 10px;font-size:var(--t-sm);line-height:1.4;display:none;max-width:300px;z-index:var(--z-tip);color:var(--tx-1)}
#tipx{position:fixed;white-space:normal}#tipx b:first-child{display:inline-block;margin-bottom:2px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg-map);font:700 var(--t-lg)/1.3 var(--font-display);letter-spacing:.06em;color:var(--brand);z-index:var(--z-mapui)}
#ctxAct{position:absolute;z-index:var(--z-mapui);display:none;transform:translate(-50%,-100%);min-height:44px;border-radius:var(--rad-pill);box-shadow:var(--e-2);white-space:nowrap;padding:0 16px}
#ctxAct.on{display:inline-flex}
#ctxAct b{font-variant-numeric:var(--num)}
#ctxAct.edge{box-shadow:var(--e-2),0 0 0 2px var(--brand-hi)}
aside{width:var(--aw);flex:none;background:var(--bg-1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:var(--z-hud)}
#sheet{flex:1;display:flex;flex-direction:column;min-height:0}
.grab{display:none}
#sideTgl{display:none}
.tabs{display:flex;background:var(--bg-1);border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;background:none;border:0;border-bottom:3px solid transparent;color:var(--tx-2);font:600 var(--t-xs)/1.2 var(--font-ui);cursor:pointer;position:relative}
.tabs button .ic{width:20px;height:20px}
@media (hover:hover){.tabs button:hover{color:var(--tx-1);background:var(--bg-2)}}
.tabs button.on{color:var(--tx-1)}
.tabs{position:relative;overflow:hidden}.tabs .tink{position:absolute;left:0;bottom:0;width:100px;height:3px;background:var(--brand);border-radius:3px 3px 0 0;transform-origin:0 0;transition:transform 180ms var(--ease-out);pointer-events:none}
.tabs.noink .tink{display:none}.tabs.noink button.on{border-bottom-color:var(--brand)}
.tabs button.on .ic{color:var(--brand)}
.tabs .nd{position:absolute;top:7px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--bg-1)}
.tabs .sm{display:none}
#panel{flex:1;overflow:auto;padding:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#panel p,:is(#modal,.mgc) p{hyphens:auto;-webkit-hyphens:auto}
.foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg-1);flex:none}
#endBtn .sm{display:none}
/* ---- düğmeler §5.1 ---- */
.btn{--h:44px;display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);min-height:var(--h);padding:0 16px;border-radius:var(--rad-md);border:1px solid var(--edge);background:var(--bg-3);color:var(--tx-1);font:600 var(--t-md)/1.25 var(--font-ui);cursor:pointer;transition:background .12s,border-color .12s,transform var(--d-1);-webkit-tap-highlight-color:transparent;position:relative;--icon-cut:var(--bg-3);text-decoration:none}
.btn .ic{width:20px;height:20px}
@media (hover:hover){.btn:hover:not(:disabled){background:#313B4E;border-color:var(--tx-2)}}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled,.btn[aria-disabled=true]{background:var(--bg-2);color:var(--tx-dis);border-color:transparent;cursor:not-allowed}
.btn.primary,.btn.pri{background:var(--brand);color:var(--ink);border-color:transparent;font-weight:700;--icon-cut:var(--brand)}
@media (hover:hover){.btn.primary:hover:not(:disabled),.btn.pri:hover:not(:disabled){background:var(--brand-hi)}}
.btn.primary:active:not(:disabled){background:var(--brand-lo)}
.btn.primary:disabled{background:var(--bg-2);color:var(--tx-dis)}
.btn.primary .muted,.btn.primary small{color:inherit;opacity:.8}.btn.primary .ic[class*=k-]{color:inherit}
.btn.big{--h:56px;flex:1;font-size:var(--t-lg);padding:0 24px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn.danger,.btn.dng{background:var(--danger-bg);border-color:transparent;color:#fff}
.btn.ico{width:44px;padding:0;flex:none}
.btn.sm{--h:36px;padding:0 12px;font-size:var(--t-sm);gap:6px;border-radius:8px}
.btn.sm .ic{width:16px;height:16px}
.btn.sm::before{content:'';position:absolute;inset:-4px 0}
.btn.wide{display:block;width:100%;margin-top:10px;padding:10px 16px;text-align:left}
.btn.hot{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.btn .cost{font:500 var(--t-xs)/1 var(--font-num);font-variant-numeric:var(--num)}
.lnk{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:none;border-bottom:1px dotted var(--tx-2);position:relative;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.lnk::before{content:'';position:absolute;inset:-14px -8px}
@media (hover:hover){.lnk:hover{color:var(--brand-hi);border-bottom-color:var(--brand)}}
/* ---- tipografi §3 ---- */
h2{margin:0;font:700 var(--t-xl)/1.25 var(--font-display)}
h3{margin:0 0 12px;font:700 var(--t-2xl)/1.2 var(--font-display)}
h3 .ic{width:1.1em;height:1.1em;color:var(--brand);margin-right:.3em;vertical-align:-.18em}
#panel h3{font-size:var(--t-xl)}
h4{margin:20px 0 8px;font:700 var(--t-xs)/1.35 var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--tx-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h4 .ic{width:16px;height:16px}
code{font-family:var(--font-ui);font-variant-numeric:var(--num);letter-spacing:.02em}
/* ---- panel öğeleri §5.3 ---- */
.rh{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;display:inline-block;flex:none;vertical-align:-1px;background:var(--fc,var(--tx-2))}
.dot.f0{--fc:var(--f0);clip-path:polygon(0 0,100% 0,100% 58%,50% 100%,0 58%)}.dot.f1{--fc:var(--f1);clip-path:polygon(0 4%,100% 4%,50% 100%)}.dot.f2{--fc:var(--f2);border-radius:50%}
.dot.f3{--fc:var(--f3);transform:scale(.88)}.dot.f4{--fc:var(--f4);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.dot.f5{--fc:var(--f5);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.rh .dot{width:14px;height:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stats>div{background:var(--bg-2);border-radius:var(--rad-md);padding:8px 12px;box-shadow:var(--e-1)}
.stats span{display:flex;align-items:center;gap:4px;font-size:var(--t-xs);color:var(--tx-2)}
.stats b{display:block;font:700 calc(22px*var(--ts))/1.2 var(--font-num);font-variant-numeric:var(--num)}.stats small{display:block;font-size:var(--t-xs);color:var(--tx-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fleft .chip{border:1px solid var(--line);color:var(--tx-1);font:inherit;font-size:var(--t-xs);cursor:pointer;min-height:28px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fleft .chip:hover{border-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg-2);border-radius:var(--rad-sm);padding:3px 8px;font-size:var(--t-xs)}
.chip.x{color:var(--tx-dis);text-decoration:line-through}
.feat{background:var(--bg-2);border-left:3px solid var(--brand);border-radius:var(--rad-sm);padding:8px 12px;margin-top:10px;font-size:var(--t-sm);display:flex;gap:8px;align-items:flex-start}
.feat>.ic{width:24px;height:24px;color:var(--brand);margin-top:1px}
.warn{background:var(--warn-wash);border-left:3px solid var(--warn);border-radius:var(--rad-sm);padding:8px 12px;margin-top:10px;font-size:var(--t-sm);color:var(--tx-1);display:flex;gap:8px;align-items:flex-start}
.warn>.ic:first-child{color:var(--warn);margin-top:1px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;min-height:52px;border-bottom:1px solid var(--line)}
.item>div{min-width:0}
.item small{display:block;color:var(--tx-2);font-size:var(--t-xs);margin-top:2px}
.rec{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.rec input[type=range]{flex:1;min-width:120px}
select,.inp{min-height:44px;background:var(--bg-3);color:var(--tx-1);border:1px solid var(--edge);border-radius:var(--rad-sm);padding:6px 10px;font:inherit;font-size:var(--t-sm)}
.inp{width:100%}
textarea{background:var(--bg-2);color:var(--tx-1);border:1px solid var(--edge);border-radius:var(--rad-sm);font:var(--t-xs)/1.4 var(--font-mono);padding:8px;width:100%}
/* sürgü §5.11 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--v:100%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brand) var(--v),var(--bg-3) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--tx-1);box-shadow:0 0 0 2px var(--ink),var(--e-1)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--bg-3)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--brand)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:var(--tx-1);box-shadow:0 0 0 2px var(--ink)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--focus);outline-offset:2px}
/* anahtar §5.11 */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--t-sm);min-height:44px;min-width:44px;position:relative}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:44px;height:26px;margin:0;border-radius:var(--rad-pill);background:var(--bg-3);border:1px solid var(--edge);position:relative;cursor:pointer;flex:none;transition:background var(--d-2)}
input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--tx-2);transition:transform var(--d-2) var(--ease-out),background var(--d-2)}
input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--ink)}
/* ilerleme §5.5 */
.bar{height:8px;background:var(--bg-3);border-radius:var(--rad-xs);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:var(--rad-xs)}
.prog{display:flex;gap:3px;margin:12px 0}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--bg-3)}
.prog i.d{background:var(--good)}.prog i.c{background:var(--brand)}
.lvd{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.lvd i{width:7px;height:7px;transform:rotate(45deg);background:var(--bg-3);border-radius:1px}.lvd i.on{background:var(--brand)}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);vertical-align:1px;margin:0 2px}
.ndot.o{background:none;box-shadow:inset 0 0 0 1.5px var(--tx-2)}.ndot.g{background:var(--good)}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.kv>span:first-child{color:var(--tx-2)}.kv>span:last-child,.kv>b{text-align:right;font-variant-numeric:var(--num)}
.log p{margin:0 0 8px;font-size:var(--t-sm);line-height:1.45}

@media (hover:hover){tr:hover td{background:var(--bg-2)}}

:is(#modal,.mgc).wide{width:min(680px,100%)}

@keyframes modal-in{from{opacity:0;transform:scale(.96)}}
@keyframes sheet-in{from{transform:translateY(100%)}}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}

.tst{min-height:44px;background:var(--bg-3);box-shadow:var(--e-2);border-left:3px solid var(--brand);padding:10px 14px;border-radius:var(--rad-sm);display:flex;align-items:center;gap:8px;font-size:var(--t-md);animation:toast-in 180ms var(--ease-out);max-width:100%}
.tst.tg{border-left-color:var(--good)}.tst.tb{border-left-color:var(--bad)}.tst.out{animation:toast-out 140ms var(--ease-in) forwards}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}}@keyframes toast-out{to{opacity:0;transform:translateY(-8px)}}
#bars{position:fixed;top:calc(var(--hud-h) + env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 16px));display:flex;flex-direction:column;gap:6px;z-index:var(--z-bars);pointer-events:none}
.bar-n{pointer-events:auto;display:flex;align-items:flex-start;gap:8px;background:var(--bg-3);border-left:3px solid var(--warn);border-radius:var(--rad-md);padding:8px 8px 8px 12px;font-size:var(--t-sm);box-shadow:var(--e-2)}
.bar-n>span{flex:1;min-width:0;overflow-wrap:anywhere}.bar-n.err{border-left-color:var(--bad)}.bar-n .btn.sm{flex:none}.bar-n span .btn{margin-left:4px}
.savebox{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ver{font-size:var(--t-xs);color:var(--tx-3);text-align:right;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:22px;font:600 var(--t-xs)/1.2 var(--font-ui);padding:0 8px;border-radius:var(--rad-pill);background:var(--bg-3);color:var(--tx-2);white-space:nowrap;vertical-align:middle}
.tag.bad{color:var(--bad);background:var(--bad-wash)}.tag.good{color:var(--good);background:var(--good-wash)}.tag.rec{background:var(--good);color:var(--ink);font-size:var(--t-sm);padding:2px 10px;font-weight:700}
h3 .tag{font-size:var(--t-xs)}
.dynbox,.mutbox{background:var(--bg-2);border-radius:var(--rad-md);padding:10px 12px;margin-top:8px;font-size:var(--t-sm)}
.dynbox>div{display:flex;gap:6px;align-items:baseline}
.rivals{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.wz .btn.wide{margin-top:8px}
.wzc{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent;position:relative}
@media (hover:hover){.pick:hover{border-color:var(--edge)}}
.pick.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-wash)}
.pick.on::after{content:'';position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--bg-1)}
.pick.lockd{cursor:default;color:var(--tx-3)}.pick.lockd .ic{filter:saturate(.2)}
.pick small{line-height:1.3}.pick .det{display:flex;flex-direction:column;gap:4px}.mobdet{display:none}
.wz-nav{position:sticky;bottom:-24px;background:var(--bg-1);padding:12px 0 6px;margin:16px 0 -6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);z-index:2}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{flex:1 1 72px;line-height:1.2;padding:6px 10px}
.evo{display:flex;flex-direction:column;gap:8px}.evo .btn{display:block;min-height:56px;text-align:left;width:100%;line-height:1.3;padding:10px 14px}.evo .btn small{display:block;color:var(--tx-2);font-weight:500;font-size:var(--t-xs);margin-top:3px}.evo .btn b{color:var(--brand)}
.evo .btn:disabled small{color:var(--tx-dis)}
.stones{display:flex;gap:3px;margin:6px 0 8px}.stones span{flex:1;text-align:center;color:var(--tx-2);font-size:var(--t-micro);min-width:0}
.stones span i{display:block;height:6px;border-radius:3px;background:var(--bg-3);margin-bottom:4px}

.stones small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-micro)}
.goal.on{border-color:var(--brand)}
.goal>.rh b{display:inline-flex;align-items:center;gap:6px}
.tgt{border-left:3px solid var(--tx-2)}.tgt.ok{border-left-color:var(--good)}.tgt.no{border-left-color:var(--bad)}
/* bitiş ve miras */
.end-h{display:flex;gap:16px;align-items:flex-start}.end-h canvas{width:220px;height:auto;border-radius:var(--rad-md);flex:none;background:var(--bg-map)}.end-h h3{margin:0 0 6px;font-size:var(--t-2xl)}.end-h p{margin:0 0 6px}
.end-h h3.win{color:var(--brand)}
.end-sc{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 8px;padding:12px 16px;border-radius:var(--rad-md);background:var(--bg-2);box-shadow:var(--e-1)}
#endSc{font:700 var(--t-3xl)/1.1 var(--font-num);color:var(--brand);display:block;font-variant-numeric:var(--num)}
.end-rk{text-align:right;font-size:var(--t-sm)}.end-rk>div{display:inline-flex;align-items:center;gap:6px}

.beat{font-size:var(--t-sm);padding:8px 12px;border-radius:var(--rad-md);background:var(--bg-2)}
.beat.on{opacity:1;transform:none}.beat.big{font-size:var(--t-lg);background:var(--brand-wash);box-shadow:var(--e-glow)}.beat.mp b{color:var(--brand)}.beat .bar{margin-top:6px}
.end-b{display:flex;flex-direction:column;gap:8px;margin-top:12px}.end-main{display:block;min-height:56px;font-size:var(--t-lg);padding:10px 16px;text-align:center}.end-main small{display:block;font-weight:500;font-size:var(--t-xs);margin-top:2px}
.end-d{margin-top:12px;font-size:var(--t-sm)}.end-d summary,details>summary{cursor:pointer;padding:10px 0;color:var(--tx-2);min-height:44px;display:flex;align-items:center;gap:6px}.end-d canvas{width:100%;height:auto;margin-top:8px;background:var(--bg-2);border-radius:var(--rad-md)}.end-d p{margin:6px 0}
.achs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.achs .card.got{border-color:rgba(76,195,138,.45)}.achs .card b{display:flex;gap:6px;align-items:center}.achs .card:not(.got) b .ic{color:var(--tx-dis)}.achs .card.got b .ic{color:var(--good)}
.mir .item>div{flex:1 1 60%}.mir .item>span{flex:0 1 auto;min-width:0;text-align:right}.mir .item .btn{white-space:nowrap}
.menu .btn.wide{display:flex;align-items:center;justify-content:flex-start}
tr.flash td,h4.flash{background:var(--brand-wash);transition:background .3s}
/* ===== Aşama 4-6: pencere, sihirbaz, bitiş, olay, saldırı, hareket (§5.8-5.15, §9) ===== */
@keyframes fade-in{from{opacity:0}}@keyframes fade-out{to{opacity:0}}@keyframes modal-out{to{opacity:0;transform:scale(.97)}}@keyframes sheet-out{to{opacity:0;transform:translateY(30%)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}@keyframes tab-swap{from{opacity:0;transform:translateY(4px)}}@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes wiz-r{from{opacity:0;transform:translateX(16px)}}@keyframes wiz-l{from{opacity:0;transform:translateX(-16px)}}@keyframes flip{from{transform:perspective(700px) rotateY(-90deg);opacity:0}}
@keyframes pop{40%{transform:scale(1.08)}}@keyframes rank-up{40%{transform:scale(1.15)}}@keyframes shk{to{transform:translate(-1px,-4px) rotate(-20deg)}}@keyframes yr-in{from{transform:translateY(100%);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse-good{from{background-color:rgba(76,195,138,.32)}}@keyframes pulse-bad{from{background-color:rgba(255,107,94,.32)}}
@keyframes yc{0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}28%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.mbar{position:sticky;top:-24px;height:0;z-index:4;display:flex;justify-content:flex-end;margin:-16px -16px 0 0}
.mbar .btn{margin-top:-4px;background:var(--bg-1)}
:is(#modal,.mgc):has(.mbar) h3{padding-right:44px}
.mghost{position:fixed;inset:0;z-index:var(--z-modal);pointer-events:none;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade-out 140ms var(--ease-in) forwards}
.mghost>.mgc{animation:modal-out 140ms var(--ease-in) forwards!important;pointer-events:none}
.hc.up{animation:pulse-good 400ms var(--ease-out)}.hc.dn{animation:pulse-bad 400ms var(--ease-out)}.hc.up b,.hc.dn b{display:inline-block;animation:pop 400ms var(--ease-out)}
.hc.yr b.yrin{display:inline-block;animation:yr-in 260ms var(--ease-out)}
#panel.swap{animation:tab-swap 140ms var(--ease-out)}
#yearCard{position:absolute;left:50%;top:42%;z-index:var(--z-mapui);pointer-events:none;background:var(--scrim-map);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--rad-lg);padding:12px 28px;text-align:center;box-shadow:var(--e-2);opacity:0;transform:translate(-50%,-50%)}
#yearCard small{display:block;font:700 var(--t-xs)/1.3 var(--font-ui);letter-spacing:.12em;color:var(--tx-2)}#yearCard b{display:block;font:700 var(--t-3xl)/1.1 var(--font-num);color:var(--tx-1);font-variant-numeric:var(--num)}
#yearCard.on{animation:yc 700ms var(--ease-out) forwards}
#view{transition:filter 900ms var(--ease-in)}
#loading{flex-direction:column}#loading .lbar{width:180px;height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden}#loading .lbar i{display:block;height:100%;background:var(--brand);transform-origin:0 0;transform:scaleX(var(--lp,.05));transition:transform 300ms var(--ease-out)}
#loading .ld{font:700 calc(24px*var(--ts))/1 var(--font-display);letter-spacing:.14em}#loading .lt{font:500 var(--t-sm)/1.3 var(--font-ui);letter-spacing:0;color:var(--tx-2)}
.btn.busy{color:transparent!important}.btn.busy::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--tx-2);border-top-color:transparent;animation:spin .8s linear infinite}
/* olay penceresi §5.13 */
.evm{position:relative;padding-top:6px;animation:rise 260ms var(--ease-out)}
.evm .evs{position:absolute;left:-24px;right:-24px;top:-24px;height:4px;background:var(--brand);transform-origin:0 0;animation:grow-x 260ms var(--ease-out)}
.evm.t-good .evs{background:var(--good)}.evm.t-bad .evs{background:var(--bad)}.evm.t-info .evs{background:var(--info)}
.evm h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.evm h3 .ic{width:28px;height:28px}
.evsub{margin:-6px 0 8px;font-size:var(--t-sm);color:var(--tx-2)}.evt{font-size:calc(15px*var(--ts));margin:0 0 12px}
.evo .btn.evb{display:flex;align-items:flex-start;gap:12px;min-height:64px;padding:10px 12px;transition:background .2s,opacity .2s,border-color .12s}
.evo .key{flex:none;width:32px;height:32px;border-radius:8px;background:var(--bg-2);display:inline-flex;align-items:center;justify-content:center;font:700 var(--t-md)/1 var(--font-num);color:var(--brand)}
.evo .evx{flex:1;min-width:0}.evo .evx b{color:var(--tx-1)}
@media (hover:hover){.evo .btn.evb:hover:not(:disabled){border-color:var(--brand)}}
.evo .btn.evb:focus-visible{border-color:var(--brand)}
.evo .btn.evb.alt1{border-color:var(--brand);background:var(--brand-wash)}
.evm.picked .evb{opacity:.4}.evm.picked .evb.pk{opacity:1;background:var(--brand-wash);border-color:var(--brand)}
/* saldırı penceresi §5.14 */
.atkh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.atkh .dot{width:16px;height:16px}
.atkg{display:flex;align-items:center;gap:16px;margin:12px 0 4px}
.cring{position:relative;width:64px;height:64px;flex:none}.cring svg{width:64px;height:64px;transform:rotate(-90deg)}.cring circle{fill:none;stroke-width:5}.cring .rt{stroke:var(--bg-3)}.cring .rf{stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset 400ms var(--ease-out)}
.cring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 calc(15px*var(--ts))/1 var(--font-num);letter-spacing:0;font-variant-numeric:var(--num)}
.atkg .w{font:700 var(--t-lg)/1.2 var(--font-ui)}.atkg small{display:block;color:var(--tx-2);font-size:var(--t-xs)}
.pw{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fc,var(--bg-3));margin:10px 0 4px}.pw i{background:var(--brand);transform-origin:0 0}
.pwl{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--tx-2);font-variant-numeric:var(--num)}.pwl b{color:var(--tx-1)}
.atkd{margin-top:8px}.atkd>summary{min-height:44px}
.lastb{border-left:3px solid var(--good);margin-top:12px}.lastb.l{border-left-color:var(--bad)}.lastb b{display:flex;align-items:center;gap:6px}
/* sihirbaz §6.4 */
.wz-steps{display:flex;align-items:center;gap:0;margin:0 0 16px}.wz-steps>span{flex:1;display:flex;align-items:center;gap:6px;min-width:0;color:var(--tx-2);font-size:var(--t-xs);font-weight:600;border:0;padding:0;white-space:nowrap}
.wz-steps>span:not(:last-child)::after{content:'';flex:1;height:2px;background:var(--line);margin:0 6px;min-width:8px}
.wz-steps>span.done:not(:last-child)::after{background:var(--good)}
.wz-steps i{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-3);color:var(--tx-2);font:700 var(--t-xs)/1 var(--font-num);font-style:normal}
.wz-steps .on{color:var(--tx-1)}.wz-steps .on i{background:var(--brand);color:var(--ink)}.wz-steps .done i{background:var(--good-wash);color:var(--good)}.wz-steps .done i .ic{width:14px;height:14px}
.wz-steps em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.wzb.ar{animation:wiz-r 200ms var(--ease-out)}.wzb.al{animation:wiz-l 200ms var(--ease-out)}
.pick.flip{animation:flip 320ms var(--ease-io) both}
.pick.lockd{border:1px dashed var(--line);background:var(--bg-2)}.pick.lockd.can{border-color:var(--brand)}
.pick .lk+div{padding-right:20px}.pick.lockd .lk{position:absolute;top:10px;right:10px;width:16px;height:16px;color:var(--tx-3)}.pick.lockd.can .lk{color:var(--brand)}

.tt-s .ic{width:20px;height:20px;color:var(--brand)}
.tt-foot{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;font:400 var(--t-sm)/1 var(--font-ui);color:#D8C7A4;text-shadow:0 1px 2px #000}
#ttSnd{color:#EFE3C8;width:44px;margin:0}
:root.hcm .tt-b.primary small,:root.hcm #mapPlate small,:root.hcm .tt-foot{color:#F1E8D2}
body.tt-on #toast{z-index:45}
@media (max-width:767px){.tt-w{font-size:calc(50px*var(--ts))}.tt-orn{width:44px}.tt-brand{gap:8px}.tt-sub{font-size:calc(17px*var(--ts))}#title::after{inset:6px;background-size:22px 22px}.tt-in{padding:20px 0;width:calc(100vw - 32px)}.btn.tt-b{min-height:56px}.btn.tt-b.primary{min-height:64px}}
@media (max-height:620px){.tt-w{font-size:calc(46px*var(--ts))}.tt-sem,.tt-dyn{display:none}.tt-sub{margin-bottom:12px}}
/* --- yükleme ipucu --- */
#loading .ltip{max-width:min(420px,calc(100% - 48px));margin:14px 0 0;padding:10px 16px;font:400 var(--t-md)/1.45 var(--font-ui);letter-spacing:0;text-align:center;color:var(--tx-1);background-color:var(--bg-1);background-image:var(--tex-parch);border:1px solid var(--edge);box-shadow:var(--cetvel),var(--e-2)}
#loading .ltip:empty{display:none}#loading .ltip b{font:500 var(--t-sm)/1 var(--font-sc);color:var(--brand)}
/* --- harita çerçevesi: köşe madalyonları, pusula gülü, bölge levhası (tıklamayı geçirir) --- */
#mapWrap::after{background-image:none}
#mapFrame{position:absolute;inset:0;pointer-events:none;z-index:6}
#mapFrame .mk{position:absolute;width:44px;height:44px}
.mk.tl{left:6px;top:6px}.mk.tr{right:6px;top:6px;transform:scaleX(-1)}.mk.bl{left:6px;bottom:6px;transform:scaleY(-1)}.mk.br{right:6px;bottom:6px;transform:scale(-1,-1)}
#mapFrame .pusula{position:absolute;left:20px;top:56px;width:64px;height:64px;opacity:.92}
#mapPlate{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;max-width:calc(100% - 220px);min-height:36px;padding:3px 18px 3px 10px;
 background-color:var(--deri);background-image:var(--tex-cilt);border:1px solid var(--gold);box-shadow:inset 0 0 0 2px var(--deri),inset 0 0 0 3px var(--gold-lo),0 2px 0 rgba(10,6,3,.55);
 color:#F1E6CC;font:600 var(--t-md)/1.2 var(--font-display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;pointer-events:none}
#mapPlate b{overflow:hidden;text-overflow:ellipsis}#mapPlate small{font:400 var(--t-sm)/1 var(--font-ui);letter-spacing:0;color:#D8C7A4}
#mapPlate:empty{display:none}#mapPlate.in{animation:plateIn 260ms var(--ease-out)}
@keyframes plateIn{from{transform:translate(-50%,-12px);opacity:0}}
.mapctl{top:58px}
@media (min-width:768px) and (max-width:1099px){#mapPlate{left:calc((100% - var(--aw)) / 2);max-width:calc(100% - var(--aw) - 160px)}.mapctl{top:66px}}
@media (max-width:767px){
 #mapFrame .mk{width:30px;height:30px}.mk.tl,.mk.bl{left:3px}.mk.tr,.mk.br{right:3px}.mk.tl,.mk.tr{top:3px}.mk.bl,.mk.br{bottom:3px}
 #mapFrame .pusula{left:12px;top:40px;width:46px;height:46px}
 #mapPlate{top:8px;max-width:calc(100% - 120px);font-size:var(--t-sm);padding:2px 12px 2px 8px;min-height:32px}#mapPlate small{display:none}
 .mapctl{top:40px}
 /* mobil üst bant: Yıl + tahıl, altın, asker, nüfus ilk bakışta; ses düğmesi ☰ menüde; kalan çipler kaydırılır (sağ kenar solar) */
 .res .hc.crit{order:-5}.res .hc[data-r=tahil]{order:-4}.res .hc[data-r=altin]{order:-3}.res .hc[data-r=asker]{order:-2}.res .hc[data-r=nufus]{order:-1}
 .res .hc[data-r=nufus] small{display:none}
 #sndBtn{display:none}
 .hc{min-width:44px;justify-content:center}
 .resi::after{width:28px}
}
/* --- dokunma hedefleri: masaüstünde de küçük düğme ve alt sekme kutusu 44 px (önceden yalnız dokunmatik/dar ekranda) --- */
.btn.sm{--h:44px}.sub button{min-height:44px}
.res .hc,.hc.hmore{min-width:44px;justify-content:center}
/* 0.12.0: rakamlar her yerde düz (lining). font kısaltması font-variant-numeric'i sıfırlar, font-feature-settings'i sıfırlamaz; başlık ekranında ayrıca tablo rakamı */
*,::before,::after{font-feature-settings:"lnum" 1}
#title,#title *,.ver{font-variant-numeric:var(--num)}
/* G1 göstergeleri: huzursuzluk çubuğu, tavan, uyarı */
.unrb{height:8px;border-radius:2px;background:var(--line);overflow:hidden;margin:4px 0 2px}.unrb>.unrf{display:block;height:100%;background:var(--bad)}
td.over{color:var(--bad);font-weight:700}
</style>

 riot:.05,dirAt:.6,dirDef:.5,dirN:1,dirG:2,gBase:3,gPop:.08,yorgun:[1.15,.6],cap:{base:150,n:12,amb:120,altin:250,altinN:15},rot:{tahil:.4,odun:.2,tas:.2,demir:.2,altin:.1},ambMax:3,ambCost:{odun:30,tas:20}};
const unrOf=i=>(G1()&&S.regions[i].unr)||0;
const huzur=i=>1-BRK.unrK*unrOf(i);
// başkente uzaklık (kendi toprağı içinden; kopuk bölge: harita uzaklığı + 2). Sahiplik değişince yeniden hesaplanır
const TSR={k:null,d:null};
function capDistOwn(){const R=S.regions,c=capIdx();let k=S.turn*7919+(c??-1);for(let i=0;i<R.length;i++)if(R[i].owner===0)k=(Math.imul(k,31)+i+1)|0;if(TSR.s===S&&TSR.k===k)return TSR.d;
 const d=new Array(MAP.n).fill(99);if(c!=null){const q=[c];d[c]=0;while(q.length){const x=q.shift();for(const j of MAP.regions[x].adj)if(R[j].owner===0&&d[j]===99){d[j]=d[x]+1;q.push(j)}}
  if(R.some((r,i)=>r.owner===0&&d[i]===99)){const b=bfs(c);R.forEach((r,i)=>{if(r.owner===0&&d[i]===99)d[i]=b[i]+2})}}
 TSR.s=S;TSR.k=k;TSR.d=d;return d}
function tasra(i){if(!G1()||S.regions[i].owner!==0)return 1;const d=capDistOwn()[i];if(d>=99)return 1;const k=mil().roads?BRK.tasraYol:BRK.tasra;return Math.max(BRK.tasraMin,1-k*Math.max(0,d-BRK.tasraFree))}
// Divan gideri (altın/yıl): vasal bölgeleri sayılmaz, Ticaret Kavşağı yarım bölge, Yol Ağı ×0,8; Akıncı N0 −1, Bilge +1

function idare(){if(!G1())return 0;const x=Math.max(0,idareN()-idareN0());return x?BRK.idK*x**BRK.idE*(mil().roads?.8:1):0}
// Stok tavanı (tahıl/odun/taş/demir ayrı ayrı; altın "hazine"; bilgi tavansız). Taşan kısım her yıl çürür
const ambLv=()=>own().reduce((s,i)=>s+(S.regions[i].amb||0),0);
function stockCap(k){if(!G1()||k==='bilgi')return Infinity;const C=BRK.cap,N=own().length;if(k==='altin')return(C.altin+C.altinN*N)*(S.tech.eko>=4?1.5:1);return C.base+C.n*N+C.amb*ambLv()}
function ambCost(i){const lv=(S.regions[i].amb||0)+1;return scaleC(BRK.ambCost,lv**1.3*(1+.15*ambLv()))}
// Garnizon ihtiyacı (piyade eşdeğeri; Yeniçeri 2) ve isyan olasılığı (huzursuz bölgede)
const garrNeed=i=>BRK.gBase+BRK.gPop*S.regions[i].pop,garrHave=i=>S.regions[i].troops+(S.regions[i].u.yen||0);
function riotP(i){if(!unrOf(i))return 0;const G=garrNeed(i),g=garrHave(i);return g>=G?0:BRK.riot*(1-g/G)}
// Savaş yorgunluğu: ganimet payı toprak payına göre ×1 → ×0,6
const yorgun=()=>G1()?clamp(BRK.yorgun[0]-own().length/MAP.playN,BRK.yorgun[1],1):1;
// Oyuncu payı (vasallar dahil) ve dengeleyici (rakip geliri +%50'ye, oyuncuya saldırı eşiği −0,15·balK'ya kadar)
const PSC={on:0,v:0},pShare=()=>PSC.on?PSC.v:S.regions.reduce((s,r)=>s+(r.owner===0||isVas(r.owner)?1:0),0)/MAP.playN;// rakip turu içinde önbellekli (aiTurn2)
// Son direniş (K3): oyuncu payı dirAt'ı geçince kalan topraklar birleşir: savunma +dirDef'e kadar, kabile garnizonu her yıl büyür (tavan base·(1+dirN))
function direnis(){if(!G1())return 0;const s=pShare(),a=BRK.dirAt;return s>a?clamp((s-a)/(1-a),0,1):0}
function balance(){const D=DIFFS[cfgOf().diff],s=pShare();return{inc:clamp(D.balK*1.25*(s-.30),0,.5),need:.15*D.balK*clamp((s-.30)/.30,0,1),s}}

function riverF(o,a,b){const c=crossAt(a,b);if(!c||c.bridge)return 1;return o===0?mil().river:.7}
function atkParts(o,n,from,to){const p=[];if(o===0){const M=mil(),cov=n>0?Math.min(1,S.res.demir/(n*M.iron)):1;
  if(M.atk)p.push(['⚔️ Saldırı teknolojisi',M.atk]);p.push([`⚒️ Silah donanımı (%${Math.round(cov*100)})`,cov*M.equip]);if(S.regions[to].fort&&M.fortAtk)p.push(['🪵 Topçu',M.fortAtk]);

 else if(o!==NEUTRAL){if(aiB(o))p.push(['Düşman teknolojisi',aiB(o)]);if(aiDyn(o)==='tunc')p.push(['🔨 Tunç demircileri',.08]);const T=G1()&&S.ai[o]&&S.ai[o].tier;if(T>1)p.push([`Düşman donanımı ${ROM[T]}`,TIER.atk[T]])}return p}
function atkMult(o,n,from,to){let m=1+atkParts(o,n,from,to).reduce((s,x)=>s+x[1],0);if(o===0)m*=S.buffs&&hasBuff('bey')?1.15:moraleMult(S.morale);return m*riverF(o,from,to)}
function siegeOf(o,fort,A){if(!fort)return 0;let b;if(o===0){const M=mil();b=M.siege*Math.min(1,S.res.odun/(fort*WOOD*M.woodMult))}else b=Math.max(0,(S.turn>15?.35:.15)+DIFFS[cfgOf().diff].aiSiege+fxOf().siegeAll);return Math.min(.95,b+unitSiege(A))}
function defParts(i,siege){const r=S.regions[i],g=MAP.regions[i],p=[];if(TER[g.terrain].def)p.push(['Arazi ('+TER[g.terrain].ad+')',TER[g.terrain].def]);

 const M=r.owner===0?mil():null,fp=M?M.fortPer:fxOf().fortPerAll;if(r.fort)p.push([`🧱 Sur ×${r.fort}`+(siege?` (kuşatma %${Math.round(siege*100)} kırdı)`:''),r.fort*fp*(1-siege)]);
 if(M){if(M.def)p.push(['🛡️ Savunma teknolojisi',M.def]);if(M.defDyn)p.push([`${dynOf().e} ${dynOf().ad}`,M.defDyn]);if(M.gecitDef&&g.feat==='gecit')p.push(['🦅 Geçit Bekçileri',M.gecitDef])}
 if(r.owner>0&&r.owner!==BLOCK&&!isVas(r.owner)){const dr=direnis();if(dr>0)p.push([TX.dirT,BRK.dirDef*dr])}
 if(r.owner>0&&r.owner<NEUTRAL){if(aiB(r.owner))p.push(['Düşman teknolojisi',aiB(r.owner)]);if(aiDyn(r.owner)==='kartal')p.push(['🦅 Kartal surları',.1]);if(G1()){const T=S.ai[r.owner]&&S.ai[r.owner].tier;if(T>1)p.push([`Düşman donanımı ${ROM[T]}`,TIER.def[T]]);if(aiRegs(r.owner)<=3&&S.turn>=S.cfg.grace)p.push([TX.canHavli,.2])}}return p}
function defMult(i,siege){const r=S.regions[i];let d=1+defParts(i,siege).reduce((s,x)=>s+x[1],0);if(r.owner===0)d*=moraleMult(S.morale);return d}
function odds(a,d){if(d<=0)return 1;let w=0;const K=24;for(let i=0;i<K;i++)for(let j=0;j<K;j++)if(a*(.85+.3*(i+.5)/K)>d*(.85+.3*(j+.5)/K))w++;return w/(K*K)}
function est(t){return t<=3?t:Math.max(5,Math.round(t/5)*5)}
function computeVision(){const o=own();VIS=o.length?bfs(o):new Array(MAP.n).fill(99)}
function vis(i){const r=S.regions[i];if(r.owner===0||mil().spy||revealed(r.owner))return{v:r.troops,txt:''+r.troops,exact:true};if(VIS[i]<=mil().sight){const e=est(r.troops);return{v:e,txt:'~'+e,exact:false}}return{v:null,txt:'?',exact:false}}

// Savaşın ortak çekirdeği: güçler, zar ve kaynak harcaması
function battle(ao,from,to,A){const R=S.regions,F=R[from],T=R[to],n=sumU(A),siege=siegeOf(ao,T.fort,A),am=atkMult(ao,n,from,to);
 if(ao===0){const M=mil();S.res.demir-=Math.min(S.res.demir,n*M.iron);if(T.fort)S.res.odun-=Math.min(S.res.odun,T.fort*WOOD*M.woodMult)}
 const aP=rawAtk(A,from,to,ao)*am,dP=rawDef(T.u,T.owner)*defMult(to,siege);remU(F,A,true);F.bt=T.bt=S.turn;
 return{F,T,n,ra:aP*(.85+rnd()*.3),rd:dP*(.85+rnd()*.3),dt:T.troops,D:Object.assign(Z(),T.u),lx:fxOf().lossExp}}
function defeat(ao,b){const{F,T,n,ra,rd,dt,D,lx}=b;let fr=Math.sqrt(1-(ra/rd)**2);if(lx!==1)fr=fr**lx;if(T.owner===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.defLoss}const DS=scaleU(D,fr);if(sumU(DS)<1)DS[UK.find(k=>D[k])||'piy']=1;
 const back=Z();for(const k of UK)back[k]=fl((b.A[k]||0)*.2);addU(F,back,false);
 T.u=DS;for(const k of UK)T.rd[k]=Math.min(T.rd[k],DS[k]);sync(T);
 if(ao===0)S.morale=Math.max(0,S.morale-6);if(T.owner===0)S.morale=Math.min(mil().maxMorale,S.morale+2);
 return{win:false,sent:n,back:sumU(back),lost:n-sumU(back),dLost:dt-sumU(DS)}}
function winFr(ao,b){let fr=b.rd>0?Math.sqrt(1-(b.rd/b.ra)**2):1;if(b.lx!==1)fr=fr**b.lx;if(ao===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.conqLoss}return fr}
function resolve(ao,from,to,A){const d0=S.regions[to].owner,c0=S.regions[to].capital;if(FX.on)fxPre(to);const x=resolve0(ao,from,to,A);battleStat(ao,d0,c0,from,to,x);if(FX.on)FX.b.push({ao,from,to,win:x.win,n:x.sent,d0,c0,loot:ao===0&&x.win&&x.loot?x.loot.got:null});return x}
function resolve0(ao,from,to,A){const b=battle(ao,from,to,A);b.A=A;const{n,ra,rd,dt}=b;
 if(ra>rd){const fr=winFr(ao,b),SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;
  if(ao===0)S.morale=Math.min(mil().maxMorale,S.morale+mil().conqMorale);const loot=conquer(to,ao,SV,fr);let akin=0;
  // Akın (Börü): turda 1 kez, sağ kalan süvari hazır kalır
  if(ao===0&&hasAb('akin')&&SV.suv>0&&S.cd.akin!==S.turn){const T=S.regions[to];T.rd.suv=T.u.suv;sync(T);S.cd.akin=S.turn;akin=T.u.suv;if(S.stats)S.stats.akinN++}
  return{win:true,sent:n,surv:sumU(SV),lost:n-sumU(SV),dLost:dt,SV,loot,akin}}
 return defeat(ao,b)}
// Savaş istatistikleri (S.stats) ve kişilik izleri: Savunmacı karşı saldırısı (hit), Usta Akıncı Beyi etkisinin harcanması
function battleStat(ao,d0,c0,from,to,x){const st=S.stats;if(!st)return;
 if(ao===0||d0===0){st.batT.push(S.turn);if(st.batT.length>40)st.batT.shift()}
 if(ao===0){st.lastAtk=S.turn;if(x.win){st.atkWon++;st.conqT.push(S.turn);if(st.conqT.length>20)st.conqT.shift();if(x.loot)for(const k in x.loot.got)st.loot+=x.loot.got[k];if(c0&&isAI(d0))st.capsTaken++}else{st.atkLost++;st.lostT=S.turn}
  if(isAI(d0)&&S.ai[d0])S.ai[d0].hit={from,to,t:S.turn};if(S.buffs.some(b=>b.k==='bey'))S.buffs=S.buffs.filter(b=>b.k!=='bey')}
 else if(d0===0){if(x.win){st.defLost++;st.lostT=S.turn;st.lastLoss={t:S.turn,r:to,by:ao}}else st.defWon++}
 // 1c: en iyi savaş (en çok düşman öldürülen kazanılmış saldırı) ve en büyük kayıp (saldırı ya da savunma)
 if(ao===0&&x.win&&(!st.bestB||x.dLost>st.bestB.kill))st.bestB={t:S.turn,r:to,sent:x.sent,kill:x.dLost,lost:x.lost};
 const L=ao===0?x.lost:d0===0?x.dLost:0;if(L>0&&(!st.worstB||L>st.worstB.lost))st.worstB={t:S.turn,r:to,lost:L,k:ao===0?'saldırı':'savunma'}}
// Yağma (Akıncı): fethetmeden baskın
const canRaid=(from,to)=>hasAb('yagma')&&S.phase==='oyun'&&(S.cd.yagma||0)<=S.turn&&S.regions[from].owner===0&&S.regions[to].owner>0&&MAP.regions[from].adj.includes(to)&&!truceOn(S.regions[to].owner)&&!isVas(S.regions[to].owner)&&!atkLocked();
function raid(from,to,A){if(!canRaid(from,to)||!sumU(A))return null;const b=battle(0,from,to,A);b.A=A;const{F,T,n,ra,rd,dt}=b,Ab=ABIL.yagma;S.cd.yagma=S.turn+Ab.cd;
 if(!(ra>rd))return defeat(0,b);const fr=winFr(0,b),SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;addU(F,SV,false);
 const st=lootStore(to),got={};for(const k in st){got[k]=st[k]*.4;S.res[k]+=got[k]}

function conquer(i,o,comp,fr){
 const r=S.regions[i],old=r.owner,g=MAP.regions[i],store=o===0?lootStore(i):null,wasCap=r.capital;let loot=null;r.owner=o;r.u=Object.assign(Z(),comp);r.rd=Z();sync(r);r.fort=Math.max(0,r.fort-1);r.pop*=o===0?mil().conqPop:.7;r.raid=0;

 if(G1()){const U=BRK.unr;if(o===0){r.unr=r.lost0&&S.turn-r.lost0<=30?U.geri:old===NEUTRAL?U.kabile:wasCap?U.cap:U.rakip;if(isAI(old)&&r.dev){store.altin+=15*r.dev;r.dev--}}else{r.unr=0;if(old===0)r.lost0=S.turn}
  if(isAI(old)&&S.ai&&S.ai[old]&&o!==old){const a=S.ai[old];a.lostR=(a.lostR||[]).filter(x=>x.t>=S.turn-1&&x.i!==i);a.lostR.push({i,t:S.turn,by:o})}}
 if(o===0){r.auto=true;const rate=lootRate(fr==null?.7:fr);loot={store,rate,got:{},lost:{},yorgun:yorgun()};for(const k in store){loot.got[k]=store[k]*rate;loot.lost[k]=store[k]-loot.got[k];S.res[k]+=loot.got[k]}}
 if(old===0)S.morale=Math.max(0,S.morale-6);
 if(r.capital){r.capital=false;if(old!==NEUTRAL){const rest=S.regions.map((x,k)=>k).filter(k=>S.regions[k].owner===old);
  if(rest.length){const c=rest.sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];S.regions[c].capital=true;
   if(old===0){S.morale=Math.max(0,S.morale-20);log(`Başkentin ${g.name} düştü! Yeni başkent: ${MAP.regions[c].name}. Moral -20.`,'bad')}
   else log(`${facName(old)} başkenti ${g.name}'i kaybetti; yeni başkent ${MAP.regions[c].name}.`)}}}
 if(old>0&&old<NEUTRAL&&!S.regions.some(x=>x.owner===old)){log(`${facName(old)} yıkıldı!`,'good');if(o===0&&S.cfg&&!S.cfg.ais.some(f=>aliveAI(f)&&!isVas(f))){const n=fetihLeft().length;if(n)log(`⚔ Bütün rakipler yıkıldı. Fetih için ${n} kabile bölgesi kaldı (🏆 Hedef sekmesi).`,'good')}}
 if(wasCap&&S.stats)capFall(i,old,o);
 if(isAI(old)&&S.ai&&S.ai[old])S.ai[old].lost=(S.ai[old].lost||0)+1;
 if(old===0&&S.ai)for(const f of S.cfg.ais)if(isVas(f)&&g.adj.some(j=>S.regions[j].owner===f))S.ai[f].vlost=(S.ai[f].vlost||0)+1;
 return loot}
// Başkent düştü: Büyük Eser geriler, koalisyon üyesi çekilir ("Kılıç kırıldı"), rakibin eser yarışı sıfırlanır
function capFall(i,old,o){const W=S.wonder,C=S.coal,A=S.aiW;
 if(old===0){S.stats.capLost++;if(W.stage||W.build){const b=W.stage;W.stage=Math.max(0,W.stage-VIC.medeniyet.capLoss);W.build=0;log(`📜 Başkent düştü: Büyük Eser ${b} → ${W.stage} aşamaya geriledi.`,'bad')}}
 if(!isAI(old))return;
 if(C&&C.on&&C.mem.includes(old)){C.mem=C.mem.filter(x=>x!==old);C.out.push(old);if(o===0)S.stats.coalBroken++;
  log(`🗡 Kılıç kırıldı: ${facName(old)} başkentini kaybetti ve koalisyondan çekildi.`,'good');if(!C.mem.length){C.on=false;C.cd=S.turn+10;log('🤝 Koalisyon dağıldı: son üye de çekildi.','good')}}
 if(A.f===old&&(A.stage||S.medClosed===old)){log(`📜 ${facName(old)} başkentini kaybetti: Büyük Eseri yıkıldı.`,'good');A.stage=0;A.next=S.turn+VIC.medeniyet.aiEvery;if(S.medClosed===old){S.medClosed=null;log('📜 Medeniyet yolu yeniden açıldı.','good')}}}

function maxPop(i){const g=MAP.regions[i],r=S.regions[i];let m=TER[g.terrain].pop+(r.capital?25:0)+(g.feat==='liman'||g.feat==='kavsak'?10:0)+(g.feat==='verimli'?15:0);for(const f of r.fields)if(f.t==='tarla')m+=6*f.lv;return m}
const popFloor=i=>Math.ceil(maxPop(i)*.25);
const draftable=i=>Math.max(0,fl(S.regions[i].pop-popFloor(i)));
const workforce=i=>clamp(S.regions[i].pop/(maxPop(i)*.5),.4,1);
function slots(i){const g=MAP.regions[i],r=S.regions[i];return TER[g.terrain].slots+(r.capital?1:0)+(g.feat==='verimli'?1:0)}
function fieldEff(i,t){const g=MAP.regions[i],F=FIELD[t];let e=F.eff[g.terrain]||1;if(g.feat==='verimli'&&(t==='tarla'||t==='pazar'))e*=1.5;if(g.feat==='damar'&&(t==='demir'||t==='tasocagi'))e*=1.6;return e}
function fieldOut(i,f,lv=f.lv){const F=FIELD[f.t],M=mil();let v=F.base*LVM[lv]*fieldEff(i,f.t)*M.fieldMult*(S.regions[i].owner===0?workforce(i):1);if(F.r==='tahil')v*=M.tarla;if(F.r==='altin')v*=M.altinMult;
 if(M.fieldBy[f.t])v*=M.fieldBy[f.t];if(M.fieldAll!==1)v*=M.fieldAll;if(M.resMult[F.r])v*=M.resMult[F.r];if(F.r==='tahil'&&S.buffs&&S.buffs.length&&S.regions[i].owner===0)v*=buffMul('tarla');return v}
function prodParts(i){const g=MAP.regions[i],r=S.regions[i],p=[],M=mil(),am=M.altinMult,rm=M.resMult,fy=r.owner===0&&g.feat&&M.featY[g.feat]||g.feat&&FEAT[g.feat].y;
 for(const[k,v]of Object.entries(TER[g.terrain].y))p.push([TER[g.terrain].ad,k,(k==='altin'?v*am:v)*(rm[k]||1)]);
 if(fy)for(const[k,v]of Object.entries(fy))p.push([FEAT[g.feat].ad,k,k==='altin'?v*am:v]);
 if(r.capital)for(const[k,v]of Object.entries({tahil:2,altin:3,demir:2,bilgi:3}))p.push(['★ Başkent',k,k==='altin'?v*am:v]);
 r.fields.forEach(f=>p.push([`${FIELD[f.t].e} ${FIELD[f.t].ad} Sv.${f.lv}`,FIELD[f.t].r,fieldOut(i,f)]));return p}

function economy(){const gross={tahil:0,odun:0,tas:0,demir:0,altin:0,bilgi:0};let troops=0,uw=0,pop=0,mpop=0;

 if(a==='harac')return(S.cd.harac||0)>S.turn?`${S.cd.harac-S.turn} yıl sonra`:'hazır (Güç dengesi)';if(a==='kulliye')return'Büyük Eser −%25, aşama 2 yıl (Hedefler)';return'sürekli'}
function rulesHtml(){const c=S.cfg,D=DIFFS[c.diff],Zs=SIZES[c.size];let h=`<h4>Hanedan ve kurallar</h4>${dynHtml(c.dyn)}`;

 h+=`<div class=kv><span>🗺️ Harita</span><span>${ic(MAPTYPES[c.map].i)} ${MAPTYPES[c.map].ad} · ${Zs.ad} (${MAP.playN} bölge)</span></div><div class=kv><span>🎚️ Zorluk</span><span>${D.ad}${G1()?` · rakip ekonomisi ×${fmtX(D.eco*fxOf().aiGain)}`:D.aiGain!==1?` · rakip kazancı ×${fmtX(D.aiGain*fxOf().aiGain)}`:fxOf().aiGain!==1?` · rakip kazancı ×${fmtX(fxOf().aiGain)}`:''}</span></div>
 <div class=kv><span>🕊️ Barış dönemi</span><span>${c.grace}. yıla kadar${S.turn<c.grace?` (${c.grace-S.turn} yıl kaldı)`:' · bitti'}</span></div>`;
 if(c.coalAt!=null)h+=`<div class=kv><span>⚔ Koalisyon eşiği</span><span>%${Math.round(c.coalAt*100)} toprak${S.coal.on?` · <b class=bad>KURULDU (${S.coal.until-S.turn} yıl)</b>`:` · sende %${Math.round(own().length/MAP.playN*100)}`}</span></div>`;
 return h+`<div class=kv><span>🏆 Zafer yolları</span><span><button type=button class=lnk onclick="setTab('hedef')">Zafer sekmesi ›</button></span></div><div class=kv><span>⚔ Fetih hedefi</span><span>Bütün bölgeler (${MAP.playN}): ${c.ais.length} rakip ve kabileler</span></div><div class=kv><span>✨ Miras çarpanı</span><span>×${fmtX(scoreX(c))}</span></div>`}

 <p style="margin-top:0">${TX.setupLead(g.name,TER[g.terrain].ad+(g.feat?' · '+FEAT[g.feat].ad:''),c.fund,c.grace)}</p>
 <div class=rivals>${c.ais.map(f=>`<span class=chip title="${esc((aiDyn(f)?DYN[aiDyn(f)].aiPerk:'')+(S.ai[f].per!=='klasik'?(knowPers()?' · '+AIPERS[S.ai[f].per].d:' · Kişilik Haritacılık (Strateji I) ile görünür'):''))}">${emb(f,'sm')}${facName(f)}${persTag(f)}</span>`).join('')}</div>
 <div class=fundbox>💰 ${TX.setupFund}: <b>${S.fund}</b> akçe &nbsp;·&nbsp; ${TX.setupSlots}: ${fs.length}/${sl}</div><div class=cards>`;
 for(const[k,F]of Object.entries(FIELD)){const eff=fieldEff(cap,k),out=fieldOut(cap,{t:k,lv:1}),fc=fundCost(k),ok=S.fund>=fc&&fs.length<sl,mb=mil().fieldBy[k];
  h+=`<div class=card><div>${ic(F.i)} <b>${F.ad}</b></div><small>${RM[F.r].e} ${RM[F.r].ad} <b>+${r1(out)}</b>/yıl${mb&&mb!==1?` <span class="${mb>1?'good':'bad'}">(${ic(Dy.i)} ×${fmtX(mb)})</span>`:''}</small><small class="${eff>=1.3?'good':eff<.8?'bad':'muted'}">Verim: ${pct(eff)}</small><small class="muted ask">⚔ ${F.ask}</small><button class="btn sm ${ok?'primary':''}" ${ok?'':'disabled'} onclick="buyStart('${k}')">💰 ${fc} akçe</button></div>`}
 h+='</div>';
 if(fs.length)h+=`<h4>${TX.setupHas}</h4>`+fs.map((f,k)=>`<div class=item><div>${ic(FIELD[f.t].i)} <b>${FIELD[f.t].ad}</b><small>${RM[FIELD[f.t].r].e} +${r1(fieldOut(cap,f))}/yıl</small></div>${f.gift?'<span class=ok>🎁 Hediye</span>':`<button class="btn sm" onclick="unbuyStart(${k})">✕ Geri al</button>`}</div>`).join('');
 h+=`<div class=wz-nav><span class=muted style="flex:1;font-size:var(--t-xs);min-width:150px">${TX.setupLeft} <button type=button class=lnk onclick="showHelp()">Nasıl oynanır?</button></span><button class=btn onclick="quickSetup()" title="En verimli tesisleri al ve başla">${TX.setupVizier}</button><button class="btn primary" ${fs.length?'':'disabled'} onclick="finishSetup()">${TX.setupGo} ▶</button></div>`;
 modal('<div class=wz>'+h+'</div>','setup',true)}

function showHelp(){const c=S?S.cfg:normCfg(CFG_KLASIK);modal(`<h3>⚔ Fetih: Nasıl oynanır?</h3>
<p><b>Harita:</b> ${touchUI()?'Parmakla kaydır, iki parmakla yakınlaştır. Dokunarak bölge seç; kendi bölgen seçiliyken komşuya dokununca hedefin üstünde <b>Saldır / Taşı</b> düğmesi çıkar. Yönetim alttaki çekmecede: tutamacı yukarı çek ya da dokun. Yılı Bitir madalyonu sağ altta.':'Sürükleyerek kaydır, tekerlekle yakınlaştır. Sol tık bölge seçer, sağ tık seçili bölgenden saldırır ya da asker taşır (ya da komşuya tıklayınca çıkan <b>Saldır / Taşı</b> düğmesi). Çift tık yakınlaştırır. Tüm yönetim sağdaki panelde.'} Üst banttaki kaynaklara dokununca Hazine sekmesi açılır; ${touchUI()?'uzun basınca':'üstüne gelince'} ayrıntı görünür.</p>
<p><b>Ekonomi:</b> Tesisler kaynak üretir ve tahılla kurulup geliştirilir. Üretim bölgenin <b>işgücüne</b>, yani nüfusuna bağlıdır.</p>
<p><b>Nüfus ve ordu:</b> Askerler nüfustan çıkar. Nüfus tahıl stoğu varken büyür. Çok asker almak işgücünü ve üretimi düşürür. Birlikler altın, tahıl, demir ve odun ister. Ordu her tur tahıl ve altın tüketir.</p>
<p><b>Birlikler:</b> 🗡️ Piyade, 🏹 Okçu, 🐎 Süvari, 🪨 Kuşatma, ⚔️ Yeniçeri. Her askeri kuruluş kademesi yeni bir tür açar.</p>
<p><b>Arazi:</b> Sıradağlar geçilmezdir. Geçitler +%40 savunma verir. Köprüsüz nehir geçişi saldırıyı ×0,7'ye düşürür, süvariyi daha da fazla. Dağ ve ormanda savunma güçlüdür, süvari zayıftır.</p>
<p><b>Ganimet:</b> Fethettiğin bölgenin stokundan yalnızca bir pay (%30–70) ele geçer. Kalanı yangın ve yağmada zayi olur. Kayıpsız kazanmak daha çok ganimet kurtarır. Toprağın %15'i geçince savaş yorgunluğu bu payı ×0,6'ya dek düşürür.</p>
<p><b>Büyüklüğün bedeli:</b> ${idareN0()} bölgeden sonra her yıl <b>Divan gideri</b> (altın) ödenir. Başkentten uzak bölgeler daha az üretir (taşra verimi, en az %65). Yeni fethedilen bölge <b>huzursuzdur</b>: üretimi düşük başlar, ~10 yılda düzelir; garnizon yetmezse isyan çıkabilir. Stokların bir <b>tavanı</b> var: fazlası çürür; Ambar tavanı yükseltir.</p>
<p><b>Rakipler:</b> Rakiplerin bir hazinesi var: bölgelerinden gelir alır, ordu besler, toprak geliştirir ve donanımını yükseltir. Sen büyüdükçe birleşir ve güçlenirler; son toprakların direnişi çetindir. Vasalın bölgeleri ${VAS_LOYAL} yıllık sadakatten sonra senin sayılır; sadık vasal ilhak edilebilir.</p>
<p><b>Hanedan ve kartlar:</b> Her hanedanın güçlü ve zayıf yanları, kural kartlarının etkileri <b>Ordu</b> sekmesinin başında ve sonunda.</p>
<p><b>Zafer (🏆 Zafer sekmesi):</b> ⚔ <b>Fetih</b>: haritadaki bütün bölgeleri al (${c.ais.length} rakip ve bağımsız kabileler; vasalının bölgeleri senin sayılır). Rakipleri yıkmak tek başına yetmez; son bölgeler Zafer sekmesinde listelenir. 📜 <b>Medeniyet</b>: ${VIC.medeniyet.tech} teknoloji + başkentte 5 aşamalı Büyük Eser. 👑 <b>Hegemonya</b>: rakiplerin eski başkentlerinden ${SIZES[c.size].heg}'ini elinde ya da vasalının elinde ${VIC.hegemonya.hold} yıl tut. Bu ikisi oyunu kendiliğinden bitirmez: koşul sağlanınca zaferi alıp almayacağını sen seçersin (fetihe devam edersen kilometre taşı olarak kalır); Ferman olarak beyan ettiğin yol sormadan bitirir. İlk ${c.grace} yıl rakipler sana saldırmaz.${c.coalAt!=null?` Toprakların %${Math.round(c.coalAt*100)}'e ulaşınca rakipler koalisyon kurar.`:''}</p>
<p><b>Olaylar ve rakipler:</b> Birkaç yılda bir bir olay çıkar; seçimini yapmadan yıl bitmez (1/2/3 tuşları). Her rakibin bir kişiliği vardır (Saldırgan, Tüccar, Savunmacı, Fırsatçı): Haritacılık ile görünür.</p>
<div class=savebox><b style="font-size:var(--t-sm)">💾 Kayıt</b><span class=muted style="font-size:var(--t-xs);flex:1">${ST.ok?'Oyun bu tarayıcıya otomatik kaydedilir.':'Tarayıcı kaydı kapalı.'}</span>${S?`<button class="btn sm" onclick="copyText(exportSave(),'Kayıt panoya kopyalandı.')">📋 Kaydı kopyala</button>`:''}<button class="btn sm" onclick="showImport()">📥 Kayıt yükle</button></div>
<div class=row><button class="btn primary" onclick="closeModal();if(!TT.on){if(!S||!ART)startNew();else if(S.phase==='kurulus')showSetup()}">${S&&ART&&!TT.on?'Başla':'Tamam'}</button></div><div class=ver>Fetih v${GAME_VERSION} · kayıt v${SAVE_VER}</div>`,'help')}
function askNew(){startNew()}
function loadMsg(m){const l=$('#loadT'),L=$('#loading');if(l)l.textContent=m==='FETİH'?'':m;if(m==='FETİH'){const t=$('#loadTip');if(t)t.textContent=''}if(L){const v=m==='FETİH'?0:Math.min(.95,(+L.dataset.p||.05)+((.95-(+L.dataset.p||.05))*.22));L.dataset.p=v;L.style.setProperty('--lp',v)}}
function loadDone(){const L=$('#loading');if(L){L.dataset.p=1;L.style.setProperty('--lp',1)}}
async function boot(fn){if(boot.busy)return;boot.busy=true;loadTip();const L=$('#loading');L.style.display='flex';L.dataset.p=.05;L.style.setProperty('--lp',.05);loadMsg('Harita kuruluyor…');await frame();try{return await fn()}finally{if(ART)loadDone();$('#loading').style.display=ART?'none':'flex';if(!ART)loadMsg('FETİH');boot.busy=false}}

// Adım 0 karşılama · 1 hanedan · 2 kural kartları · 3 harita/boy/zorluk · 4 kuruluş (showSetup). Mevcut oyun ancak "Başlat"ta silinir.
const WZ={step:0,c:null,draw:[],redrawn:false,seed:''};
const wzSh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=fl(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wizInit(){const l=META.lastCfg,c={dyn:'boru',muts:[],map:'kita',size:'orta',diff:l?'kalfa':'cirak',dice:false,ferman:null,bonus:(META.equipped.bonus||[]).filter(b=>isOpen('bonus',b)).slice(0,bonusSlots()),target:l&&l.target&&!META.ach[l.target]?l.target:null};if(l)for(const k of['dyn','map','size','diff'])if(l[k])c[k]=l[k];
 for(const[k,cat,d]of[['dyn','dyn','boru'],['map','map','kita'],['size','size','orta'],['diff','diff','cirak']])if(!isOpen(cat,c[k]))c[k]=d;
 WZ.c=c;WZ.redrawn=false;WZ.seed='';wizDraw()}
function wizDraw(){WZ.draw=wzSh(META.unlocked.mut.filter(m=>MUTS[m])).slice(0,3);WZ.c.muts=[];WZ.c.dice=false;WZ.flip=true}
function startNew(){if(boot.busy)return;if(!META)loadMeta();wizInit();WZ.step=0;WZ.last=null;WZ.tt=TT.on;wizShow()}
function wizGo(n){n=clamp(n,0,3);if(n===2&&WZ.step!==2)WZ.flip=true;WZ.step=n;wizShow();const m=$('#modal');if(m)m.scrollTop=0}
function wizSet(k,v){WZ.c[k]=v;if(k==='diff'&&mutBanned(WZ.c.muts,v)){WZ.c.muts=WZ.c.muts.slice(0,1);toast('Bu iki kart Destan zorlukta birlikte seçilemez.')}wizShow()}
function wizUnlock(cat,id){if(unlockItem(cat,id)){WZ.unl=cat+':'+id;toast('🔓 Açıldı!','good');if(cat==='mut'&&!WZ.draw.includes(id))WZ.draw.push(id)}wizShow()}
function wizRandDyn(){const o=['klasik',...DYN6].filter(d=>isOpen('dyn',d)&&d!==WZ.c.dyn);if(o.length)WZ.c.dyn=o[fl(Math.random()*o.length)];wizShow()}
function wizMut(m){const c=WZ.c;c.dice=false;if(c.muts.includes(m))c.muts=c.muts.filter(x=>x!==m);else{const n=c.muts.concat(m);if(n.length>2){toast('En fazla 2 kart seçebilirsin.');return}if(mutBanned(n,c.diff)){toast('Bu iki kart birlikte seçilemez.');return}c.muts=n}wizShow()}
function wizDice(){const pool=META.unlocked.mut.filter(m=>MUTS[m]);let p;for(let k=0;k<50;k++){p=wzSh(pool).slice(0,2);if(!mutBanned(p,WZ.c.diff))break}WZ.draw=p.slice();WZ.c.muts=p;WZ.c.dice=true;WZ.flip=true;wizShow()}
function wizRedraw(){if(WZ.redrawn)return;WZ.redrawn=true;wizDraw();wizShow()}
function wizAgain(c){c=c||META.lastCfg;launch(fl(Math.random()*1e9),normCfg({bonus:(META.equipped.bonus||[]).filter(b=>isOpen('bonus',b)),...c,daily:null,train:false,rematch:false}))}
function quickStart(){launch(fl(Math.random()*1e9),normCfg(CFG_HIZLI))}
// Tohum alanı: sayı ya da FTH-… kodu (kod kuralları kurar; kilitli içerik içeren kod antrenman sayılır; FTH-D… günlük)
function wizStart(){const t=String(WZ.seed||'').trim();if(/^fth-/i.test(t)){const p=parseCode(t);if(!p){toast('Kod çözülemedi: FTH-… biçimini kontrol et.');return}if(p.daily){startDaily(p.daily);return}
  const c=normCfg({...p.cfg,ferman:WZ.c.ferman,bonus:WZ.c.bonus,target:WZ.c.target});c.train=lockedIn(c);if(c.train)toast('Kodda kilitli içerik var: oyun antrenman sayılacak.');launch(p.seed,c);return}
 const sd=/^\d{1,9}$/.test(t)?+t:fl(Math.random()*1e9);launch(sd,normCfg(WZ.c))}
// Yeni oyun: son ayar yalnız sıradan oyunlarda hatırlanır (günlük/rövanş/antrenman değil). S.gid: miras çifte ödül koruması için oyun kimliği.
function launch(seed,cfg){if(boot.busy)return;if(!META)loadMeta();if(!cfg.daily&&!cfg.rematch&&!cfg.train){META.lastCfg={dyn:cfg.dyn,muts:cfg.muts.slice(),map:cfg.map,size:cfg.size,diff:cfg.diff,dice:cfg.dice,ferman:cfg.ferman,target:cfg.target};META.equipped.bonus=cfg.bonus.slice()}saveMeta();closeModal();hideTitle();
 boot(async()=>{await newGameAsync(seed,cfg);S.gid=Date.now().toString(36)+'-'+fl(Math.random()*1e9).toString(36);freshStart();showSetup()})}
// Adım göstergesi (§6.4): numaralı daireler + çizgi, geçilen adım onay ikonlu. 4. adım kuruluş penceresidir
function wzSteps(st){return`<div class=wz-steps role=list aria-label="Adım ${st}/4">${['Hanedan','Kartlar','Harita','Kuruluş'].map((s,k)=>{const c=k+1===st?'on':k+1<st?'done':'';return`<span class="${c}" role=listitem${c==='on'?' aria-current=step':''}><i>${k+1<st?ic('onay'):k+1}</i><em>${s}</em></span>`}).join('')}</div>`}
function wizShow(){const st=WZ.step,a=WZ.last!=null&&WZ.last!==st?(st>WZ.last?' ar':' al'):'';WZ.last=st;
 modal('<div class=wz>'+(st>0?wzSteps(st):'')+`<div class="wzb${a}">`+[wz0,wz1,wz2,wz3][st]()+'</div></div>','wiz',true);WZ.flip=false;WZ.unl=null}

 const tt=WZ.tt&&TT.on;return`<h3>${TX.newT}</h3>${can&&!tt?`<button class="btn wide" onclick="closeModal()">▶ ${TX.cont} <small class=muted>(${S.turn}. yıl)</small></button>`:''}

  ${can?`<p class=muted style="font-size:var(--t-xs)">${TX.wipe}</p>`:''}
  ${tt?'':`<button class="btn wide" onclick="showMiras('wiz')">🏛 Miras · <b>${fl(META.mp)} MP</b> <small class=muted>· açılımlar, başarımlar (${ACH.filter(a=>META.ach[a.id]).length}/${ACH.length}), rekorlar</small></button>`}
  ${wzQuick()}<div class=ver>${ST.ok?'':'Tarayıcı kaydı kapalı · '}Fetih v${GAME_VERSION}</div>`}

 for(const d of['klasik',...DYN6]){const D=DYN[d],op=isOpen('dyn',d),A=D.ab&&ABIL[D.ab];

// Parşömen lifi ve deri greni açılışta bir kez, tohumlu gürültüyle (Math.random yok) küçük döşeme olarak üretilir → CSS --tex-parch / --tex-cilt.
// Döşeme dikişsizdir (dört kaydırılmış örneğin çift doğrusal karışımı). Parşömen alfası ≤ ,05, deri ≤ ,08: metin kontrastı fiilen değişmez. Süre window.__texMs
function texTile(n,seed,f){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),im=x.createImageData(n,n),d=im.data,N=makeNoise(mulberry32(seed)),R=mulberry32(seed+7);
 const sm=(px,py,sx,sy,o)=>{const u=px/n,v=py/n,a=fbm(N,px*sx,py*sy,o),b=fbm(N,(px-n)*sx,py*sy,o),q=fbm(N,px*sx,(py-n)*sy,o),e=fbm(N,(px-n)*sx,(py-n)*sy,o);return(a*(1-u)+b*u)*(1-v)+(q*(1-u)+e*u)*v};
 for(let y=0;y<n;y++)for(let i=0;i<n;i++){const k=(y*n+i)*4,p=f(sm,i,y,R);d[k]=p[0];d[k+1]=p[1];d[k+2]=p[2];d[k+3]=p[3]}
 x.putImageData(im,0,0);return c.toDataURL('image/png')}
function texInit(){if(TEST||texInit.done)return;texInit.done=1;const t0=performance.now();
 try{const r=document.documentElement.style;
  r.setProperty('--tex-parch',`url(${texTile(160,1453,(sm,x,y,R)=>{let v=(sm(x,y,.02,.02,3)-.5)*1.1+(sm(x,y,.014,.3,2)-.5)*.7;if(R()<.002)v=.8;const a=Math.min(.05,Math.abs(v)*.1)*255;return v>0?[92,62,30,a]:[255,250,236,a*.8]})})`);
  r.setProperty('--tex-cilt',`url(${texTile(96,1071,(sm,x,y)=>{const v=(sm(x,y,.13,.13,2)-.5)*1.3+(sm(x,y,.035,.035,2)-.5)*.7,a=Math.min(.08,Math.abs(v)*.15)*255;return v>0?[0,0,0,a]:[255,228,186,a*.6]})})`)}
 catch(e){}window.__texMs=Math.round((performance.now()-t0)*10)/10}
