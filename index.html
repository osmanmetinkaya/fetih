<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fetih</title>
<style>
:root{--bg:#16120e;--panel:#221c16;--panel2:#2d251d;--line:#4a3d2e;--text:#efe6d6;--muted:#a99b84;--accent:#d9a441;--good:#86b86f;--bad:#e0635c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title{font:800 17px Georgia,serif;color:var(--accent);letter-spacing:1px}
.res{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.r{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:help;white-space:nowrap}
.r b{font-variant-numeric:tabular-nums}
.r .inc{font-size:11px;margin-left:3px}
.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}
main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1;position:relative;min-width:0;min-height:0;background:#0d1a26;overflow:hidden;touch-action:none}
#view{display:block;cursor:grab}
#view.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(34,28,22,.9);color:var(--text);font-size:17px;cursor:pointer}
.mapctl button:hover{border-color:var(--accent)}
.hint{position:absolute;left:10px;bottom:10px;background:rgba(20,16,12,.8);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted);pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(20,16,12,.95);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;display:none;max-width:320px;z-index:5}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1a26;font:600 18px Georgia,serif;color:var(--accent);z-index:6}
aside{width:420px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 2px;cursor:pointer;font:inherit;font-size:13px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);background:var(--panel)}
#panel{flex:1;overflow:auto;padding:12px 14px}
.foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}
.btn.danger{background:#7a2a24;border-color:#a8433b}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.big{flex:1;padding:10px;font-size:15px}
.btn.wide{width:100%;margin-top:10px}
h2{margin:0;font:700 19px Georgia,serif}h3{margin:0 0 10px;font-family:Georgia,serif}h4{margin:16px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.rh{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.4);vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats>div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{font-size:16px}.stats small{display:block;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--panel2);border-radius:4px;padding:2px 6px;font-size:12px}
.feat{background:#3a2f1f;border:1px solid #6b5530;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:12.5px}
.warn{background:#3d1f1b;border:1px solid #7a3a30;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:12.5px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #3a3025}
.item small{display:block;color:var(--muted);font-size:11.5px}
.ok{color:var(--good);font-weight:700}
.rec{display:flex;align-items:center;gap:8px;margin-top:6px}
.rec input[type=range]{flex:1}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:12.5px}
.bar{height:8px;background:#3a3025;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #3a3025;font-size:13px}
.kv span:first-child{color:var(--muted)}
.log p{margin:0 0 6px;font-size:13px}
.log .t{color:var(--muted);font-size:11px;margin-right:4px}
.good{color:var(--good)}.bad{color:var(--bad)}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.sub{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}
.sub button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12.5px}
.sub button.on{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.card small{font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.fundbox{background:#3a2f1f;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:15px}
.stars{color:var(--accent);letter-spacing:1px}
.step{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2)}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step.done{opacity:.65}.step.lock{opacity:.5}
.step .info{flex:1}.step small{display:block;color:var(--muted);font-size:11.5px}
.lv{font-weight:800;width:28px;height:28px;border-radius:50%;background:#3f3324;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.step.done .lv{background:#3d5530;color:#cfe8bf}
.tree{display:grid;grid-template-columns:92px repeat(4,1fr);gap:6px 12px}
.tree .th{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase}
.tree .brn{font-weight:700;font-size:12px;display:flex;align-items:center}
.node{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:11.5px;cursor:pointer;background:var(--panel2);position:relative;font-weight:600;line-height:1.25}
.node small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.node:hover,.node.sel{border-color:var(--accent)}
.node.sel{box-shadow:0 0 0 2px var(--accent)}
.node.done{border-color:#5d7f48;background:#26301f}
.node.avail{border-color:#b98a35}
.node.lock{opacity:.5}
.node::before{content:'›';position:absolute;left:-10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.node.n0::before{content:none}
.tdet{margin-top:12px;border:1px solid var(--accent);border-radius:8px;padding:10px 12px;background:#2a2219}
.prog{display:flex;gap:4px;margin:10px 0}
.prog i{flex:1;height:6px;border-radius:3px;background:#3a3025}
.prog i.d{background:var(--good)}.prog i.c{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 5px;border-bottom:1px solid #3a3025;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.urow{display:grid;grid-template-columns:130px 1fr 30px 34px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.switch{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#modal.wide{width:min(680px,100%)}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
.chance{font-size:28px;font-weight:800;text-align:center;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2f22;border:1px solid var(--accent);padding:8px 14px;border-radius:6px;display:none;z-index:1001}
@media (max-width:860px){main{flex-direction:column}aside{width:auto;height:46vh;border-left:0;border-top:1px solid var(--line)}.tree{grid-template-columns:70px repeat(4,minmax(70px,1fr))}}
</style>
</head>
<body>
<header>
  <span class="title">⚔ FETİH</span>

</header>
<main>
  <div id="mapWrap">
    <canvas id="view"></canvas>
    <div class="mapctl"><button onclick="zoomBy(1.3)" title="Yakınlaştır">＋</button><button onclick="zoomBy(1/1.3)" title="Uzaklaştır">－</button><button onclick="fitCam()" title="Tüm harita">⤢</button><button onclick="focusSel()" title="Seçili bölgeye git">◎</button></div>
    <div class="hint">Sol tık: seç · Sağ tık: saldır / taşı · Sürükle: kaydır · Tekerlek: yakınlaştır</div>
    <div id="tip"></div>
    <div id="loading">Harita çiziliyor…</div>
  </div>
  <aside>
    <nav class="tabs" id="tabs">
      <button data-t="bolge">🏰 Bölge</button><button data-t="eko">💰 Ekonomi</button><button data-t="ordu">⚔ Ordu</button><button data-t="tek">📜 Teknoloji</button><button data-t="kayit">📖 Kayıt</button>
    </nav>
    <div id="panel"></div>
    <div class="foot">
      <button class="btn" onclick="askNew()" title="Yeni oyun">↻</button>
      <button class="btn" onclick="showHelp()" title="Nasıl oynanır">?</button>
      <button class="btn primary big" id="endBtn" onclick="endTurn()">Turu Bitir ▶</button>
    </div>
  </aside>
</main>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>

function remU(r,c,fromReady){for(const k of UK){const v=Math.min(r.u[k],c[k]||0);r.u[k]-=v;if(fromReady)r.rd[k]=Math.max(0,r.rd[k]-v);r.rd[k]=Math.min(r.rd[k],r.u[k])}sync(r)}

 starts.forEach((i,f)=>{const r=S.regions[i];r.owner=f;r.capital=true;r.fort=1;addU(r,f===0?{piy:15}:{piy:14,okc:4},true);if(f===0)r.mil=1});

 else if(o!==NEUTRAL&&aiB())p.push(['Düşman teknolojisi',aiB()]);return p}

function siegeOf(o,fort,A){if(!fort)return 0;let b;if(o===0){const M=mil();b=M.siege*Math.min(1,S.res.odun/(fort*WOOD*M.woodMult))}else b=S.turn>15?.35:.15;return Math.min(.95,b+unitSiege(A))}
function defParts(i,siege){const r=S.regions[i],g=MAP.regions[i],p=[];if(TER[g.terrain].def)p.push(['Arazi ('+TER[g.terrain].ad+')',TER[g.terrain].def]);
 if(g.feat&&FEAT[g.feat].def)p.push([FEAT[g.feat].ad,FEAT[g.feat].def]);if(r.capital)p.push(['★ Başkent',.2]);

 const aP=rawAtk(A,from,to,ao)*am,dP=rawDef(T.u)*defMult(to,siege);remU(F,A,true);

 if(ra>rd){let fr=rd>0?Math.sqrt(1-(rd/ra)**2):1;if(ao===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.conqLoss}const SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;

 let fr=Math.sqrt(1-(ra/rd)**2);if(T.owner===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.defLoss}const DS=scaleU(D,fr);if(sumU(DS)<1)DS[UK.find(k=>D[k])||'piy']=1;

function maxPop(i){const g=MAP.regions[i],r=S.regions[i];let m=TER[g.terrain].pop+(r.capital?25:0)+(g.feat==='liman'||g.feat==='kavsak'?10:0)+(g.feat==='verimli'?15:0);for(const f of r.fields)if(f.t==='tarla')m+=6*f.lv;return m}

 for(const[k,v]of Object.entries(TER[g.terrain].y))p.push([TER[g.terrain].ad,k,k==='altin'?v*am:v]);
 if(g.feat&&FEAT[g.feat].y)for(const[k,v]of Object.entries(FEAT[g.feat].y))p.push([FEAT[g.feat].ad,k,k==='altin'?v*am:v]);
 if(r.capital)for(const[k,v]of Object.entries({tahil:2,altin:3,demir:2,bilgi:3}))p.push(['★ Başkent',k,k==='altin'?v*am:v]);
 r.fields.forEach(f=>p.push([`${FIELD[f.t].e} ${FIELD[f.t].ad} Sv.${f.lv}`,FIELD[f.t].r,fieldOut(i,f)]));return p}

 return{gross,up,net,troops,pop,mpop}}

 const gain=Math.round(1+Math.min(mine.length,12)*.5+Math.max(0,mine.length-12)*.25+S.turn*.02),half=Math.ceil(gain/2);addU(R[cap],aiMix(half),false);

   if(prev===0)ev.push(res.win?{m:`${FAC[f].ad}, ${tn} bölgeni ele geçirdi!${wasCap?' Başkentin düştü!':''}`,c:'bad'}:{m:`${FAC[f].ad} ${tn} bölgene ${res.sent} askerle saldırdı ama püskürtüldü. Düşman ${res.lost} asker kaybetti.`,c:'good'});

 mine=[];R.forEach((r,i)=>{if(r.owner===f)mine.push(i)});const dist=new Map(),q=[];

 if(i==null){const o=own();return`<p class=muted style="margin-top:0">Haritadan bir bölge seç. Kendi bölgen seçiliyken komşu bölgeye <b>sağ tıklayarak</b> saldırabilir ya da asker taşıyabilirsin.</p><h4>Bölgelerin (${o.length})</h4>`+o.map(k=>`<div class=item><div>${regLink(k)}<small>${TER[MAP.regions[k].terrain].ad} · nüfus ${fl(S.regions[k].pop)}</small></div><span>🛡 ${S.regions[k].troops}</span></div>`).join('')}
 const g=MAP.regions[i],r=S.regions[i];
 if(g.block)return`<h2>🏔️ ${g.name}</h2><p class=muted>Geçilmez sıradağlar. Ordular bu dağları aşamaz. Çevresindeki geçitleri tutan, bölgenin kapısını tutar.</p>`;
 const mine=r.owner===0,mx=maxPop(i);
 h+=`<div class=rh><span class=dot style="background:${rgb(FAC[r.owner].col)}"></span><h2>${g.name}${r.capital?' ★':''}</h2></div><div class=muted>${TER[g.terrain].ad} · ${FAC[r.owner].ad}</div>
 ${g.feat?`<div class=feat><b>${FEAT[g.feat].ad}</b> — ${FEAT[g.feat].d}</div>`:''}
 <div class=stats><div><span>Asker</span><b>${vis(i).txt}</b>${mine?`<small>hazır ${r.ready}</small>`:''}</div><div><span>Nüfus</span><b>${fl(r.pop)}</b><small>/ ${mx}${mine?` · +${r1(popGrowth(i))}/tur`:''}</small></div><div><span>Savunma</span><b>×${defMult(i,0).toFixed(2)}</b><small>sur ${r.fort}</small></div></div>`;
 if(mine){const tabs=[['genel','Genel'],['tesis',`Tesisler ${r.fields.length}/${slots(i)}`],['asker','Asker'],['sur','Savunma']];
  h+=`<div class=sub>${tabs.map(([k,a])=>`<button class="${ui.rtab===k?'on':''}" onclick="setRTab('${k}')">${a}</button>`).join('')}</div>`;
  h+=({genel:rgGenel,tesis:rgTesis,asker:rgAsker,sur:rgSur})[ui.rtab](i)}
 else h+=rgGenel(i);
 return h}
function rgGenel(i){const g=MAP.regions[i],r=S.regions[i],mine=r.owner===0;let h=`<div class=kv style="margin-top:8px"><span>Birlikler</span><span>${mine||mil().spy?compTxt(r.u):'bileşim bilinmiyor'}</span></div>`;
 if(mine){const wf=workforce(i);h+=`<div class=kv><span>👥 İşgücü</span><span class="${wf<1?'bad':''}">%${Math.round(wf*100)} (tesis üretimi)</span></div><div class=kv><span>Askere alınabilir nüfus</span><span>${draftable(i)}</span></div>`;
  if(wf<1)h+=`<div class=warn>Nüfus azami değerin yarısının altında. Tesisler tam kapasite çalışmıyor. Asker almayı yavaşlat ya da tahıl stoğunu koru ki nüfus büyüsün.</div>`}
 const parts=mine?prodParts(i):prodParts(i).filter(p=>!p[0].startsWith('★'));
 h+=`<h4>${mine?'Üretim / tur':'Ele geçirirsen üretir'}</h4><table>${parts.map(([s,k,v])=>`<tr><td>${s}</td><td>${RM[k].e} ${RM[k].ad}</td><td class=pos>${sgn(v)}</td></tr>`).join('')||'<tr><td class=muted>Üretim yok</td></tr>'}</table>`;
 h+=`<h4>Savunma çarpanı</h4>${defParts(i,0).map(([k,v])=>`<div class=kv><span>${k}</span><span>+${pct(v)}</span></div>`).join('')||'<p class=muted style="margin:0">Ek savunma yok.</p>'}`;
 h+=`<h4>Komşular</h4>`;
 for(const j of g.adj){const rj=S.regions[j],c=crossAt(i,j);let act='';
  if(mine&&rj.owner!==0){const p=previewAtk(i,j,r.rd);act=`<button class="btn sm" ${r.ready<1||S.over||S.phase!=='oyun'?'disabled':''} onclick="openAttack(${i},${j})">⚔️ <span style="color:${chanceCol(p.ch)}">%${Math.round(p.ch*100)}</span></button>`}
  else if(mine&&rj.owner===0)act=`<button class="btn sm" ${r.ready<1?'disabled':''} onclick="openMove(${i},${j})">➜ Taşı</button>`;
  else if(!mine&&rj.owner===0)act=`<button class="btn sm" ${rj.ready<1||S.over||S.phase!=='oyun'?'disabled':''} onclick="openAttack(${j},${i})">⚔️ Buradan (${rj.ready})</button>`;
  h+=`<div class=item><div>${regLink(j)}<small>${TER[MAP.regions[j].terrain].ad}${MAP.regions[j].feat?' · '+FEAT[MAP.regions[j].feat].ad:''} · asker ${vis(j).txt}${rj.fort?' · sur '+rj.fort:''}${c?(c.bridge?' · 🌉 köprü':' · 🌊 nehir'):''}</small></div>${act}</div>`}
 const mtn=g.rawAdj.filter(k=>MAP.blk[k]);if(mtn.length)h+=`<p class=muted style="font-size:12px">🏔️ Sıradağlarla komşu: ${mtn.map(k=>MAP.regions[k].name).join(', ')}</p>`;
 return h}
function rgTesis(i){const r=S.regions[i],M=mil(),sl=slots(i);
 let h=`<p class=muted style="font-size:12.5px;margin-top:0">Tesisler ağırlıkla 🌾 tahılla kurulur ve geliştirilir. Üretim bölgenin işgücüne bağlıdır (şu an %${Math.round(workforce(i)*100)}). Azami seviye <b>Sv.${M.maxField}</b>.</p>`;
 if(!r.fields.length)h+='<p class=muted>Bu bölgede henüz tesis yok.</p>';
 r.fields.forEach((f,k)=>{const F=FIELD[f.t];let act;
  if(f.lv>=5)act='<span class=ok>Azami</span>';else if(f.lv>=M.maxField){const q=fieldReq(f.lv+1);act=`<small class=muted>🔒 ${techName(q[0],q[1])}</small>`}
  else{const c=upFieldCost(f);act=`<button class="btn sm ${canPay(c)?'primary':''}" ${canPay(c)?'':'disabled'} onclick="upgradeField(${i},${k})">⬆ ${costTxt(c)}</button>`}
  h+=`<div class=card style="margin-bottom:8px"><div class=rh style="justify-content:space-between"><span>${F.e} <b>${F.ad}</b> <span class=stars>${'★'.repeat(f.lv)}${'☆'.repeat(5-f.lv)}</span></span>${act}</div>
  <small>${RM[F.r].e} Şimdi <b>+${r1(fieldOut(i,f))}</b>/tur${f.lv<5?` → Sv.${f.lv+1}: <b class=pos>+${r1(fieldOut(i,f,f.lv+1))}</b>`:''} · verim ${pct(fieldEff(i,f.t))}</small><small class=muted>⚔ ${F.ask}</small></div>`});
 h+=`<h4>Yeni tesis kur (${r.fields.length}/${sl})</h4>`;
 if(r.fields.length>=sl)h+='<p class=muted>Tüm yuvalar dolu. Mevcut tesisleri geliştir.</p>';
 else for(const[k,F]of Object.entries(FIELD)){const c=newFieldCost(k),eff=fieldEff(i,k);
  h+=`<div class=item><div>${F.e} <b>${F.ad}</b><small>${RM[F.r].e} +${r1(fieldOut(i,{t:k,lv:1}))}/tur · <span class="${eff>=1.3?'good':eff<.8?'bad':''}">verim ${pct(eff)}</span></small></div><button class="btn sm" ${canPay(c)?'':'disabled'} onclick="buildField(${i},'${k}')">${costTxt(c)}</button></div>`}
 return h}
function rgAsker(i){const r=S.regions[i],M=mil();
 let h=`<p class=muted style="font-size:12.5px;margin-top:0">Birlikler bölgenin <b>nüfusundan</b> çıkar. Nüfusun en az %25'i yerinde kalmalıdır. Askere alınabilir nüfus: <b>${draftable(i)}</b>. Kuruluş kademeleri üretimi hızlandırır ve yeni birlik türleri açar.</p>`;
 for(let k=1;k<=5;k++){const m=MIL[k],done=r.mil>=k,cur=r.mil===k,next=r.mil+1===k,techOk=S.tech.ure>=m.tech,nu=UK.filter(q=>UNITS[q].mil===k);let right='';
  if(cur)right='<span class=ok>Mevcut</span>';else if(done)right='<span class=ok>✓</span>';
  else if(next)right=techOk?`<button class="btn sm ${canPay(m.cost)?'primary':''}" ${canPay(m.cost)?'':'disabled'} onclick="upgradeMil(${i})">${r.mil?'⬆':'🏗'} ${costTxt(m.cost)}</button>`:`<small class=muted>🔒 ${techName('ure',m.tech)}</small>`;
  h+=`<div class="step ${cur?'cur':done?'done':next&&techOk?'':'lock'}"><div class=lv>${ROM[k]}</div><div class=info><b>${m.ad}</b> <span style="font-size:12px">· ${nu.map(q=>UNITS[q].e+' '+UNITS[q].ad).join(', ')}</span><small>+${fl(m.auto*M.autoMult)} puan/tur · kapasite ${m.lim}${m.disc?` · maliyet -%${m.disc*100}`:''}</small></div>${right}</div>`}
 if(!r.mil)return h+'<p class=muted>Bu bölgede birlik yetiştirmek için önce Karakol kur.</p>';
 const at=autoType(i),left=recLeft(i);
 h+=`<h4>Otomatik üretim</h4><div class=rec><label class=switch><input type=checkbox ${r.auto?'checked':''} onchange="toggleAuto(${i})"> Her tur</label><b>${autoRate(i)}</b>
 <select onchange="setAutoU(${i},this.value)">${UK.filter(k=>r.mil>=UNITS[k].mil).map(k=>`<option value=${k} ${k===at?'selected':''}>${UNITS[k].e} ${UNITS[k].ad}</option>`).join('')}</select></div>
 <small class=muted>Tanesi ${costTxt(unitCost(i,at))} + ${UNITS[at].pop} nüfus. Nüfus ya da kaynak yetmezse üretim durur.</small>
 <h4>Birlik topla · kalan kapasite ${left}</h4>`;
 for(const k of UK){const U=UNITS[k],un=r.mil>=U.mil,c=unitCost(i,k),mx=un?canRecruit(i,k):0;
  h+=`<div class=card style="margin-top:6px;${un?'':'opacity:.5'}"><div class=rh style="justify-content:space-between"><span>${U.e} <b>${U.ad}</b> <small class=muted>⚔${U.atk} 🛡${U.def} · ${U.w} puan</small></span><span class=muted style="font-size:12px">${r.u[k]?'burada '+r.u[k]:''}</span></div>
  <small class=muted>${U.d}</small><small>${costTxt(c)} · 👥${U.pop} · bakım ×${U.up}</small>
  ${!un?`<small class=muted>🔒 ${MIL[U.mil].ad} gerekli</small>`:mx>0?`<div class=rec><input type=range id=rc${k} min=1 max=${mx} value=${mx} oninput="$('#rv${k}').textContent=this.value"><b id=rv${k} style="min-width:24px">${mx}</b><button class="btn primary sm" onclick="recruit(${i},'${k}',+$('#rc${k}').value)">Topla</button></div>`:`<small class=muted>${left<U.w?'Bu turun kapasitesi doldu.':draftable(i)<U.pop?'Askere alınabilir nüfus yok.':'Yetersiz kaynak.'}</small>`}</div>`}
 return h}
function rgSur(i){const r=S.regions[i],M=mil(),mx=maxFort(i);
 let h=`<p class=muted style="font-size:12.5px;margin-top:0">Surlar taşla yapılır. Her seviye <b>+${pct(M.fortPer)}</b> savunma verir. Düşman kuşatma araçları ve odunla bu bonusun bir kısmını kırabilir.</p>`;
 for(let k=1;k<=Math.max(5,mx);k++){const done=r.fort>=k,next=r.fort+1===k,avail=k<=mx;let right='';
  if(done)right='<span class=ok>✓</span>';else if(next&&avail){const c=surCost(i);right=`<button class="btn sm ${canPay(c)?'primary':''}" ${canPay(c)?'':'disabled'} onclick="buildSur(${i})">🧱 ${costTxt(c)}</button>`}
  else if(!avail)right=`<small class=muted>🔒 ${k<=4?techName('sav',2):techName('sav',3)}</small>`;
  h+=`<div class="step ${done?'done':next&&avail?'cur':'lock'}"><div class=lv>${k}</div><div class=info><b>Sur seviyesi ${k}</b><small>Toplam sur bonusu +${pct(k*M.fortPer)}</small></div>${right}</div>`}
 h+=`<h4>Savunma çarpanı</h4>${defParts(i,0).map(([k,v])=>`<div class=kv><span>${k}</span><span>+${pct(v)}</span></div>`).join('')}<div class=kv><span>🔥 Moral</span><span>×${moraleMult(S.morale).toFixed(2)}</span></div><div class=kv><span>Toplam</span><b>×${defMult(i,0).toFixed(2)}</b></div>`;
 return h}

// --- Teknoloji sekmesi ---
function techState(b,k){return S.tech[b]>k?'done':S.tech[b]===k?'avail':'lock'}
function selTech(id){ui.tsel=id;renderPanel()}
function pTech(){if(!ui.tsel){const b=BR.find(b=>S.tech[b.id]<4);ui.tsel=b?b.id+S.tech[b.id]:'sal0'}
 let h=`<p class=muted style="margin-top:0">📜 Bilgi: <b style="color:var(--text)">${fl(S.res.bilgi)}</b> (${sgn(economy().net.bilgi)}/tur). Her dalda bir kademeyi açınca sonraki aktif olur. Ayrıntı için tıkla.</p>
 <div class=tree><div></div>${[1,2,3,4].map(k=>`<div class=th>Kademe ${ROM[k]}</div>`).join('')}`;
 BR.forEach(b=>{h+=`<div class=brn>${b.e} ${b.ad}</div>`;b.t.forEach((t,k)=>{const st=techState(b.id,k);
  h+=`<div class="node ${st} n${k} ${ui.tsel===b.id+k?'sel':''}" onclick="selTech('${b.id}${k}')">${st==='done'?'✓ ':st==='lock'?'🔒 ':''}${t.ad}<small>${st==='done'?'Açıldı':st==='avail'&&S.res.bilgi>=TCOST[k]?'<span class=good>📜'+TCOST[k]+' hazır</span>':'📜'+TCOST[k]}</small></div>`})});
 h+='</div>';
 const b=ui.tsel.slice(0,3),k=+ui.tsel.slice(3),B=BR.find(x=>x.id===b),t=B.t[k],st=techState(b,k),e=economy().net.bilgi;
 h+=`<div class=tdet><div class=rh><span style="font-size:26px">${B.e}</span><div><b style="font-size:16px">${t.ad}</b><div class=muted style="font-size:12px">${B.ad} · Kademe ${ROM[k+1]}</div></div></div>
 <div class=prog>${[0,1,2,3].map(q=>`<i class="${S.tech[b]>q?'d':q===k?'c':''}"></i>`).join('')}</div>
 <p style="margin:0 0 8px">${t.d}</p>
 <div class=kv><span>Gereksinim</span><span>${k?`${S.tech[b]>=k?'✓':'✗'} ${B.t[k-1].ad}`:'Yok'}</span></div>
 <div class=kv><span>Açtığı</span><span>${k<3?B.t[k+1].ad:'Dalın sonu'}</span></div>
 <div class=kv><span>Maliyet</span><b>📜 ${TCOST[k]}</b></div>`;
 if(st==='done')h+='<button class="btn wide" disabled>✓ Araştırıldı</button>';
 else if(st==='lock')h+=`<button class="btn wide" disabled>🔒 Önce ${B.t[S.tech[b]].ad}</button>`;
 else{const ok=S.res.bilgi>=TCOST[k],eta=e>0?Math.ceil((TCOST[k]-S.res.bilgi)/e):null;h+=`<button class="btn wide ${ok?'primary':''}" ${ok?'':'disabled'} onclick="research('${b}',${k})">${ok?'📜 Araştır':`Yetersiz bilgi${eta?` · ~${eta} tur`:''}`}</button>`}
 return h+'</div>'}

// --- Ekonomi sekmesi ---
function pEco(){const e=economy(),o=own(),M=mil();
 let h=`<table><tr><th>Kaynak</th><th>Stok</th><th>Üretim</th><th>Ordu</th><th>Net</th></tr>${RES.map(r=>`<tr><td title="${r.ask}">${r.e} ${r.ad}</td><td>${fl(S.res[r.k])}</td><td class=pos>${sgn(e.gross[r.k])}</td><td class=neg>${e.up[r.k]?'-'+r1(e.up[r.k]):''}</td><td class="${e.net[r.k]<0?'neg':'pos'}"><b>${sgn(e.net[r.k])}</b></td></tr>`).join('')}</table>
 <h4>👥 Nüfus</h4><div class=kv><span>Toplam nüfus</span><span>${fl(e.pop)} / ${fl(e.mpop)}</span></div><div class=kv><span>Büyüme</span><span>${S.res.tahil>0||e.net.tahil>=0?'+'+r1(o.reduce((s,i)=>s+popGrowth(i),0))+'/tur':'<span class=bad>Kıtlıkta nüfus azalır</span>'}</span></div>
 <p class=muted style="font-size:12px;margin:4px 0 0">Nüfus tahıl stoğu varken büyür. Tarlalar azami nüfusu artırır. Asker almak nüfusu, nüfusun düşmesi de işgücünü ve üretimi azaltır.</p>
 <h4>Bölgeler</h4><div style="overflow:auto"><table><tr><th>Bölge</th><th>👥</th>${RES.map(r=>`<th>${r.e}</th>`).join('')}<th>Tesis</th></tr>`;
 o.forEach(i=>{const y=production(i),wf=workforce(i);h+=`<tr><td><a class=lnk onclick="selectRegion(${i},'tesis')">${MAP.regions[i].name}${S.regions[i].capital?' ★':''}</a></td><td class="${wf<1?'neg':''}">${fl(S.regions[i].pop)}</td>${RES.map(r=>`<td>${y[r.k]?r1(y[r.k]):'<span class=muted>·</span>'}</td>`).join('')}<td>${S.regions[i].fields.length}/${slots(i)}</td></tr>`});
 h+='</table></div><h4>Geliştirilebilir tesisler</h4>';let any=false;
 o.forEach(i=>S.regions[i].fields.forEach((f,k)=>{if(f.lv>=M.maxField)return;any=true;const F=FIELD[f.t],c=upFieldCost(f);
  h+=`<div class=item><div>${F.e} <b>${F.ad}</b> <span class=stars>${'★'.repeat(f.lv)}</span><small>${MAP.regions[i].name} · ${RM[F.r].e} +${r1(fieldOut(i,f))} → +${r1(fieldOut(i,f,f.lv+1))}</small></div><button class="btn sm" ${canPay(c)?'':'disabled'} onclick="upgradeField(${i},${k})">⬆ ${costTxt(c)}</button></div>`}));
 if(!any)h+='<p class=muted>Geliştirilebilir tesis yok. Yeni tesis kurmak için bir bölgenin Tesisler sekmesine git.</p>';
 const empty=o.filter(i=>S.regions[i].fields.length<slots(i));if(empty.length)h+=`<h4>Boş tesis yuvası olan bölgeler</h4>`+empty.map(i=>`<div class=item><div>${regLink(i)}<small>${slots(i)-S.regions[i].fields.length} boş yuva · ${TER[MAP.regions[i].terrain].ad}</small></div><button class="btn sm" onclick="selectRegion(${i},'tesis')">🏗 Kur</button></div>`).join('');
 return h}

// --- Ordu sekmesi ---

 const pow=[0,...AIS].map(f=>({f,reg:S.regions.filter(r=>r.owner===f).length,tr:S.regions.filter(r=>r.owner===f).reduce((s,r)=>s+r.troops,0)}));const maxT=Math.max(1,...pow.map(p=>p.tr));

 ${turnsT!=null?`<div class=warn>🌾 Tahıl ${turnsT} tur sonra bitecek, sonra kıtlık başlar!</div>`:''}${turnsA!=null?`<div class=warn>🪙 Hazine ${turnsA} tur sonra boşalacak!</div>`:''}
 <h4>Birlikler</h4><table><tr><th>Birlik</th><th>⚔</th><th>🛡</th><th>Puan</th><th>👥</th><th>Açan</th><th>Sende</th></tr>${UK.map(k=>{const U=UNITS[k];return`<tr><td title="${U.d}">${U.e} ${U.ad}</td><td>${U.atk}</td><td>${U.def}</td><td>${U.w}</td><td>${U.pop}</td><td>${MIL[U.mil].ad}</td><td><b>${tot[k]}</b></td></tr>`}).join('')}</table>
 <p class=muted style="font-size:12px;margin:6px 0 0">🐎 Süvari ova/vadide güçlü, dağ/orman ve köprüsüz nehirde zayıf. 🪨 Kuşatma surları kırar. 🏹 Okçu savunmada güçlü.</p>
 <h4>Askeri kuruluşlar</h4>`;
 const ms=o.filter(i=>S.regions[i].mil);
 h+=ms.length?`<table><tr><th>Bölge</th><th>Kuruluş</th><th>👥</th><th>Üretim</th><th>Oto</th></tr>${ms.map(i=>{const r=S.regions[i];return`<tr><td><a class=lnk onclick="selectRegion(${i},'asker')">${MAP.regions[i].name}</a></td><td>${MIL[r.mil].ad}</td><td class="${draftable(i)<3?'neg':''}">${draftable(i)}</td><td>+${autoRate(i)} ${UNITS[autoType(i)].e}</td><td><input type=checkbox ${r.auto?'checked':''} onchange="toggleAuto(${i})"></td></tr>`}).join('')}</table>`:'<p class=muted>Hiç askeri kuruluşun yok.</p>';
 h+=`<h4>Savaş çarpanları</h4><div class=kv><span>⚔️ Saldırı teknolojisi</span><span>+${pct(M.atk)}</span></div><div class=kv><span>⚒️ Demir donanımı</span><span>+${pct(M.equip)} (stok ${fl(S.res.demir/IRON)} askere yeter)</span></div>
 <div class=kv><span>🛡️ Savunma teknolojisi</span><span>+${pct(M.def)}</span></div><div class=kv><span>🧱 Sur seviyesi başı</span><span>+${pct(M.fortPer)} (azami ${M.maxFort})</span></div>
 <div class=kv><span>🪵 Kuşatma etkinliği</span><span>${pct(M.siege)}</span></div><div class=kv><span>🌊 Köprüsüz nehir</span><span>×${M.river}</span></div>
 <div class=kv><span>👁️ Görüş</span><span>${M.spy?'Kesin bilgi':M.sight+' bölge, tahmini'}</span></div><div class=kv><span>Hareket</span><span>${M.roads?'Yol ağı':'Sadece komşu'}</span></div>
 <h4>Güç dengesi</h4>${pow.map(p=>`<div class=kv><span><span class=dot style="background:${rgb(FAC[p.f].col)}"></span> ${FAC[p.f].ad}</span><span>${p.reg} bölge · ${p.f===0||M.spy?p.tr:'?'} asker</span></div>${p.f===0||M.spy?`<div class=bar><i style="width:${p.tr/maxT*100}%;background:${rgb(FAC[p.f].col)}"></i></div>`:''}`).join('')}`;
 return h}
function pLog(){return'<div class=log>'+S.log.slice().reverse().map(l=>`<p class=${l.c}><span class=t>Yıl ${l.t}</span>${l.m}</p>`).join('')+'</div>'}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

// ======================= KURULUŞ / YARDIM / BAŞLANGIÇ =======================
function showSetup(){const cap=capIdx(),g=MAP.regions[cap],fs=S.regions[cap].fields,sl=slots(cap);
 let h=`<h3>👑 Beyliğin Kuruluşu</h3><p style="margin-top:0">Beyliğin <b>${g.name}</b> bölgesinde kuruluyor (${TER[g.terrain].ad}${g.feat?' · '+FEAT[g.feat].ad:''}). Sana <b>${FUND} akçelik kuruluş hazinesi</b> verildi. Bununla başkentine <b>kaynak tesisi</b> satın al. Bütçe genelde bir veya iki tesise yeter.</p>
 <p class=muted style="font-size:12.5px">Tesislerin verimi araziye göre değişir. Sonradan her bölgede 🌾 tahılla yeni tesisler kurabilirsin.</p>
 <div class=fundbox>💰 Kalan hazine: <b>${S.fund}</b> akçe &nbsp;·&nbsp; Tesis yuvası: ${fs.length}/${sl}</div><div class=cards>`;
 for(const[k,F]of Object.entries(FIELD)){const eff=fieldEff(cap,k),out=fieldOut(cap,{t:k,lv:1}),ok=S.fund>=F.fund&&fs.length<sl;
  h+=`<div class=card><div>${F.e} <b>${F.ad}</b></div><small>${RM[F.r].e} ${RM[F.r].ad} <b>+${r1(out)}</b>/tur</small><small class="${eff>=1.3?'good':eff<.8?'bad':'muted'}">Verim: ${pct(eff)}</small><small class=muted>⚔ ${F.ask}</small><button class="btn sm ${ok?'primary':''}" ${ok?'':'disabled'} onclick="buyStart('${k}')">💰 ${F.fund} akçe</button></div>`}
 h+='</div>';
 if(fs.length)h+='<h4>Satın aldıkların</h4>'+fs.map((f,k)=>`<div class=item><div>${FIELD[f.t].e} <b>${FIELD[f.t].ad}</b><small>${RM[FIELD[f.t].r].e} +${r1(fieldOut(cap,f))}/tur</small></div><button class="btn sm" onclick="unbuyStart(${k})">✕ Geri al</button></div>`).join('');
 h+=`<div class=row><span class=muted style="flex:1;font-size:12px">Kalan akçe altın olarak hazineye aktarılır.</span><button class="btn primary" ${fs.length?'':'disabled'} onclick="finishSetup()">Kuruluşu Tamamla ▶</button></div>`;
 modal(h,'setup',true)}
function showHelp(){modal(`<h3>⚔ Fetih: Nasıl oynanır?</h3>
<p><b>Harita:</b> Sürükleyerek kaydır, tekerlekle yakınlaştır. Sol tık bölge seçer, sağ tık seçili bölgenden saldırır ya da asker taşır. Çift tık yakınlaştırır. Tüm yönetim sağdaki panelde.</p>
<p><b>Ekonomi:</b> Tesisler kaynak üretir ve tahılla kurulup geliştirilir. Üretim bölgenin <b>işgücüne</b>, yani nüfusuna bağlıdır.</p>
<p><b>Nüfus ve ordu:</b> Askerler nüfustan çıkar. Nüfus tahıl stoğu varken büyür. Çok asker almak işgücünü ve üretimi düşürür. Birlikler altın, tahıl, demir ve odun ister. Ordu her tur tahıl ve altın tüketir.</p>
<p><b>Birlikler:</b> 🗡️ Piyade, 🏹 Okçu, 🐎 Süvari, 🪨 Kuşatma, ⚔️ Yeniçeri. Her askeri kuruluş kademesi yeni bir tür açar.</p>
<p><b>Arazi:</b> Sıradağlar geçilmezdir. Geçitler +%40 savunma verir. Köprüsüz nehir geçişi saldırıyı ×0,7'ye düşürür, süvariyi daha da fazla. Dağ ve ormanda savunma güçlüdür, süvari zayıftır.</p>
<p><b>Hedef:</b> 4 rakibi yık ya da haritanın %75'ini al. İlk ${GRACE} yıl rakipler sana saldırmaz.</p>
<div class=row><button class="btn primary" onclick="closeModal();if(S.phase==='kurulus')showSetup()">Başla</button></div>`,'help')}
function askNew(){modal(`<h3>Yeni oyun?</h3><p>Mevcut oyunun silinir ve yeni bir harita oluşturulur.</p><div class=row><button class=btn onclick="closeModal()">Vazgeç</button><button class="btn danger" onclick="startNew()">Yeni Oyun</button></div>`,'ask')}
function boot(fn){$('#loading').style.display='flex';setTimeout(()=>{fn();$('#loading').style.display='none'},30)}
function startNew(){closeModal();boot(()=>{newGame(fl(Math.random()*1e9));resize();centerOn(capIdx(),Math.max(minZ(),1));refresh();showHelp()})}
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal&&!['setup','over'].includes(ui.modal))closeModal()});
boot(()=>{resize();if(!load()){newGame(fl(Math.random()*1e9));resize();centerOn(capIdx(),Math.max(minZ(),1));refresh();showHelp()}else{centerOn(ui.sel??0,Math.max(minZ(),1));refresh();if(S.phase==='kurulus')showSetup();if(S.over)afterModal()}});
</script>
</body>
