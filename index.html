/* ===== Görsel dil v1 (docs/gorsel-dil.md): token'lar §2-4, §9.1 ===== */
:root{color-scheme:dark;

header.c5 .res .hc{padding:0 5px 0 4px;gap:3px}header.c5 .res .hc .ic{width:15px;height:15px}header.c5 .res .hc b{font-size:var(--t-md)}header.c5 .res{gap:3px}header.c5{gap:4px}header.c6 #sndBtn{display:none}header.c5 .hc.hmore,header.c5 .res2{margin-left:4px}

select,.inp{min-height:44px;background:var(--bg-3);color:var(--tx-1);border:1px solid var(--edge);border-radius:var(--rad-sm);padding:6px 10px;font:inherit;font-size:var(--t-sm)}

textarea{background:var(--bg-2);color:var(--tx-1);border:1px solid var(--edge);border-radius:var(--rad-sm);font:var(--t-xs)/1.4 var(--font-mono);padding:8px;width:100%}
/* sürgü §5.11 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--v:100%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brand) var(--v),var(--bg-3) var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--tx-1);box-shadow:0 0 0 2px var(--ink),var(--e-1)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--bg-3)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--brand)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:var(--tx-1);box-shadow:0 0 0 2px var(--ink)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--focus);outline-offset:2px}
/* anahtar §5.11 */
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--t-sm);min-height:44px;min-width:44px;position:relative}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:44px;height:26px;margin:0;border-radius:var(--rad-pill);background:var(--bg-3);border:1px solid var(--edge);position:relative;cursor:pointer;flex:none;transition:background var(--d-2)}
input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--tx-2);transition:transform var(--d-2) var(--ease-out),background var(--d-2)}
input[type=checkbox]:checked{background:var(--brand);border-color:var(--brand)}
input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--ink)}
/* ilerleme §5.5 */
.bar{height:8px;background:var(--bg-3);border-radius:var(--rad-xs);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:var(--rad-xs)}
.prog{display:flex;gap:3px;margin:12px 0}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--bg-3)}
.prog i.d{background:var(--good)}.prog i.c{background:var(--brand)}
.lvd{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.lvd i{width:7px;height:7px;transform:rotate(45deg);background:var(--bg-3);border-radius:1px}.lvd i.on{background:var(--brand)}
.ndot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);vertical-align:1px;margin:0 2px}
.ndot.o{background:none;box-shadow:inset 0 0 0 1.5px var(--tx-2)}.ndot.g{background:var(--good)}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:4px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.kv>span:first-child{color:var(--tx-2)}.kv>span:last-child,.kv>b{text-align:right;font-variant-numeric:tabular-nums}
.log p{margin:0 0 8px;font-size:var(--t-sm);line-height:1.45}
.log .t{color:var(--tx-3);font:600 var(--t-xs)/1 var(--font-num);margin-right:6px;font-variant-numeric:tabular-nums}
.log p.good{color:var(--tx-1);border-left:2px solid var(--good);padding-left:8px}.log p.bad{color:var(--tx-1);border-left:2px solid var(--bad);padding-left:8px}
.sub{display:flex;gap:6px;margin:16px 0 12px;flex-wrap:wrap}
.sub button{position:relative;min-height:36px;background:var(--bg-2);border:1px solid var(--line);color:var(--tx-2);border-radius:var(--rad-pill);padding:0 14px;cursor:pointer;font:600 var(--t-sm)/1.2 var(--font-ui)}
.sub button::before{content:'';position:absolute;inset:-4px 0}
.sub button.on{background:var(--bg-3);color:var(--tx-1);border-color:var(--brand)}
.card{border-radius:var(--rad-md);padding:12px;background:var(--bg-2);box-shadow:var(--e-1);display:flex;flex-direction:column;gap:4px;border:1px solid transparent;--icon-cut:var(--bg-2);min-width:0}

.card .ic.big{width:24px;height:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fundbox{background:var(--brand-wash);border:1px solid rgba(242,179,61,.45);border-radius:var(--rad-md);padding:10px 12px;margin:12px 0;font-size:var(--t-md)}
.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--rad-md);margin-bottom:6px;background:var(--bg-2);border:1px solid transparent;min-height:52px}
.step.cur{border-color:var(--brand);background:var(--brand-wash)}
.step.done .info b{color:var(--tx-2)}.step.lock .info,.step.lock .lv{color:var(--tx-3)}
.step .info{flex:1;min-width:0}.step small{display:block;color:var(--tx-2);font-size:var(--t-xs)}
.lv{font-weight:800;width:28px;height:28px;border-radius:50%;background:var(--bg-3);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;font-size:var(--t-xs)}
.step.done .lv{background:var(--good-wash);color:var(--good)}
.tree{display:grid;grid-template-columns:96px repeat(4,minmax(0,1fr));gap:6px 12px}
.tree .th{font-size:var(--t-micro);font-weight:600;color:var(--tx-2);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.tree .brn{font-weight:700;font-size:var(--t-xs);display:flex;align-items:center;gap:6px}
.node{border:1px solid var(--line);border-radius:8px;padding:6px 7px;font:600 var(--t-xs)/1.25 var(--font-ui);cursor:pointer;background:var(--bg-2);color:var(--tx-1);position:relative;text-align:left;min-height:48px;min-width:0;overflow-wrap:anywhere}

.node.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.node.done{border-color:rgba(76,195,138,.5);background:var(--good-wash)}
.node.avail{border-color:var(--brand-lo)}
.node.lock{color:var(--tx-3)}
.node::after{content:'';position:absolute;left:-9px;top:50%;width:6px;height:2px;background:var(--line)}
.node.n0::after{content:none}
.tdet{margin-top:16px;border:1px solid var(--brand-lo);border-radius:var(--rad-md);padding:12px 14px;background:var(--bg-2)}
.tdet .big{width:32px;height:32px;color:var(--brand)}
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:var(--t-sm);font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;height:36px}
td:first-child,th:first-child{text-align:left;padding-left:0}
th{color:var(--tx-2);font-weight:600;font-size:var(--t-xs)}
th .ic{width:16px;height:16px}
@media (hover:hover){tr:hover td{background:var(--bg-2)}}
.urow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 34px 34px;align-items:center;gap:8px;margin:4px 0;font-size:var(--t-sm)}
.urow>span{display:flex;align-items:center;gap:6px;min-width:0}
.urow b{text-align:right;font-variant-numeric:tabular-nums}
/* ---- pencere (modal) §5.8 ---- */
#modalBg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:var(--z-modal);padding:16px}
:is(#modal,.mgc){background:var(--bg-1);border:1px solid var(--line);border-radius:var(--rad-lg);padding:24px;width:min(460px,100%);max-height:min(90vh,760px);overflow:auto;overscroll-behavior:contain;box-shadow:var(--e-3);animation:modal-in 200ms var(--ease-out) both;min-width:0;position:relative}
:is(#modal,.mgc).late{animation-delay:300ms}#modalBg{animation:fade-in 200ms var(--ease-out)}
:is(#modal,.mgc).wide{width:min(680px,100%)}
:is(#modal,.mgc).wide:has(.wz),:is(#modal,.mgc).wide:has(.end){width:min(880px,100%)}
@keyframes modal-in{from{opacity:0;transform:scale(.96)}}
@keyframes sheet-in{from{transform:translateY(100%)}}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
:is(#modal,.mgc) .row{position:sticky;bottom:-24px;background:var(--bg-1);padding:12px 0;margin-bottom:-12px;border-top:1px solid var(--line);z-index:2}
.chance{font:800 calc(32px*var(--ts))/1.1 var(--font-num);text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.chance small{font:500 var(--t-sm) var(--font-ui);color:var(--tx-2)}
#toast{position:fixed;bottom:24px;left:calc((100vw - var(--aw)) / 2);transform:translateX(-50%);width:max-content;max-width:min(520px,calc(100vw - var(--aw) - 32px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:var(--z-toast);pointer-events:none}
.tst{min-height:44px;background:var(--bg-3);box-shadow:var(--e-2);border-left:3px solid var(--brand);padding:10px 14px;border-radius:var(--rad-sm);display:flex;align-items:center;gap:8px;font-size:var(--t-md);animation:toast-in 180ms var(--ease-out);max-width:100%}
.tst.tg{border-left-color:var(--good)}.tst.tb{border-left-color:var(--bad)}.tst.out{animation:toast-out 140ms var(--ease-in) forwards}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}}@keyframes toast-out{to{opacity:0;transform:translateY(-8px)}}
#bars{position:fixed;top:calc(var(--hud-h) + env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 16px));display:flex;flex-direction:column;gap:6px;z-index:var(--z-bars);pointer-events:none}
.bar-n{pointer-events:auto;display:flex;align-items:flex-start;gap:8px;background:var(--bg-3);border-left:3px solid var(--warn);border-radius:var(--rad-md);padding:8px 8px 8px 12px;font-size:var(--t-sm);box-shadow:var(--e-2)}
.bar-n>span{flex:1;min-width:0;overflow-wrap:anywhere}.bar-n.err{border-left-color:var(--bad)}.bar-n .btn.sm{flex:none}.bar-n span .btn{margin-left:4px}
.savebox{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ver{font-size:var(--t-xs);color:var(--tx-3);text-align:right;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:22px;font:600 var(--t-xs)/1.2 var(--font-ui);padding:0 8px;border-radius:var(--rad-pill);background:var(--bg-3);color:var(--tx-2);white-space:nowrap;vertical-align:middle}
.tag.bad{color:var(--bad);background:var(--bad-wash)}.tag.good{color:var(--good);background:var(--good-wash)}.tag.rec{background:var(--good);color:var(--ink);font-size:var(--t-sm);padding:2px 10px;font-weight:800}
h3 .tag{font-size:var(--t-xs)}
.dynbox,.mutbox{background:var(--bg-2);border-radius:var(--rad-md);padding:10px 12px;margin-top:8px;font-size:var(--t-sm)}
.dynbox>div{display:flex;gap:6px;align-items:baseline}
.rivals{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.wz .btn.wide{margin-top:8px}
.wzc{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent;position:relative}
@media (hover:hover){.pick:hover{border-color:var(--edge)}}
.pick.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-wash)}
.pick.on::after{content:'';position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--bg-1)}
.pick.lockd{cursor:default;color:var(--tx-3)}.pick.lockd .ic{filter:saturate(.2)}
.pick small{line-height:1.3}.pick .det{display:flex;flex-direction:column;gap:4px}.mobdet{display:none}
.wz-nav{position:sticky;bottom:-24px;background:var(--bg-1);padding:12px 0 6px;margin:16px 0 -6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);z-index:2}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{flex:1 1 72px;line-height:1.2;padding:6px 10px}
.evo{display:flex;flex-direction:column;gap:8px}.evo .btn{display:block;min-height:56px;text-align:left;width:100%;line-height:1.3;padding:10px 14px}.evo .btn small{display:block;color:var(--tx-2);font-weight:500;font-size:var(--t-xs);margin-top:3px}.evo .btn b{color:var(--brand)}
.evo .btn:disabled small{color:var(--tx-dis)}
.stones{display:flex;gap:3px;margin:6px 0 8px}.stones span{flex:1;text-align:center;color:var(--tx-2);font-size:var(--t-micro);min-width:0}
.stones span i{display:block;height:6px;border-radius:3px;background:var(--bg-3);margin-bottom:4px}
.stones span.d i{background:var(--good)}.stones span.c i{background:var(--brand)}.stones span.d,.stones span.c{color:var(--tx-1)}
.stones small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-micro)}
.goal.on{border-color:var(--brand)}
.goal>.rh b{display:inline-flex;align-items:center;gap:6px}
.tgt{border-left:3px solid var(--tx-2)}.tgt.ok{border-left-color:var(--good)}.tgt.no{border-left-color:var(--bad)}
/* bitiş ve miras */
.end-h{display:flex;gap:16px;align-items:flex-start}.end-h canvas{width:220px;height:auto;border-radius:var(--rad-md);flex:none;background:var(--bg-map)}.end-h h3{margin:0 0 6px;font-size:var(--t-2xl)}.end-h p{margin:0 0 6px}
.end-h h3.win{color:var(--brand)}
.end-sc{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:16px 0 8px;padding:12px 16px;border-radius:var(--rad-md);background:var(--bg-2);box-shadow:var(--e-1)}
#endSc{font:800 var(--t-3xl)/1.1 var(--font-num);color:var(--brand);display:block;font-variant-numeric:tabular-nums lining-nums}
.end-rk{text-align:right;font-size:var(--t-sm)}.end-rk>div{display:inline-flex;align-items:center;gap:6px}
.end-dg{font-size:var(--t-sm);margin:8px 0;background:var(--bad-wash);border-left:3px solid var(--bad);border-radius:var(--rad-sm);padding:8px 12px}
.end-rw{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.beat{font-size:var(--t-sm);padding:8px 12px;border-radius:var(--rad-md);background:var(--bg-2)}
.beat.on{opacity:1;transform:none}.beat.big{font-size:var(--t-lg);background:var(--brand-wash);box-shadow:var(--e-glow)}.beat.mp b{color:var(--brand)}.beat .bar{margin-top:6px}
.end-b{display:flex;flex-direction:column;gap:8px;margin-top:12px}.end-main{display:block;min-height:56px;font-size:var(--t-lg);padding:10px 16px;text-align:center}.end-main small{display:block;font-weight:500;font-size:var(--t-xs);margin-top:2px}
.end-d{margin-top:12px;font-size:var(--t-sm)}.end-d summary,details>summary{cursor:pointer;padding:10px 0;color:var(--tx-2);min-height:44px;display:flex;align-items:center;gap:6px}.end-d canvas{width:100%;height:auto;margin-top:8px;background:var(--bg-2);border-radius:var(--rad-md)}.end-d p{margin:6px 0}
.achs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.achs .card.got{border-color:rgba(76,195,138,.45)}.achs .card b{display:flex;gap:6px;align-items:center}.achs .card:not(.got) b .ic{color:var(--tx-dis)}.achs .card.got b .ic{color:var(--good)}
.mir .item>div{flex:1 1 60%}.mir .item>span{flex:0 1 auto;min-width:0;text-align:right}.mir .item .btn{white-space:nowrap}
.menu .btn.wide{display:flex;align-items:center;justify-content:flex-start}
tr.flash td,h4.flash{background:var(--brand-wash);transition:background .3s}
/* ===== Aşama 4-6: pencere, sihirbaz, bitiş, olay, saldırı, hareket (§5.8-5.15, §9) ===== */
@keyframes fade-in{from{opacity:0}}@keyframes fade-out{to{opacity:0}}@keyframes modal-out{to{opacity:0;transform:scale(.97)}}@keyframes sheet-out{to{opacity:0;transform:translateY(30%)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}@keyframes tab-swap{from{opacity:0;transform:translateY(4px)}}@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes wiz-r{from{opacity:0;transform:translateX(16px)}}@keyframes wiz-l{from{opacity:0;transform:translateX(-16px)}}@keyframes flip{from{transform:perspective(700px) rotateY(-90deg);opacity:0}}
@keyframes pop{40%{transform:scale(1.08)}}@keyframes rank-up{40%{transform:scale(1.15)}}@keyframes shk{to{transform:translate(-1px,-4px) rotate(-20deg)}}@keyframes yr-in{from{transform:translateY(100%);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse-good{from{background-color:rgba(76,195,138,.32)}}@keyframes pulse-bad{from{background-color:rgba(255,107,94,.32)}}
@keyframes yc{0%{opacity:0;transform:translate(-50%,-50%) scale(.92)}28%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.mbar{position:sticky;top:-24px;height:0;z-index:4;display:flex;justify-content:flex-end;margin:-16px -16px 0 0}
.mbar .btn{margin-top:-4px;background:var(--bg-1)}
:is(#modal,.mgc):has(.mbar) h3{padding-right:44px}
.mghost{position:fixed;inset:0;z-index:var(--z-modal);pointer-events:none;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade-out 140ms var(--ease-in) forwards}
.mghost>.mgc{animation:modal-out 140ms var(--ease-in) forwards!important;pointer-events:none}
.hc.up{animation:pulse-good 400ms var(--ease-out)}.hc.dn{animation:pulse-bad 400ms var(--ease-out)}.hc.up b,.hc.dn b{display:inline-block;animation:pop 400ms var(--ease-out)}
.hc.yr b.yrin{display:inline-block;animation:yr-in 260ms var(--ease-out)}
#panel.swap{animation:tab-swap 140ms var(--ease-out)}
#yearCard{position:absolute;left:50%;top:42%;z-index:var(--z-mapui);pointer-events:none;background:var(--scrim-map);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--rad-lg);padding:12px 28px;text-align:center;box-shadow:var(--e-2);opacity:0;transform:translate(-50%,-50%)}
#yearCard small{display:block;font:700 var(--t-xs)/1.3 var(--font-ui);letter-spacing:.12em;color:var(--tx-2)}#yearCard b{display:block;font:800 var(--t-3xl)/1.1 var(--font-num);color:var(--tx-1);font-variant-numeric:tabular-nums}
#yearCard.on{animation:yc 700ms var(--ease-out) forwards}
#view{transition:filter 900ms var(--ease-in)}
#loading{flex-direction:column}#loading .lbar{width:180px;height:4px;border-radius:2px;background:var(--bg-3);overflow:hidden}#loading .lbar i{display:block;height:100%;background:var(--brand);transform-origin:0 0;transform:scaleX(var(--lp,.05));transition:transform 300ms var(--ease-out)}
#loading .ld{font:800 calc(22px*var(--ts))/1 var(--font-ui);letter-spacing:.18em}#loading .lt{font:500 var(--t-sm)/1.3 var(--font-ui);letter-spacing:0;color:var(--tx-2)}
.btn.busy{color:transparent!important}.btn.busy::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--tx-2);border-top-color:transparent;animation:spin .8s linear infinite}
/* olay penceresi §5.13 */
.evm{position:relative;padding-top:6px;animation:rise 260ms var(--ease-out)}
.evm .evs{position:absolute;left:-24px;right:-24px;top:-24px;height:4px;background:var(--brand);transform-origin:0 0;animation:grow-x 260ms var(--ease-out)}
.evm.t-good .evs{background:var(--good)}.evm.t-bad .evs{background:var(--bad)}.evm.t-info .evs{background:var(--info)}
.evm h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.evm h3 .ic{width:28px;height:28px}
.evsub{margin:-6px 0 8px;font-size:var(--t-sm);color:var(--tx-2)}.evt{font-size:calc(15px*var(--ts));margin:0 0 12px}
.evo .btn.evb{display:flex;align-items:flex-start;gap:12px;min-height:64px;padding:10px 12px;transition:background .2s,opacity .2s,border-color .12s}
.evo .key{flex:none;width:32px;height:32px;border-radius:8px;background:var(--bg-2);display:inline-flex;align-items:center;justify-content:center;font:800 var(--t-md)/1 var(--font-num);color:var(--brand)}
.evo .evx{flex:1;min-width:0}.evo .evx b{color:var(--tx-1)}
@media (hover:hover){.evo .btn.evb:hover:not(:disabled){border-color:var(--brand)}}

 atk:[0,.1,.25,.4,.65][s],equip:s>=2?.35:s>=1?.3:.25,conqLoss:s>=3?.85:1,
 def:(v>=1?.1:0)+(v>=3?.15:0)+(v>=4?.2:0),fortPer:.25+(v>=2?.1:0),maxFort:v>=3?5:v>=2?4:3,defLoss:v>=4?.75:1,surDisc:v>=2?.7:1,
 siege:[.2,.35,.55,.75,.95][k],woodMult:k>=2?.75:1,fortAtk:k>=4?.1:0,
 tarla:e>=1?1.25:1,growth:e>=1?1.3:1,fieldMult:e>=2?1.15:1,maxField:e>=4?5:e>=2?4:e>=1?3:2,upkeep:(e>=3?.7:1)*(u>=3?.85:1),altinMult:e>=4?1.3:1,
 autoMult:u>=4?1.25:1,loot:e>=3?.1:0,
 river:g>=1?.85:.7,sight:g>=1?2:1,spy:g>=2,roads:g>=3,lossMult:g>=4?.7:1,maxMorale:g>=4?120:100,moraleRec:3,
 // hanedan/kart alanları (Klasik'te etkisiz değerler)
 atkDyn:0,defDyn:0,suvAtk:1,iron:.3,unitDef:null,fieldBy:{},fieldAll:1,resMult:{},unitGold:1,unitAdd:{},upGold:1,upGoldRate:.1,upTahil:1,
 lootCap:.75,conqMorale:5,conqPop:.7,yenMil:0,tcost:1,featY:{},gecitDef:0,gecitMorale:0}}
function applyMods(M,L){for(const o of L)for(const[k,v]of Object.entries(o||{}))switch(k){
 case'atkAdd':M.atkDyn+=v;break;case'defAdd':M.defDyn+=v;break;case'equipAdd':M.equip+=v;break;case'fortPer':M.fortPer+=v;break;case'maxFortAdd':M.maxFort+=v;break;
 case'surCost':M.surDisc*=v;break;case'maxFieldAdd':M.maxField=Math.max(1,M.maxField+v);break;case'growth':M.growth*=v;break;case'sightAdd':M.sight=Math.max(0,M.sight+v);break;
 case'lootAdd':M.loot+=v;break;case'siegeAdd':M.siege=Math.max(0,M.siege+v);break;case'iron':M.iron=Math.min(M.iron,v);break;
 case'fieldBy':case'resMult':for(const q in v)M[k][q]=(M[k][q]||1)*v[q];break;
 case'unitAdd':for(const q in v){const t=M.unitAdd[q]=Object.assign({},M.unitAdd[q]);for(const r in v[q])t[r]=(t[r]||0)+v[q][r]}break;
 case'unitDef':case'featY':M[k]=Object.assign({},M[k],v);break;
 case'suvAtk':case'unitGold':case'upGold':case'upTahil':case'tcost':case'fieldAll':M[k]*=v;break;default:M[k]=v}return M}
const modsOf=c=>[DYN[c.dyn].mods].concat(c.muts.map(m=>MUTS[m].mods));
// mil(): teknoloji + hanedan + kart. Önbellekli (S ve teknoloji değişince yenilenir); dönen nesne salt okunur.
let MILC=null;
function mil(){const t=S.tech,k=t.sal+t.sav*5+t.kus*25+t.eko*125+t.ure*625+t.str*3125;if(MILC&&MILC.s===S&&MILC.k===k)return MILC.v;
 const M=applyMods(baseMil(t),modsOf(cfgOf()));MILC={s:S,k,v:M};return M}
const iron=()=>mil().iron;
const tcost=k=>Math.round(TCOST[k]*mil().tcost*(S.flags&&S.flags.tdisc>S.turn?.5:1));
const moraleMult=m=>.5+m/200;
const aiB=f=>{const D=DIFFS[cfgOf().diff];return Math.min(D.aiBCap,D.aiBStep*(aiDyn(f)==='bilge'?1.25:1)*fl(S.turn/4))};
function crossAt(a,b){return MAP.cross.get(pkey(a,b))}
function riverF(o,a,b){const c=crossAt(a,b);if(!c||c.bridge)return 1;return o===0?mil().river:.7}
function atkParts(o,n,from,to){const p=[];if(o===0){const M=mil(),cov=n>0?Math.min(1,S.res.demir/(n*M.iron)):1;
  if(M.atk)p.push(['⚔️ Saldırı teknolojisi',M.atk]);p.push([`⚒️ Silah donanımı (%${Math.round(cov*100)})`,cov*M.equip]);if(S.regions[to].fort&&M.fortAtk)p.push(['🪵 Topçu',M.fortAtk]);
  if(M.atkDyn)p.push([`${dynOf().e} ${dynOf().ad}`,M.atkDyn])}
 else if(o!==NEUTRAL){if(aiB(o))p.push(['Düşman teknolojisi',aiB(o)]);if(aiDyn(o)==='tunc')p.push(['🔨 Tunç demircileri',.08])}return p}
function atkMult(o,n,from,to){let m=1+atkParts(o,n,from,to).reduce((s,x)=>s+x[1],0);if(o===0)m*=S.buffs&&hasBuff('bey')?1.15:moraleMult(S.morale);return m*riverF(o,from,to)}
function siegeOf(o,fort,A){if(!fort)return 0;let b;if(o===0){const M=mil();b=M.siege*Math.min(1,S.res.odun/(fort*WOOD*M.woodMult))}else b=Math.max(0,(S.turn>15?.35:.15)+DIFFS[cfgOf().diff].aiSiege+fxOf().siegeAll);return Math.min(.95,b+unitSiege(A))}
function defParts(i,siege){const r=S.regions[i],g=MAP.regions[i],p=[];if(TER[g.terrain].def)p.push(['Arazi ('+TER[g.terrain].ad+')',TER[g.terrain].def]);
 if(g.feat&&FEAT[g.feat].def)p.push([FEAT[g.feat].ad,FEAT[g.feat].def]);if(r.capital)p.push(['★ Başkent',.2]);
 const M=r.owner===0?mil():null,fp=M?M.fortPer:fxOf().fortPerAll;if(r.fort)p.push([`🧱 Sur ×${r.fort}`+(siege?` (kuşatma %${Math.round(siege*100)} kırdı)`:''),r.fort*fp*(1-siege)]);
 if(M){if(M.def)p.push(['🛡️ Savunma teknolojisi',M.def]);if(M.defDyn)p.push([`${dynOf().e} ${dynOf().ad}`,M.defDyn]);if(M.gecitDef&&g.feat==='gecit')p.push(['🦅 Geçit Bekçileri',M.gecitDef])}
 if(r.owner>0&&r.owner<NEUTRAL){if(aiB(r.owner))p.push(['Düşman teknolojisi',aiB(r.owner)]);if(aiDyn(r.owner)==='kartal')p.push(['🦅 Kartal surları',.1])}return p}
function defMult(i,siege){const r=S.regions[i];let d=1+defParts(i,siege).reduce((s,x)=>s+x[1],0);if(r.owner===0)d*=moraleMult(S.morale);return d}
function odds(a,d){if(d<=0)return 1;let w=0;const K=24;for(let i=0;i<K;i++)for(let j=0;j<K;j++)if(a*(.85+.3*(i+.5)/K)>d*(.85+.3*(j+.5)/K))w++;return w/(K*K)}
function est(t){return t<=3?t:Math.max(5,Math.round(t/5)*5)}
function computeVision(){const o=own();VIS=o.length?bfs(o):new Array(MAP.n).fill(99)}
function vis(i){const r=S.regions[i];if(r.owner===0||mil().spy||revealed(r.owner))return{v:r.troops,txt:''+r.troops,exact:true};if(VIS[i]<=mil().sight){const e=est(r.troops);return{v:e,txt:'~'+e,exact:false}}return{v:null,txt:'?',exact:false}}

// Savaşın ortak çekirdeği: güçler, zar ve kaynak harcaması
function battle(ao,from,to,A){const R=S.regions,F=R[from],T=R[to],n=sumU(A),siege=siegeOf(ao,T.fort,A),am=atkMult(ao,n,from,to);
 if(ao===0){const M=mil();S.res.demir-=Math.min(S.res.demir,n*M.iron);if(T.fort)S.res.odun-=Math.min(S.res.odun,T.fort*WOOD*M.woodMult)}
 const aP=rawAtk(A,from,to,ao)*am,dP=rawDef(T.u,T.owner)*defMult(to,siege);remU(F,A,true);F.bt=T.bt=S.turn;
 return{F,T,n,ra:aP*(.85+rnd()*.3),rd:dP*(.85+rnd()*.3),dt:T.troops,D:Object.assign(Z(),T.u),lx:fxOf().lossExp}}
function defeat(ao,b){const{F,T,n,ra,rd,dt,D,lx}=b;let fr=Math.sqrt(1-(ra/rd)**2);if(lx!==1)fr=fr**lx;if(T.owner===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.defLoss}const DS=scaleU(D,fr);if(sumU(DS)<1)DS[UK.find(k=>D[k])||'piy']=1;
 const back=Z();for(const k of UK)back[k]=fl((b.A[k]||0)*.2);addU(F,back,false);
 T.u=DS;for(const k of UK)T.rd[k]=Math.min(T.rd[k],DS[k]);sync(T);
 if(ao===0)S.morale=Math.max(0,S.morale-6);if(T.owner===0)S.morale=Math.min(mil().maxMorale,S.morale+2);
 return{win:false,sent:n,back:sumU(back),lost:n-sumU(back),dLost:dt-sumU(DS)}}
function winFr(ao,b){let fr=b.rd>0?Math.sqrt(1-(b.rd/b.ra)**2):1;if(b.lx!==1)fr=fr**b.lx;if(ao===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.conqLoss}return fr}
function resolve(ao,from,to,A){const d0=S.regions[to].owner,c0=S.regions[to].capital;if(FX.on)fxPre(to);const x=resolve0(ao,from,to,A);battleStat(ao,d0,c0,from,to,x);if(FX.on)FX.b.push({ao,from,to,win:x.win,n:x.sent,d0,c0,loot:ao===0&&x.win&&x.loot?x.loot.got:null});return x}
function resolve0(ao,from,to,A){const b=battle(ao,from,to,A);b.A=A;const{n,ra,rd,dt}=b;
 if(ra>rd){const fr=winFr(ao,b),SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;
  if(ao===0)S.morale=Math.min(mil().maxMorale,S.morale+mil().conqMorale);const loot=conquer(to,ao,SV,fr);let akin=0;
  // Akın (Börü): turda 1 kez, sağ kalan süvari hazır kalır
  if(ao===0&&hasAb('akin')&&SV.suv>0&&S.cd.akin!==S.turn){const T=S.regions[to];T.rd.suv=T.u.suv;sync(T);S.cd.akin=S.turn;akin=T.u.suv;if(S.stats)S.stats.akinN++}
  return{win:true,sent:n,surv:sumU(SV),lost:n-sumU(SV),dLost:dt,SV,loot,akin}}
 return defeat(ao,b)}
// Savaş istatistikleri (S.stats) ve kişilik izleri: Savunmacı karşı saldırısı (hit), Usta Akıncı Beyi etkisinin harcanması
function battleStat(ao,d0,c0,from,to,x){const st=S.stats;if(!st)return;
 if(ao===0||d0===0){st.batT.push(S.turn);if(st.batT.length>40)st.batT.shift()}
 if(ao===0){st.lastAtk=S.turn;if(x.win){st.atkWon++;st.conqT.push(S.turn);if(st.conqT.length>20)st.conqT.shift();if(x.loot)for(const k in x.loot.got)st.loot+=x.loot.got[k];if(c0&&isAI(d0))st.capsTaken++}else{st.atkLost++;st.lostT=S.turn}
  if(isAI(d0)&&S.ai[d0])S.ai[d0].hit={from,to,t:S.turn};if(S.buffs.some(b=>b.k==='bey'))S.buffs=S.buffs.filter(b=>b.k!=='bey')}
 else if(d0===0){if(x.win){st.defLost++;st.lostT=S.turn;st.lastLoss={t:S.turn,r:to,by:ao}}else st.defWon++}
 // 1c: en iyi savaş (en çok düşman öldürülen kazanılmış saldırı) ve en büyük kayıp (saldırı ya da savunma)
 if(ao===0&&x.win&&(!st.bestB||x.dLost>st.bestB.kill))st.bestB={t:S.turn,r:to,sent:x.sent,kill:x.dLost,lost:x.lost};
 const L=ao===0?x.lost:d0===0?x.dLost:0;if(L>0&&(!st.worstB||L>st.worstB.lost))st.worstB={t:S.turn,r:to,lost:L,k:ao===0?'saldırı':'savunma'}}
// Yağma (Akıncı): fethetmeden baskın
const canRaid=(from,to)=>hasAb('yagma')&&S.phase==='oyun'&&(S.cd.yagma||0)<=S.turn&&S.regions[from].owner===0&&S.regions[to].owner>0&&MAP.regions[from].adj.includes(to)&&!truceOn(S.regions[to].owner)&&!isVas(S.regions[to].owner)&&!atkLocked();
function raid(from,to,A){if(!canRaid(from,to)||!sumU(A))return null;const b=battle(0,from,to,A);b.A=A;const{F,T,n,ra,rd,dt}=b,Ab=ABIL.yagma;S.cd.yagma=S.turn+Ab.cd;
 if(!(ra>rd))return defeat(0,b);const fr=winFr(0,b),SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;addU(F,SV,false);
 const st=lootStore(to),got={};for(const k in st){got[k]=st[k]*.4;S.res[k]+=got[k]}
 const kill=takeProp(T.u,Math.ceil(T.troops*.25));remU(T,kill,true);T.raid=S.turn+3;if(S.stats)S.stats.yagmaN++;S.morale=Math.min(mil().maxMorale,S.morale+2);
 return{win:true,raid:true,sent:n,surv:sumU(SV),lost:n-sumU(SV),dLost:sumU(kill),got}}
function conquer(i,o,comp,fr){
 const r=S.regions[i],old=r.owner,g=MAP.regions[i],store=o===0?lootStore(i):null,wasCap=r.capital;let loot=null;r.owner=o;r.u=Object.assign(Z(),comp);r.rd=Z();sync(r);r.fort=Math.max(0,r.fort-1);r.pop*=o===0?mil().conqPop:.7;r.raid=0;
 if(r.mil>1)r.mil--;r.fields.forEach(f=>{if(f.lv>1)f.lv--});
 if(o===0){r.auto=true;const rate=lootRate(fr==null?.7:fr);loot={store,rate,got:{},lost:{}};for(const k in store){loot.got[k]=store[k]*rate;loot.lost[k]=store[k]-loot.got[k];S.res[k]+=loot.got[k]}}
 if(old===0)S.morale=Math.max(0,S.morale-6);
 if(r.capital){r.capital=false;if(old!==NEUTRAL){const rest=S.regions.map((x,k)=>k).filter(k=>S.regions[k].owner===old);
  if(rest.length){const c=rest.sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];S.regions[c].capital=true;
   if(old===0){S.morale=Math.max(0,S.morale-20);log(`Başkentin ${g.name} düştü! Yeni başkent: ${MAP.regions[c].name}. Moral -20.`,'bad')}
   else log(`${facName(old)} başkenti ${g.name}'i kaybetti; yeni başkent ${MAP.regions[c].name}.`)}}}
 if(old>0&&old<NEUTRAL&&!S.regions.some(x=>x.owner===old)){log(`${facName(old)} yıkıldı!`,'good');if(o===0&&S.cfg&&!S.cfg.ais.some(f=>aliveAI(f)&&!isVas(f))){const n=fetihLeft().length;if(n)log(`⚔ Bütün rakipler yıkıldı. Fetih için ${n} kabile bölgesi kaldı (🏆 Hedef sekmesi).`,'good')}}
 if(wasCap&&S.stats)capFall(i,old,o);
 if(isAI(old)&&S.ai&&S.ai[old])S.ai[old].lost=(S.ai[old].lost||0)+1;
 if(old===0&&S.ai)for(const f of S.cfg.ais)if(isVas(f)&&g.adj.some(j=>S.regions[j].owner===f))S.ai[f].vlost=(S.ai[f].vlost||0)+1;
 return loot}
// Başkent düştü: Büyük Eser geriler, koalisyon üyesi çekilir ("Kılıç kırıldı"), rakibin eser yarışı sıfırlanır
function capFall(i,old,o){const W=S.wonder,C=S.coal,A=S.aiW;
 if(old===0){S.stats.capLost++;if(W.stage||W.build){const b=W.stage;W.stage=Math.max(0,W.stage-VIC.medeniyet.capLoss);W.build=0;log(`📜 Başkent düştü: Büyük Eser ${b} → ${W.stage} aşamaya geriledi.`,'bad')}}
 if(!isAI(old))return;
 if(C&&C.on&&C.mem.includes(old)){C.mem=C.mem.filter(x=>x!==old);C.out.push(old);if(o===0)S.stats.coalBroken++;
  log(`🗡 Kılıç kırıldı: ${facName(old)} başkentini kaybetti ve koalisyondan çekildi.`,'good');if(!C.mem.length){C.on=false;C.cd=S.turn+10;log('🤝 Koalisyon dağıldı: son üye de çekildi.','good')}}
 if(A.f===old&&(A.stage||S.medClosed===old)){log(`📜 ${facName(old)} başkentini kaybetti: Büyük Eseri yıkıldı.`,'good');A.stage=0;A.next=S.turn+VIC.medeniyet.aiEvery;if(S.medClosed===old){S.medClosed=null;log('📜 Medeniyet yolu yeniden açıldı.','good')}}}

// ======================= EKONOMİ & NÜFUS =======================
function maxPop(i){const g=MAP.regions[i],r=S.regions[i];let m=TER[g.terrain].pop+(r.capital?25:0)+(g.feat==='liman'||g.feat==='kavsak'?10:0)+(g.feat==='verimli'?15:0);for(const f of r.fields)if(f.t==='tarla')m+=6*f.lv;return m}
const popFloor=i=>Math.ceil(maxPop(i)*.25);
const draftable=i=>Math.max(0,fl(S.regions[i].pop-popFloor(i)));
const workforce=i=>clamp(S.regions[i].pop/(maxPop(i)*.5),.4,1);
function slots(i){const g=MAP.regions[i],r=S.regions[i];return TER[g.terrain].slots+(r.capital?1:0)+(g.feat==='verimli'?1:0)}
function fieldEff(i,t){const g=MAP.regions[i],F=FIELD[t];let e=F.eff[g.terrain]||1;if(g.feat==='verimli'&&(t==='tarla'||t==='pazar'))e*=1.5;if(g.feat==='damar'&&(t==='demir'||t==='tasocagi'))e*=1.6;return e}
function fieldOut(i,f,lv=f.lv){const F=FIELD[f.t],M=mil();let v=F.base*LVM[lv]*fieldEff(i,f.t)*M.fieldMult*(S.regions[i].owner===0?workforce(i):1);if(F.r==='tahil')v*=M.tarla;if(F.r==='altin')v*=M.altinMult;
 if(M.fieldBy[f.t])v*=M.fieldBy[f.t];if(M.fieldAll!==1)v*=M.fieldAll;if(M.resMult[F.r])v*=M.resMult[F.r];if(F.r==='tahil'&&S.buffs&&S.buffs.length&&S.regions[i].owner===0)v*=buffMul('tarla');return v}
function prodParts(i){const g=MAP.regions[i],r=S.regions[i],p=[],M=mil(),am=M.altinMult,rm=M.resMult,fy=r.owner===0&&g.feat&&M.featY[g.feat]||g.feat&&FEAT[g.feat].y;
 for(const[k,v]of Object.entries(TER[g.terrain].y))p.push([TER[g.terrain].ad,k,(k==='altin'?v*am:v)*(rm[k]||1)]);
 if(fy)for(const[k,v]of Object.entries(fy))p.push([FEAT[g.feat].ad,k,k==='altin'?v*am:v]);
 if(r.capital)for(const[k,v]of Object.entries({tahil:2,altin:3,demir:2,bilgi:3}))p.push(['★ Başkent',k,k==='altin'?v*am:v]);
 r.fields.forEach(f=>p.push([`${FIELD[f.t].e} ${FIELD[f.t].ad} Sv.${f.lv}`,FIELD[f.t].r,fieldOut(i,f)]));return p}
function production(i){const r=S.regions[i],y={},m=(r.raid>S.turn?.5:1)*(r.qt>S.turn?.5:1);prodParts(i).forEach(([,k,v])=>y[k]=(y[k]||0)+v*m);return y}
function economy(){const gross={tahil:0,odun:0,tas:0,demir:0,altin:0,bilgi:0};let troops=0,uw=0,pop=0,mpop=0;
 own().forEach(i=>{const r=S.regions[i];addY(gross,production(i));troops+=r.troops;pop+=r.pop;mpop+=maxPop(i);uw+=UK.reduce((s,k)=>s+r.u[k]*UNITS[k].up,0)});
 const M=mil(),up={tahil:uw*.15*M.upkeep*M.upTahil,altin:uw*M.upGoldRate*M.upkeep*M.upGold},net={};
 if(S.flags){const mc=S.flags.merc;if(mc&&mc.u>S.turn)up.altin+=3;for(const f of S.cfg.ais)if(isVas(f))gross.altin+=VIC.hegemonya.tribute(aiRegs(f))}for(const k in gross)net[k]=gross[k]-(up[k]||0);
 return{gross,up,net,troops,pop,mpop}}
// Ganimet: fethedilen bölgenin stoğu (üretim + garnizon sandığı). Yalnızca bir kısmı ele geçer, kalanı yangın ve yağmada zayi olur.
function lootStore(i,tr){const r=S.regions[i],g=MAP.regions[i],y=production(i),t=tr==null?r.troops:tr,s={};
 for(const k of['tahil','odun','tas','demir','altin'])s[k]=(y[k]||0)*8;
 s.tahil+=t*1.2;s.altin+=8+t*.9;s.demir+=t*.25;s.bilgi=8+(y.bilgi||0)*6+(g.feat==='harabe'?6:0);
 if(r.capital)for(const k in s)s[k]*=1.5;return s}
const lootRate=fr=>clamp(.3+.3*fr+mil().loot+(S.buffs&&hasBuff('bey')?.1:0),.25,mil().lootCap);
const lootLine=(st,rate)=>Object.entries(st).filter(([k,v])=>v*rate>=.5).map(([k,v])=>RM[k].e+Math.round(v*rate)).join(' ')||'—';
function lootHtml(L){if(!L)return'';const ks=Object.keys(L.store).filter(k=>L.store[k]>=.5);
 return`<h4>💰 Ganimet · bölge stokunun %${Math.round(L.rate*100)}'i ele geçti</h4><table><tr><th>Kaynak</th><th>Bölge stoku</th><th>Alınan</th><th>Zayi</th></tr>${ks.map(k=>`<tr><td>${RM[k].e} ${RM[k].ad}</td><td>${Math.round(L.store[k])}</td><td class=pos>+${Math.round(L.got[k])}</td><td class=neg>-${Math.round(L.lost[k])}</td></tr>`).join('')}</table><p class=muted style="font-size:var(--t-xs);margin:6px 0 0">Kalan kısım savaşta yangın, yağma ve bozulmayla zayi oldu. Ne kadar az kayıp verirsen o kadar çok kurtarırsın.</p>`}

function plaguePick(){const o=own();if(!o.length)return null;const c=o[fl(rnd()*o.length)],nb=MAP.regions[c].adj.filter(j=>S.regions[j].owner!==BLOCK),hit=[c];
 while(hit.length<4&&nb.length)hit.push(nb.splice(fl(rnd()*nb.length),1)[0]);return hit}

 if(aiPer(f).truce==='2x'&&totTroops()<2*aiTroops(f)){toast(`${facName(f)} haracı reddetti: Saldırgan rakip ancak ondan iki kat güçlüysen ateşkese yanaşır.`);return}
 S.res.altin-=c;setTruce(f,ABIL.harac.truce);S.cd.harac=S.turn+ABIL.harac.cd;S.stats.haracN++;log(`⚓ ${facName(f)} ile ${ABIL.harac.truce} yıllık ateşkes (${c} altın haraç).`,'good');refresh()}

const hasBuff=k=>!!(S.buffs&&S.buffs.some(b=>b.k===k&&buffOn(b)));
function buffMul(k){let m=1;if(S.buffs)for(const b of S.buffs)if(b.k===k&&buffOn(b))m*=b.v;return m}
function addBuff(k,v,turns){S.buffs=S.buffs.filter(buffOn);S.buffs.push({k,v,u:turns==null?null:S.turn+turns})}
const hasFeat=a=>own().some(i=>a.includes(MAP.regions[i].feat));
const nField=t=>own().reduce((s,i)=>s+S.regions[i].fields.filter(f=>f.t===t).length,0);
const battlesLast=n=>S.stats.batT.filter(t=>t>=S.turn-n).length;
const conqLast=n=>S.stats.conqT.filter(t=>t>=S.turn-n).length;

const totPop=()=>own().reduce((s,i)=>s+S.regions[i].pop,0);
const aiTroops=f=>S.regions.reduce((s,r)=>s+(r.owner===f?r.troops:0),0);
const aiRegs=f=>S.regions.reduce((s,r)=>s+(r.owner===f?1:0),0);
const techCount=()=>Object.values(S.tech).reduce((s,v)=>s+v,0);
const frontOwn=()=>own().filter(i=>MAP.regions[i].adj.some(j=>S.regions[j].owner!==0));
const capDist=()=>{const c=capIdx();return c==null?null:bfs(c)};
function adjAIs(pers){const s=new Set();for(const i of own())for(const j of MAP.regions[i].adj){const o=S.regions[j].owner;if(isAI(o)&&!isVas(o)&&(!pers||pers.includes(S.ai[o].per)))s.add(o)}return[...s]}
function borderTroops(f){let t=0;for(const i of own())if(MAP.regions[i].adj.some(j=>S.regions[j].owner===f))t+=S.regions[i].troops;return t}
// Kabile Biatı adayı: komşu kabile bölgesi, ona komşu askerin onun 2 katı (en zayıfı)
function weakNeutral(){let b=null;const seen=new Set();for(const i of own())for(const j of MAP.regions[i].adj){if(seen.has(j)||S.regions[j].owner!==NEUTRAL)continue;seen.add(j);
 const t=S.regions[j].troops,m=MAP.regions[j].adj.reduce((s,q)=>s+(S.regions[q].owner===0?S.regions[q].troops:0),0);if(m>=2*Math.max(1,t)&&(!b||t<b.t))b={j,t}}return b}
function farthest(list){const d=capDist();if(!d)return null;let b=null;for(const i of list)if(!S.regions[i].capital&&(b==null||d[i]>d[b]))b=i;return b}
const rName=i=>MAP.regions[i].name;
const give=g=>{for(const k in g)S.res[k]+=g[k];return costTxt(g).replace(/(^| )/g,'$1+')};
function disband(frac,back){let n=0;for(const i of own()){const r=S.regions[i],k=fl(r.troops*frac);if(k){remU(r,takeProp(r.u,k),false);n+=k;if(back)r.pop=Math.min(maxPop(i),r.pop+k)}}return n}
// Bölgeyi kabilelere bırak (isyan, hizip): garnizon kabile askeri olur

function fetihLeft(){const o=[];S.regions.forEach((r,i)=>{if(r.owner!==0&&r.owner!==BLOCK&&!isVas(r.owner))o.push(i)});return o}
const fetihHeld=()=>MAP.playN-fetihLeft().length;
// 0.9.2: Medeniyet/Hegemonya koşulu oyunu kendiliğinden bitirmez. Yol başına bir kez karar (S.altQ={p,t}, kayıtta): "devam" → kilometre taşı S.altM[p]=yıl
// (o yol bir daha bitirmez), "bitir" → eski zafer. Yol Ferman olarak beyan edildiyse (S.ferman) karar sorulmaz, hemen biter.
const ALT_P=['medeniyet','hegemonya'];
function altMet(p){if(!S.cfg.alt)return false;const M=VIC.medeniyet;return p==='medeniyet'?S.medClosed==null&&techCount()>=M.tech&&S.wonder.stage>=M.stages&&capIdx()!=null:S.heg.count>=VIC.hegemonya.hold}
const pathWon=(s,p)=>s.over==='win'&&(s.winBy===p||!!(s.altM&&s.altM[p]!=null));
function checkEnd(){if(S.over)return;const mine=S.regions.some(r=>r.owner===0);
 if(!mine)S.over='lose';else if(!fetihLeft().length){S.over='win';S.winBy='fetih'}
 else if(!S.altQ)for(const p of ALT_P){if(S.altM[p]!=null||!altMet(p))continue;if(S.ferman===p){S.over='win';S.winBy=p}else{S.altQ={p,t:S.turn};save()}break}
 if(S.over){if(S.over==='lose')S.winBy=null;S.altQ=null;save()}}
// Karar (bot ve arayüz ortak): k = 'devam' | 'bitir'. Dönüş: yol ya da null (bekleyen karar yoksa; çift işlenmez)
function altPick(k){const q=S.altQ;if(!q||S.over||(k!=='devam'&&k!=='bitir'))return null;const p=q.p,V=VIC[p];S.altQ=null;
 if(k==='bitir'){S.over='win';S.winBy=p;log(`${V.e} ${V.ad} zaferi alındı.`,'good')}
 else{S.altM[p]=q.t;log(`${V.e} ${V.ad} kilometre taşı (${q.t}. yıl): zafer koşulu sağlandı, fetihe devam.`,'good');checkEnd()}
 save();return p}
// Şimdi bitirilseydi: skor ve oyun MP'si (başarım/ilk sefer hariç)
function altProbe(p){const o=S.over,w=S.winBy;S.over='win';S.winBy=p;let r;try{r={v:scoreOf(S).v,mp:mpCalc(S,META).game,fm:fermanOk(S)}}finally{S.over=o;S.winBy=w}return r}
const mileTxt=s=>ALT_P.filter(p=>s.altM&&s.altM[p]!=null&&s.winBy!==p).map(p=>`${VIC[p].e} ${VIC[p].ad} kilometre taşı ✓ (${s.altM[p]}. yıl)`);
const WIN_T={fetih:['👑 Hükümdarlık Kuruldu: Fetih Zaferi',()=>{const v=MAP.playN-own().length;return`${S.turn} yılda haritanın ${MAP.playN} bölgesinin tamamını yönetir oldun${v>0?` (${v} bölge vasallarının elinde)`:''}. Son kabile de tacına boyun eğdi.`}],
 medeniyet:['📜 Medeniyet Zaferi: Külliye Tamamlandı',()=>`${S.turn}. yılda ${techCount()} teknoloji ve beş aşamalı Büyük Eserle çağın ışığı oldun.`],
 hegemonya:['👑 Hegemonya Zaferi',()=>`${S.turn}. yılda eski başkentleri ${VIC.hegemonya.hold} yıl elinde tuttun: rakipler tacına haraç ödüyor.`],
 ilan:['👑 Zafer İlanı',()=>`${S.turn}. yılda gücün rakiplerinin toplamını açık ara geçti; beyler tacına boyun eğdi.`]};

// ======================= OYUN SONU · SKOR · MİRAS · GÜNLÜK (1c, §8-§11) =======================
const VZ={fetih:1000,medeniyet:1100,hegemonya:1100,ilan:900},MAPX={kita:1,vadi:1,dag:1.1,korfez:1.05};
const RANKS=[[0,'Tımarlı'],[1000,'Subaşı'],[2500,'Sancakbeyi'],[4000,'Beylerbeyi'],[6000,'Vezir-i Âzam'],[8000,'Cihangir']];
const rankOf=v=>{let k=0;RANKS.forEach((r,i)=>{if(v>=r[0])k=i});return k};
const fmtN=v=>Math.round(v).toLocaleString('tr-TR');
// Skor (§8.3): Z + 40·en çok bölge + 25·teknoloji + 10·(saldırı + ½ savunma zaferi) + 100·alınan başkent + hız (zafer: (tavan − yıl)·12; Zafer İlanı'nda yarısı)
function scoreParts(s){const st=s.stats,win=s.over==='win',sp=SIZES[s.cfg.size].sp;
 const p={Z:win?VZ[s.winBy]||1000:0,B:40*st.maxRegions,T:25*Object.values(s.tech).reduce((a,b)=>a+b,0),F:Math.round(10*(st.atkWon+.5*st.defWon)),K:100*st.capsTaken,H:win?Math.round(Math.max(0,sp-s.turn)*12*(s.winBy==='ilan'?.5:1)):0};
 p.raw=p.Z+p.B+p.T+p.F+p.K+p.H;return p}
const bonX=c=>(c.bonus||[]).reduce((m,b)=>m*(BONUS[b]?BONUS[b].x:1),1);
const scoreMul=c=>DIFFS[c.diff].sc*c.mutX*(MAPX[c.map]||1)*(DYN[c.dyn].mp||1)*bonX(c);
function scoreOf(s){const p=scoreParts(s),x=scoreMul(s.cfg);return{p,x,v:Math.round(p.raw*x)}}
const diffMp=(c,M)=>c.diff==='cirak'&&M&&M.games<2?DIFFS.cirak.mpNew:DIFFS[c.diff].mp;
const fermanOk=s=>!!(s.ferman&&s.over==='win'&&(s.winBy===s.ferman||(s.winBy==='ilan'&&s.ferman==='fetih')));
// Miras puanı (§9.1 + 1c): zafer 23 + ham/120; yenilgi 12 + yakınlık round(20·min(1, en yüksek bölge oranı/0,35)) + ham/120.
// × zorluk (Çırak 0,4; ilk 2 oyun 0,6) × kart × hanedan × bonus × ferman × rövanş 0,8 × antrenman 0,25. 15. yıldan önce biten oyun 0.
function mpCalc(s,M){const c=s.cfg,win=s.over==='win',p=scoreParts(s),share=s.stats.maxRegions/(MAP?MAP.playN:1);
 if(s.turn<15)return{game:0,quit:true,share,near:0};
 const near=win?0:Math.round(20*Math.min(1,share/.35)),base=(win?23:12+near)+p.raw/120;
 const x={diff:diffMp(c,M),kart:c.mutX*(DYN[c.dyn].mp||1)*bonX(c),ferman:fermanOk(s)?(s.fermanCh?FERMAN.xCh:FERMAN.x):1,re:c.rematch?.8:1,tr:c.train?.25:1};
 return{game:Math.round(base*x.diff*x.kart*x.ferman*x.re*x.tr),base,near,share,x}}
const CAT_PRI={dyn:0,map:1,diff:2,size:3,mut:4,bonus:5};// bitiş ekranında öne çıkan açılım
const gidOf=s=>s.gid||('g'+s.seed+'-'+s.turn+'-'+s.cfg.dyn+'-'+s.cfg.diff);
// Bitişte bir kez: MP, başarımlar, koşullu açılımlar, rekorlar, günlük seri, geçmiş. Sonuç S.endRes'e yazılır (yenilemede aynı ekran, ödül yok).
// Çifte ödül koruması: S.metaDone + META.done (oyun kimlikleri); META önce, oyun kaydı sonra yazılır.
function commitMeta(){const s=S;if(!META)META=metaFix(null);const M=META,id=gidOf(s);
 if(s.metaDone&&s.endRes)return s.endRes;
 const c=s.cfg,st=s.stats,win=s.over==='win',sc=scoreOf(s),mp=mpCalc(s,M),R={v:sc.v,p:sc.p,x:sc.x,mp,mpG:{game:0,first:0,ach:0,daily:0},mpTot:0,mp0:fl(M.mp),ach:[],unl:[],aff:[],miss:null,rec:null,daily:null,quit:!!mp.quit,dup:M.done.includes(id)};
 if(!R.dup&&!R.quit){M.games++;if(win)M.wins++;const T=M.stats,bd=T.byDyn[c.dyn]=T.byDyn[c.dyn]||{g:0,w:0,best:0};bd.g++;
  if(win){bd.w++;T.byPath[s.winBy]=(T.byPath[s.winBy]||0)+1;T.byMile=T.byMile||{};for(const p of ALT_P)if(s.altM&&s.altM[p]!=null&&s.winBy!==p)T.byMile[p]=(T.byMile[p]||0)+1;T.byMap[c.map]=(T.byMap[c.map]||0)+1;T.byDiff[c.diff]=(T.byDiff[c.diff]||0)+1;if(T.fastestWin==null||s.turn<T.fastestWin)T.fastestWin=s.turn}
  T.totalLoot+=Math.round(st.loot);T.capsTaken+=st.capsTaken;T.maxHarbors=Math.max(T.maxHarbors,st.maxHarb||0);T.maxLootGame=Math.max(T.maxLootGame,Math.round(st.loot));
  for(const e in st.evN)if(!T.evSeen.includes(e))T.evSeen.push(e);for(const k of['akin','yagma','harac'])T.abil[k]=(T.abil[k]||0)+(st[k+'N']||0);
  if(!c.train){const B=T.best,pd=B.dyn[c.dyn]||0,pm=B.map[c.map]||0;R.rec={pd,pm,dyn:sc.v>pd,map:sc.v>pm};if(sc.v>pd)B.dyn[c.dyn]=sc.v;if(sc.v>pm)B.map[c.map]=sc.v;T.bestScore=Math.max(T.bestScore,sc.v);bd.best=Math.max(bd.best||0,sc.v)}
  // başarımlar (rövanş/antrenman açmaz; Çırak'ta yalnız c işaretliler)
  if(!c.rematch&&!c.train)for(const A of ACH){if(M.ach[A.id]||(c.diff==='cirak'&&!A.c))continue;const ok=A.pr?(q=>q[0]>=q[1])(A.pr(M)):A.t(s,M);
   if(ok){M.ach[A.id]=dateKey();R.ach.push(A.id);if(A.cos&&!M.unlocked.cos.includes(A.cos))M.unlocked.cos.push(A.cos)}}
  for(const A of ACH)if(!M.ach[A.id]&&A.miss){const t=A.miss(s);if(t){R.miss=t;break}}
  R.mpG.game=mp.game;if(!M.firstDone){M.firstDone=true;R.mpG.first=20}R.mpG.ach=R.ach.reduce((a,k)=>a+ACHM[k].mp,0);
  if(c.daily&&!c.train){R.mpG.daily=5;R.daily=dailyCommit(c.daily,s,sc.v)}
  R.mpTot=R.mpG.game+R.mpG.first+R.mpG.ach+R.mpG.daily;M.mp+=R.mpTot;M.mpTotal+=R.mpTot;
  // koşullu açılımlar (antrenman hariç)
  const cu=(cat,id,how)=>{if(!isOpen(cat,id)){M.unlocked[cat].push(id);R.unl.push({cat,id,how})}};
  if(!c.train){if(win&&c.diff==='kalfa')cu('diff','usta',"Kalfa'da zafer");if(win&&(c.diff==='usta'||c.diff==='destan')){cu('diff','destan',"Usta'da zafer");cu('mut','ittifak',"Usta'da zafer");cu('mut','surgun',"Usta'da zafer")}
   // hanedanların MP'siz yolu Çırak'ta işlemez (Çırak'ta 1500 ganimet ilk oyunda geliyordu; Kalfa botunda 1500 ganimet %75, 3 Liman %54 oyunda tutuyordu → 6000 / 4)
   if(c.diff!=='cirak'){if(pathWon(s,'medeniyet'))cu('dyn','bilge','Medeniyet zaferi');if((st.maxHarb||0)>=4)cu('dyn','deniz','aynı anda 4 Liman');if(st.loot>=6000)cu('dyn','akinci','tek oyunda 6000 ganimet')}}
  R.aff=lockList().filter(L=>L.cost&&!L.open&&L.cost<=M.mp&&L.cost>R.mp0).sort((a,b)=>CAT_PRI[a.cat]-CAT_PRI[b.cat]||a.cost-b.cost).map(L=>({cat:L.cat,id:L.id}));
  M.history.unshift({d:dateKey(),c:{dyn:c.dyn,muts:c.muts,map:c.map,size:c.size,diff:c.diff},seed:s.seed,over:s.over,winBy:s.winBy,turn:s.turn,score:sc.v,mp:R.mpTot,daily:c.daily,re:c.rematch,tr:c.train});M.history=M.history.slice(0,20)}
 if(!R.dup){M.done.push(id);M.done=M.done.slice(-40)}
 saveMeta();s.metaDone=true;s.endRes=R;saveNow();return R}

// --- Günlük meydan okuma (§10 + 1c): tarihten tohum, kurallar sabit (Kısa, Kalfa; Cuma Usta), ilk BAŞLATILAN deneme sayılır ---
function hash32(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)}return h>>>0}
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dayNum=k=>{const[y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const weekKey=k=>{const n=dayNum(k);return'w'+(n-(new Date(n*864e5).getUTCDay()+6)%7)};// Pazartesi başlar
const fmtDate=k=>k?k.split('-').reverse().join('.'):'';
function dailyOf(k){const sd=hash32('FTH'+k.replace(/-/g,'')),R=mulberry32(sd),all=Object.keys(MUTS),dyn=DYN6[fl(R()*DYN6.length)],diff=new Date(dayNum(k)*864e5).getUTCDay()===5?'usta':'kalfa';let muts=null;
 for(let q=0;q<40&&!muts;q++){const a=all[fl(R()*all.length)],b=all[fl(R()*all.length)];if(a!==b&&!mutBanned([a,b],diff))muts=[a,b]}
 const map=Object.keys(MAPTYPES)[fl(R()*4)];return{seed:sd%1e9,cfg:{dyn,muts:muts||['kitlik'],map,size:'kisa',diff,ferman:null,bonus:[],daily:k}}}
// Seri: dün oynandıysa +1; 1 gün kaçtıysa mühür yakılır; her 7 günlük seri 1 mühür (en çok 2). Haftada 4 gün → Haftalık Sancak. Ödüller kozmetik.
function dailyCommit(k,s,v){const D=META.daily,o={k,inc:false};
 if(D.last!==k){const gap=D.last?dayNum(k)-dayNum(D.last):99;if(gap>0){if(gap===1)D.streak++;else if(gap===2&&D.seals>0){D.seals--;D.streak++;o.seal=true}else D.streak=1;D.last=k;o.inc=true}}
 if(o.inc){D.best=Math.max(D.best,D.streak);if(D.streak%7===0)D.seals=Math.min(2,D.seals+1);const cs=META.unlocked.cos;if(D.streak>=7&&!cs.includes('yedi'))cs.push('yedi');if(D.streak>=30&&!cs.includes('cihan'))cs.push('cihan')}
 const w=weekKey(k);if(!D.hist[k])D.weeks[w]=(D.weeks[w]||0)+1;if(!D.hist[k]&&D.weeks[w]===4){o.week=true;if(!META.unlocked.cos.includes('haftalik'))META.unlocked.cos.push('haftalik')}
 const wk=Object.keys(D.weeks).sort();while(wk.length>10)delete D.weeks[wk.shift()];
 D.hist[k]={score:v,win:s.over==='win',turn:s.turn,path:s.winBy,dyn:s.cfg.dyn};const hk=Object.keys(D.hist).sort();while(hk.length>60)delete D.hist[hk.shift()];
 o.streak=D.streak;return o}
function startDaily(k){if(!META)loadMeta();const today=dateKey();k=k||today;if(!dayOk(k)){toast('Geçersiz günlük tarih.');return}const d=dailyOf(k),tr=k!==today||!!META.daily.started[k];
 if(!tr){META.daily.started[k]=1;const sk=Object.keys(META.daily.started).sort();while(sk.length>14)delete META.daily.started[sk.shift()]}
 launch(d.seed,normCfg({...d.cfg,train:tr}))}
// --- Tohum kodu (§8.5): FTH-<tohum base36>-<hanedan>-<harita>-<zorluk>-<kart.kart|0>-<boy>; günlük FTH-DYYYYAAGG ---
const CODE={dyn:{klasik:'KL',boru:'BO',tunc:'TU',kartal:'KA',bilge:'BI',deniz:'DE',akinci:'AK'},map:{kita:'KI',vadi:'VA',dag:'DA',korfez:'KO'},diff:{cirak:'CI',kalfa:'KA',usta:'US',destan:'DS'},size:{kisa:'K',orta:'O',uzun:'U'},
 mut:{kitlik:'KT',erken:'ER',kabile:'KB',sur:'SU',parali:'PA',altincag:'AC',bereket:'BE',demirsiz:'DM',veba:'VB',sis:'SI',kanli:'KN',baris:'BA',ittifak:'IT',surgun:'SG'}};
function seedCode(seed,c){if(c.daily)return'FTH-D'+c.daily.replace(/-/g,'');return['FTH',(seed>>>0).toString(36).toUpperCase(),CODE.dyn[c.dyn],CODE.map[c.map],CODE.diff[c.diff],c.muts.map(m=>CODE.mut[m]).join('.')||'0',CODE.size[c.size]].join('-')}
// 1d: günlük kod gerçek bir takvim günü olmalı (ay 13, 30 Şubat… reddedilir)
const dayOk=k=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(k||'');if(!m)return false;const d=new Date(Date.UTC(+m[1],m[2]-1,+m[3]));return +m[1]>=2000&&+m[1]<=2999&&d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===m[2]-1&&d.getUTCDate()===+m[3]};
function parseCode(t){t=String(t||'').trim().toUpperCase();let m=t.match(/^FTH-D(\d{4})(\d{2})(\d{2})$/);if(m)return dayOk(`${m[1]}-${m[2]}-${m[3]}`)?{daily:`${m[1]}-${m[2]}-${m[3]}`}:null;
 m=t.match(/^FTH-([0-9A-Z]{1,7})-([A-Z]{2})-([A-Z]{2})-([A-Z]{2})-([A-Z0.]{1,5})(?:-([KOU]))?$/);if(!m)return null;const rv=k=>{const o={};for(const a in CODE[k])o[CODE[k][a]]=a;return o};
 const cfg={dyn:rv('dyn')[m[2]],map:rv('map')[m[3]],diff:rv('diff')[m[4]],size:rv('size')[m[6]||'O'],muts:m[5]==='0'?[]:m[5].split('.').map(x=>rv('mut')[x])},seed=parseInt(m[1],36);
 if(!cfg.dyn||!cfg.map||!cfg.diff||!cfg.size||cfg.muts.some(x=>!x)||!(seed>=0)||mutBanned(cfg.muts,cfg.diff))return null;return{seed,cfg}}
// Koddan gelen ayarda kilitli içerik varsa oyun antrenman sayılır (kilit atlatılmasın)
const lockedIn=c=>!isOpen('dyn',c.dyn)||!isOpen('map',c.map)||!isOpen('size',c.size)||!isOpen('diff',c.diff)||c.muts.some(m=>!isOpen('mut',m));

// --- Zaferi ilan et (1c): güç = asker + 5 × bölge. Toprağın ≥ %25 ve gücün ≥ 1,25 × (yıkılmamış, vasal olmayan) rakiplerin toplamı ise oyun erken bitirilebilir ---
const DECL={r:1.25,sh:.25};// eşikler: 1c'de 1,5×/%30; 1d'de 1,25×/%25 (Uygulama notları 1d)
const powOf=f=>{let t=0,n=0;for(const r of S.regions)if(r.owner===f){t+=r.troops;n++}return t+5*n};
function declInfo(){const riv=S.cfg.ais.filter(f=>aliveAI(f)&&!isVas(f)),rp=riv.reduce((a,f)=>a+powOf(f),0),sh=own().length/MAP.playN,r=rp?powOf(0)/rp:99;
 return{ok:!S.over&&S.phase==='oyun'&&S.turn>=S.cfg.grace&&riv.length>0&&sh>=DECL.sh&&r>=DECL.r,r,sh}}
const declOk=()=>declInfo().ok;
function declProbe(){const o=S.over,w=S.winBy;S.over='win';S.winBy='ilan';const r=scoreOf(S);S.over=o;S.winBy=w;return{t:S.turn,v:r.v,raw:r.p.raw}}
function askDeclare(){if(!declOk())return;const d=declInfo(),p=declProbe();modal(`<h3>👑 Zaferi ilan et</h3><p>Gücün rakiplerinin toplamının <b>${fmtX(r1(d.r))}</b> katı, toprakların %${Math.round(d.sh*100)}. Savaşı şimdi bitirebilirsin.</p><p class=muted style="font-size:calc(12.5px*var(--ts))">Zafer İlanı: taban 900 (Fetih 1000), hız bonusunun yarısı. Fetih fermanını tutmuş sayılır. Şimdi biterse skor ≈ <b>${fmtN(p.v)}</b>.</p><div class=row><button class=btn onclick="closeModal()">Sürdür</button><button class="btn primary" onclick="declareWin()">👑 İlan et</button></div>`,'decl')}
function declareWin(){if(!declOk())return;S.over='win';S.winBy='ilan';S.stats.declared=S.turn;log('👑 Zafer ilan edildi.','good');closeModal();refresh();saveNow();afterModal()}

// --- Bitiş ekranı ---
function afterModal(){if(!S||!S.over)return;let R=null;try{R=commitMeta()}catch(e){onErr('Miras yazılamadı: '+e.message,e.stack)}showEnd(R)}
// Yenilgi teşhisi: tek madde (S.stats'tan)
function diagOf(s){const st=s.stats;if(st.famine>=3)return`Ordun ${st.famine} yıl aç kaldı: ikinci tarlayı daha erken kur, tahıl gelirini artıda tut.`;
 if(st.defLost>=3&&st.surBuilt<2)return`Cephen sursuzdu: ${st.defLost} bölgeyi savunmada kaybettin, yalnız ${st.surBuilt} sur kurdun.`;
 if(s.coal&&s.coal.n)return'Koalisyona yakalandın: %35\'e yaklaşırken cepheni sur ve okçuyla güçlendir.';
 if(st.atkLost>st.atkWon)return`Saldırılarının çoğu püskürtüldü (${st.atkLost}/${st.atkWon+st.atkLost}): şansın %60'ın altındayken saldırma.`;
 return'Rakipler senden hızlı büyüdü: barış döneminde daha çok kabile bölgesi al.'}
