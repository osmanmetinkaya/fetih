<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fetih</title>
<style>
:root{--bg:#17130f;--panel:#241e17;--panel2:#2f271e;--line:#4a3d2e;--text:#efe6d6;--muted:#a99b84;--accent:#d9a441;--good:#86b86f;--bad:#e0635c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title{font-weight:800;color:var(--accent);letter-spacing:1px;font-size:16px}
.res{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.r{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:help;white-space:nowrap}
.r b{font-variant-numeric:tabular-nums}
.r .inc{font-size:11px;margin-left:3px}
.navb{display:flex;gap:5px;flex-wrap:wrap}
.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}
main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1;display:flex;align-items:center;justify-content:center;background:#0d1720;min-width:0;min-height:0;position:relative}
#stage{position:relative}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#lab{cursor:pointer}
#tip{position:absolute;pointer-events:none;background:rgba(20,16,12,.94);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;max-width:340px;z-index:5}
aside{width:350px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side{flex:1;overflow:auto;padding:12px 14px}
.foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}
.btn.danger{background:#7a2a24;border-color:#a8433b}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.big{flex:1;padding:10px;font-size:15px}
.btn.wide{width:100%;margin-top:10px}
h2{margin:0;font-size:18px}h3{margin:0 0 10px}h4{margin:16px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.rh{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.4);vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats>div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{font-size:16px}.stats small{display:block;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--panel2);border-radius:4px;padding:2px 6px;font-size:12px}
.feat{background:#3a2f1f;border:1px solid #6b5530;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:12.5px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #3a3025}
.item small{display:block;color:var(--muted);font-size:11.5px}
.ok{color:var(--good);font-weight:700}
.rec{display:flex;align-items:center;gap:8px;margin-top:6px}
.rec input{flex:1}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
.bar{height:8px;background:#3a3025;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #3a3025;font-size:13px}
.kv span:first-child{color:var(--muted)}
.log p{margin:0 0 6px;font-size:13px}
.log .t{color:var(--muted);font-size:11px;margin-right:4px}
.good{color:var(--good)}.bad{color:var(--bad)}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
/* pencereler */
.win{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.6);display:flex;flex-direction:column;max-height:calc(100vh - 90px);max-width:calc(100vw - 16px)}
.wtitle{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--panel2);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;cursor:move;user-select:none;font-weight:700;touch-action:none}
.wtitle .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;padding:0 6px}
.wtitle .x:hover{color:var(--text)}
.wbody{overflow:auto;padding:12px 14px}
.wtabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.wtabs button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12.5px}
.wtabs button.on{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.card small{font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}
.fundbox{background:#3a2f1f;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:15px}
.stars{color:var(--accent);letter-spacing:1px}
.ladder .step{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2)}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step.done{opacity:.65}.step.lock{opacity:.5}
.step .info{flex:1}.step small{display:block;color:var(--muted);font-size:11.5px}
.lv{font-weight:800;width:28px;height:28px;border-radius:50%;background:#3f3324;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.step.done .lv{background:#3d5530;color:#cfe8bf}
.tree{display:grid;grid-template-columns:118px repeat(4,1fr);gap:7px 16px;align-items:stretch}
.tree .th{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.8px}
.tree .brn{font-weight:700;font-size:13px;display:flex;align-items:center}
.node{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer;background:var(--panel2);position:relative;font-weight:600}
.node small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.node:hover{border-color:var(--accent)}
.node.done{border-color:#5d7f48;background:#26301f}
.node.avail{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.node.lock{opacity:.5}
.node::before{content:'›';position:absolute;left:-12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.node.n0::before{content:none}
.tdh{display:flex;gap:12px;align-items:center}
.prog{display:flex;gap:4px;margin:12px 0}
.prog i{flex:1;height:6px;border-radius:3px;background:#3a3025}
.prog i.d{background:var(--good)}.prog i.c{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 5px;border-bottom:1px solid #3a3025;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.urow{display:grid;grid-template-columns:130px 1fr 30px 34px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:12.5px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100000;padding:16px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
.chance{font-size:28px;font-weight:800;text-align:center;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2f22;border:1px solid var(--accent);padding:8px 14px;border-radius:6px;display:none;z-index:100001}
@media (max-width:820px){main{flex-direction:column}aside{width:auto;height:44vh;border-left:0;border-top:1px solid var(--line)}
 .win{left:6px!important;right:6px;top:56px!important;width:auto!important}.tree{grid-template-columns:80px repeat(4,minmax(90px,1fr))}}
</style>
</head>

function artPoints(R){const n=R.length,disc=new Int32Array(n).fill(-1),low=new Int32Array(n),ap=new Uint8Array(n);let t=0;

function cleanup(ids,n,minArea){

  const vis=r=>{const id=ids[r];if(id===rid){if(comp[r]<0){comp[r]=ci;stack[sp++]=r}}else if(id>=0&&nbr<0)nbr=id};
  while(sp){const q=stack[--sp];size++;const x=q%W;if(x>0)vis(q-1);if(x<W-1)vis(q+1);if(q>=W)vis(q-W);if(q<N-W)vis(q+W)}

function newGame(seed){

  tech:{sal:0,sav:0,kus:0,eko:0,ure:0,str:0},log:[],over:null,
  regions:G.map(g=>({owner:g.block?BLOCK:NEUTRAL,u:Z(),rd:Z(),troops:0,ready:0,fort:0,capital:false,rec:0,base:0,fields:[],mil:0,auto:true,autoU:'piy'}))};
 const play=G.map((g,i)=>i).filter(i=>!G[i].block);
 let cand=play.filter(i=>['ova','vadi'].includes(G[i].terrain)&&G[i].adj.length>=3&&G[i].feat!=='gecit');if(!cand.length)cand=play;
 const starts=[cand[fl(rng()*cand.length)]],dists=[bfs(starts[0])];
 for(let k=1;k<4;k++){let best=-1,bv=-1;for(const i of play){if(starts.includes(i)||G[i].adj.length<2)continue;const v=Math.min(...dists.map(d=>d[i]))+rng()*.5;if(v>bv){bv=v;best=i}}starts.push(best);dists.push(bfs(best))}
 starts.forEach((i,f)=>{const r=S.regions[i];r.owner=f;r.capital=true;r.fort=1;addU(r,f===0?{piy:15}:{piy:14,okc:4},true);if(f===0)r.mil=1});
 S.regions.forEach((r,i)=>{if(r.owner!==NEUTRAL)return;const g=G[i];
  const t=Math.min(32,4+dists[0][i]*2+fl(rng()*6)+(g.feat?3:0)+(g.feat==='gecit'?5:0));r.base=t;addU(r,{piy:t-Math.round(t*.3),okc:Math.round(t*.3)},true);r.fort=g.feat==='kale'?2:rng()<.2?1:0});
 ui.sel=starts[0];
 log(`${FAC[0].ad} ${G[starts[0]].name} bölgesinde kuruluyor.`,'good');
}

function riverF(o,a,b){const c=crossAt(a,b);if(!c||c.bridge)return 1;return o===0?mil().river:.75}
function atkParts(o,n,from,to){const p=[];if(o===0){const M=mil(),cov=n>0?Math.min(1,S.res.demir/(n*IRON)):1;
  if(M.atk)p.push(['⚔️ Saldırı teknolojisi',M.atk]);p.push([`⚒️ Silah donanımı (%${Math.round(cov*100)})`,cov*M.equip]);if(S.regions[to].fort&&M.fortAtk)p.push(['🪵 Topçu',M.fortAtk])}
 else if(o!==NEUTRAL&&aiB())p.push(['Düşman teknolojisi',aiB()]);return p}
function atkMult(o,n,from,to){let m=1+atkParts(o,n,from,to).reduce((s,x)=>s+x[1],0);if(o===0)m*=moraleMult(S.morale);return m*riverF(o,from,to)}
function siegeOf(o,fort,A){if(!fort)return 0;let b;if(o===0){const M=mil();b=M.siege*Math.min(1,S.res.odun/(fort*WOOD*M.woodMult))}else b=S.turn>15?.35:.15;return Math.min(.95,b+unitSiege(A))}
function defParts(i,siege){const r=S.regions[i],g=MAP.regions[i],p=[];if(TER[g.terrain].def)p.push([TER[g.terrain].e+' Arazi ('+TER[g.terrain].ad+')',TER[g.terrain].def]);
 if(g.feat&&FEAT[g.feat].def)p.push([FEAT[g.feat].e+' '+FEAT[g.feat].ad,FEAT[g.feat].def]);if(r.capital)p.push(['★ Başkent',.2]);
 const fp=r.owner===0?mil().fortPer:.25;if(r.fort)p.push([`🧱 Sur ×${r.fort}`+(siege?` (kuşatma %${Math.round(siege*100)} kırdı)`:''),r.fort*fp*(1-siege)]);
 if(r.owner===0&&mil().def)p.push(['🛡️ Savunma teknolojisi',mil().def]);if(r.owner>0&&r.owner<NEUTRAL&&aiB())p.push(['Düşman teknolojisi',aiB()]);return p}
function defMult(i,siege){const r=S.regions[i];let d=1+defParts(i,siege).reduce((s,x)=>s+x[1],0);if(r.owner===0)d*=moraleMult(S.morale);return d}
function odds(a,d){if(d<=0)return 1;let w=0;const K=24;for(let i=0;i<K;i++)for(let j=0;j<K;j++)if(a*(.85+.3*(i+.5)/K)>d*(.85+.3*(j+.5)/K))w++;return w/(K*K)}
function est(t){return t<=3?t:Math.max(5,Math.round(t/5)*5)}
function computeVision(){const o=own();VIS=o.length?bfs(o):new Array(MAP.n).fill(99)}
function vis(i){const r=S.regions[i];if(r.owner===0||mil().spy)return{v:r.troops,txt:''+r.troops,exact:true};if(VIS[i]<=mil().sight){const e=est(r.troops);return{v:e,txt:'~'+e,exact:false}}return{v:null,txt:'?',exact:false}}

function resolve(ao,from,to,A){
 const R=S.regions,F=R[from],T=R[to],n=sumU(A),siege=siegeOf(ao,T.fort,A),am=atkMult(ao,n,from,to);
 if(ao===0){const M=mil();S.res.demir-=Math.min(S.res.demir,n*IRON);if(T.fort)S.res.odun-=Math.min(S.res.odun,T.fort*WOOD*M.woodMult)}
 const aP=rawAtk(A,to,ao)*am,dP=rawDef(T.u)*defMult(to,siege);remU(F,A,true);
 const ra=aP*(.85+Math.random()*.3),rd=dP*(.85+Math.random()*.3),dt=T.troops,D=Object.assign(Z(),T.u);
 if(ra>rd){let fr=rd>0?Math.sqrt(1-(rd/ra)**2):1;if(ao===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.conqLoss}const SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;
  if(ao===0)S.morale=Math.min(mil().maxMorale,S.morale+5);conquer(to,ao,SV);return{win:true,sent:n,surv:sumU(SV),lost:n-sumU(SV),dLost:dt,SV}}
 let fr=Math.sqrt(1-(ra/rd)**2);if(T.owner===0){const M=mil();fr=1-(1-fr)*M.lossMult*M.defLoss}const DS=scaleU(D,fr);if(sumU(DS)<1)DS[UK.find(k=>D[k])||'piy']=1;
 const back=Z();for(const k of UK)back[k]=fl((A[k]||0)*.2);addU(F,back,false);
 T.u=DS;for(const k of UK)T.rd[k]=Math.min(T.rd[k],DS[k]);sync(T);
 if(ao===0)S.morale=Math.max(0,S.morale-6);if(T.owner===0)S.morale=Math.min(mil().maxMorale,S.morale+2);
 return{win:false,sent:n,back:sumU(back),lost:n-sumU(back),dLost:dt-sumU(DS)}}
function conquer(i,o,troops){
 const r=S.regions[i],old=r.owner,g=MAP.regions[i];r.owner=o;r.u=Object.assign(Z(),troops);r.rd=Z();sync(r);r.fort=Math.max(0,r.fort-1);
 if(r.mil>1)r.mil--;r.fields.forEach(f=>{if(f.lv>1)f.lv--});
 if(o===0){S.res.bilgi+=4;S.res.altin+=10+(r.capital?20:0);r.auto=true}
 if(old===0)S.morale=Math.max(0,S.morale-6);
 if(r.capital){r.capital=false;if(old!==NEUTRAL){const rest=S.regions.map((x,k)=>k).filter(k=>S.regions[k].owner===old);
  if(rest.length){const c=rest.sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];S.regions[c].capital=true;
   if(old===0){S.morale=Math.max(0,S.morale-20);log(`Başkentin ${g.name} düştü! Yeni başkent: ${MAP.regions[c].name}. Moral -20.`,'bad')}
   else log(`${FAC[old].ad} başkenti ${g.name}'i kaybetti; yeni başkent ${MAP.regions[c].name}.`)}}}
 if(old>0&&old<NEUTRAL&&!S.regions.some(x=>x.owner===old))log(`${FAC[old].ad} yıkıldı!`,'good');
}

function slots(i){const g=MAP.regions[i],r=S.regions[i];return TER[g.terrain].slots+(r.capital?1:0)+(g.feat==='verimli'?1:0)}
function fieldEff(i,t){const g=MAP.regions[i],F=FIELD[t];let e=F.eff[g.terrain]||1;if(g.feat==='verimli'&&(t==='tarla'||t==='pazar'))e*=1.5;if(g.feat==='damar'&&(t==='demir'||t==='tasocagi'))e*=1.6;return e}
function fieldOut(i,f,lv=f.lv){const F=FIELD[f.t],M=mil();let v=F.base*LVM[lv]*fieldEff(i,f.t)*M.fieldMult;if(F.r==='tahil')v*=M.tarla;if(F.r==='altin')v*=M.altinMult;return v}
function prodParts(i){const g=MAP.regions[i],r=S.regions[i],p=[],am=mil().altinMult;
 for(const[k,v]of Object.entries(TER[g.terrain].y))p.push([TER[g.terrain].e+' '+TER[g.terrain].ad,k,k==='altin'?v*am:v]);
 if(g.feat&&FEAT[g.feat].y)for(const[k,v]of Object.entries(FEAT[g.feat].y))p.push([FEAT[g.feat].e+' '+FEAT[g.feat].ad,k,k==='altin'?v*am:v]);
 if(r.capital)for(const[k,v]of Object.entries({tahil:2,altin:3,demir:1,bilgi:3}))p.push(['★ Başkent',k,k==='altin'?v*am:v]);
 r.fields.forEach(f=>p.push([`${FIELD[f.t].e} ${FIELD[f.t].ad} Sv.${f.lv}`,FIELD[f.t].r,fieldOut(i,f)]));return p}
function production(i){const y={};prodParts(i).forEach(([,k,v])=>y[k]=(y[k]||0)+v);return y}
function economy(){const gross={tahil:0,odun:0,tas:0,demir:0,altin:0,bilgi:0};let troops=0;
 let uw=0;own().forEach(i=>{addY(gross,production(i));troops+=S.regions[i].troops;uw+=UK.reduce((s,k)=>s+S.regions[i].u[k]*UNITS[k].up,0)});
 const M=mil(),up={tahil:uw*.2*M.upkeep,altin:uw*.1*M.upkeep},net={};for(const k in gross)net[k]=gross[k]-(up[k]||0);
 return{gross,up,net,troops}}
const fieldCount=()=>own().reduce((s,i)=>s+S.regions[i].fields.length,0);
function newFieldCost(t){return scaleC(FIELD[t].cost,1+.2*fieldCount())}
function upFieldCost(f){return scaleC(FIELD[f.t].cost,Math.pow(f.lv+1,1.7))}
function fieldReq(lv){return lv<=2?null:lv===3?['eko',1]:lv===4?['eko',2]:['eko',4]}
function surCost(i){const lv=S.regions[i].fort+1;return{tas:Math.round(20*lv*mil().surDisc),odun:10}}
function maxFort(i){return mil().maxFort+(MAP.regions[i].feat==='kale'?1:0)}
function recCost(i){return unitCost(i,'piy')}
function autoType(i){const r=S.regions[i],k=r.autoU;return UNITS[k]&&r.mil>=UNITS[k].mil?k:'piy'}
function recLeft(i){const r=S.regions[i];return r.mil?MIL[r.mil].lim-r.rec:0}
function maxAfford(c){return fl(Math.min(...Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>S.res[k]/v)))}
function autoRate(i){const r=S.regions[i];return r.mil?fl(MIL[r.mil].auto*mil().autoMult/UNITS[autoType(i)].w):0}
const techName=(b,k)=>BR.find(x=>x.id===b).t[k-1].ad;

function buyStart(t){const c=capIdx();if(S.phase!=='kurulus'||S.fund<FIELD[t].fund||S.regions[c].fields.length>=slots(c))return;S.fund-=FIELD[t].fund;S.regions[c].fields.push({t,lv:1});refresh()}

function finishSetup(){const c=capIdx();if(!S.regions[c].fields.length)return;S.res.altin+=S.fund;
 log(`Kuruluş tamamlandı: ${S.regions[c].fields.map(f=>FIELD[f.t].ad).join(', ')}.${S.fund?` Kalan ${S.fund} akçe hazineye aktarıldı.`:''} Barış dönemi: rakipler ${GRACE}. yıla kadar sana saldırmaz.`,'good');
 S.fund=0;S.phase='oyun';closeWin('kurulus');refresh();openRegionWin(c,'alan')}
function buildField(i,t){const c=newFieldCost(t),r=S.regions[i];if(r.owner!==0||r.fields.length>=slots(i)||!canPay(c))return;pay(c);r.fields.push({t,lv:1});log(`${MAP.regions[i].name}: ${FIELD[t].ad} kuruldu.`);refresh()}
function upgradeField(i,k){const r=S.regions[i],f=r.fields[k];if(!f||r.owner!==0||f.lv>=mil().maxField)return;const c=upFieldCost(f);if(!canPay(c))return;pay(c);f.lv++;log(`${MAP.regions[i].name}: ${FIELD[f.t].ad} Sv.${f.lv} oldu.`);refresh()}
function upgradeMil(i){const r=S.regions[i],nx=r.mil+1;if(r.owner!==0||nx>5||S.tech.ure<MIL[nx].tech||!canPay(MIL[nx].cost))return;pay(MIL[nx].cost);r.mil=nx;log(`${MAP.regions[i].name}: ${MIL[nx].ad} kuruldu (kademe ${nx}).`,'good');refresh()}
function toggleAuto(i){const r=S.regions[i];r.auto=!r.auto;refresh()}
function buildSur(i){const r=S.regions[i],c=surCost(i);if(r.owner!==0||r.fort>=maxFort(i)||!canPay(c))return;pay(c);r.fort++;log(`${MAP.regions[i].name}: sur seviyesi ${r.fort}.`);refresh()}
function recruit(i,k,n){const r=S.regions[i],U=UNITS[k],c=unitCost(i,k);if(r.owner!==0||!r.mil||r.mil<U.mil)return;n=Math.min(n,fl(recLeft(i)/U.w),maxAfford(c));if(n<1)return;
 for(const q in c)S.res[q]-=c[q]*n;addU(r,{[k]:n},false);r.rec+=n*U.w;log(`${MAP.regions[i].name}: ${n} ${U.ad} toplandı.`);refresh()}
function setAutoU(i,k){S.regions[i].autoU=k;refresh()}
function research(b,k){if(S.tech[b]!==k||S.res.bilgi<TCOST[k])return;S.res.bilgi-=TCOST[k];S.tech[b]++;const B=BR.find(x=>x.id===b);
 log(`Teknoloji: ${B.t[k].ad} (${B.ad} ${ROM[k+1]}) geliştirildi.`,'good');refresh();if(k<3)toast(`🔓 ${B.t[k+1].ad} artık araştırılabilir`)}
function canMove(from,to){if(from===to||S.regions[to].owner!==0||S.regions[from].owner!==0)return false;if(MAP.regions[from].adj.includes(to))return true;if(!mil().roads)return false;
 const seen=new Set([from]),q=[from];while(q.length){const c=q.shift();for(const j of MAP.regions[c].adj){if(seen.has(j)||S.regions[j].owner!==0)continue;if(j===to)return true;seen.add(j);q.push(j)}}return false}
function canAttack(from,to){return S.phase==='oyun'&&S.regions[from].owner===0&&S.regions[to].owner>0&&MAP.regions[from].adj.includes(to)}

function previewAtk(from,to,A){const t=S.regions[to],M=mil(),n=sumU(A),siege=siegeOf(0,t.fort,A),am=atkMult(0,n,from,to),K=knownDef(to),dm=defMult(to,siege),aP=rawAtk(A,to,0)*am,dP=rawDef(K)*dm;
 return{n,am,dm,aP,dP,ch:n?odds(aP,dP):0,known:M.spy?t.troops:est(t.troops),siege,iron:Math.min(S.res.demir,n*IRON),ironNeed:n*IRON,wood:t.fort?Math.min(S.res.odun,t.fort*WOOD*M.woodMult):0,woodNeed:t.fort*WOOD*M.woodMult}}
let ACT=null;
function picker(av){return UK.filter(k=>av[k]>0).map(k=>`<div class=urow><span title="${UNITS[k].d}">${UNITS[k].e} ${UNITS[k].ad}</span><input type=range id=pk${k} min=0 max=${av[k]} value=${av[k]} oninput="updPick()"><b id=pk${k}v>${av[k]}</b><small class=muted>/${av[k]}</small></div>`).join('')}

function openAttack(from,to){const r=S.regions[from];if(S.over)return;if(S.phase!=='oyun'){toast('Önce kuruluşu tamamla.');return}if(r.ready<1){toast('Bu bölgede bu tur hazır asker yok.');return}
 const tg=MAP.regions[to];ACT={type:'atk',from,to};
 modal(`<h3>⚔️ ${MAP.regions[from].name} → ${tg.name}</h3>
 <div class=muted>${FAC[S.regions[to].owner].ad} · ${TER[tg.terrain].e} ${TER[tg.terrain].ad}${tg.feat?' · '+FEAT[tg.feat].e+' '+FEAT[tg.feat].ad:''}</div>

function updAtk(){const{from,to}=ACT,A=pickComp(),n=sumU(A);$('#an').textContent=n;$('#atb').disabled=!n;if(!n){$('#ap').innerHTML='<p class=muted>En az bir birlik seç.</p>';return}
 const p=previewAtk(from,to,A),M=mil(),c=crossAt(from,to),T=S.regions[to];

 <div class=kv><span>Düşman birlikleri</span><span>${M.spy?compTxt(T.u):'~'+est(T.troops)+' (bileşim bilinmiyor)'}</span></div>

 <div class=kv><span>🔥 Moral</span><span>×${moraleMult(S.morale).toFixed(2)}</span></div>
 ${c?`<div class=kv><span>${c.bridge?'🌉 Köprüden geçiş':'🌊 Nehir geçişi'}</span><span class="${c.bridge?'':'bad'}">${c.bridge?'ceza yok':'×'+M.river}</span></div>`:''}

 <h4>Savunma çarpanı</h4>${defParts(to,p.siege).map(([k,v])=>`<div class=kv><span>${k}</span><span>+${pct(v)}</span></div>`).join('')||'<p class=muted>Ek savunma yok.</p>'}
 ${M.spy?'':'<p class=muted style="font-size:12px">Düşman sayısı tahminidir. Strateji II (Casusluk) kesin bilgi verir.</p>'}`}
function doAttack(){const{from,to}=ACT,A=pickComp();if(!sumU(A))return;const tn=MAP.regions[to].name,prevOwner=S.regions[to].owner,wasCap=S.regions[to].capital;const res=resolve(0,from,to,A);
 if(res.win){log(`${tn} fethedildi! (${res.lost} kayıp)`,'good');ui.sel=to}else log(`${tn} saldırısı püskürtüldü. ${res.lost} asker kaybedildi.`,'bad');

 :`Saldırı püskürtüldü. ${res.sent} askerden ${res.back} tanesi geri çekildi. Düşman ${res.dLost} asker kaybetti.<br><span class=bad>Moral -6</span>`}</p>
 <div class=row><button class="btn primary" onclick="closeModal();afterModal()">Tamam</button></div>`)}

// ======================= TUR SONU & YAPAY ZEKA =======================
function endTurn(){if(S.over)return;if(S.phase!=='oyun'){toast('Önce kuruluşu tamamla.');return}
 const ev=[],e=economy(),M=mil();for(const k in e.net)S.res[k]+=e.net[k];let ok=true;
 if(S.res.tahil<0){S.res.tahil=0;ok=false;let lost=0;S.regions.forEach(r=>{if(r.owner===0&&r.troops>0){const l=Math.ceil(r.troops*.08);remU(r,takeProp(r.u,l),false);lost+=l}});S.morale-=10;ev.push({m:`Kıtlık! Ordu aç kaldı: ${lost} asker öldü, moral -10.`,c:'bad'})}
 if(S.res.altin<0){S.res.altin=0;ok=false;S.morale-=8;ev.push({m:'Hazine boş! Maaşlar ödenemedi, moral -8.',c:'bad'})}
 let made=0;own().forEach(i=>{const r=S.regions[i];if(!r.mil||!r.auto)return;const ut=autoType(i),c=unitCost(i,ut),n=Math.min(autoRate(i),maxAfford(c));if(n>0){for(const k in c)S.res[k]-=c[k]*n;addU(r,{[ut]:n},false);made+=n}});
 if(made)log(`Askeri kuruluşlar ${made} birlik yetiştirdi.`);
 const mabet=own().filter(i=>MAP.regions[i].feat==='mabet').length;
 if(ok)S.morale=Math.min(M.maxMorale,S.morale+M.moraleRec+mabet*2);S.morale=Math.max(0,S.morale);
 for(let f=1;f<=3;f++)aiTurn(f,ev);
 S.regions.forEach(r=>{if(r.owner===NEUTRAL&&S.turn%3===0&&r.troops<r.base*1.5)addU(r,{piy:1},false)});
 S.turn++;S.regions.forEach(r=>{if(r.u){r.rd=Object.assign(Z(),r.u);sync(r)}r.rec=0});
 if(S.turn===GRACE)ev.push({m:'Barış dönemi sona erdi. Rakipler artık sana saldırabilir!',c:'bad'});

 mine=[];R.forEach((r,i)=>{if(r.owner===f)mine.push(i)});const dist=new Map(),q=[];

 for(let k=1;k<=5;k++){const m=MIL[k],done=r.mil>=k,cur=r.mil===k,next=r.mil+1===k,techOk=S.tech.ure>=m.tech,nu=UK.filter(q=>UNITS[q].mil===k);let right='';
  if(cur)right='<span class=ok>Mevcut</span>';else if(done)right='<span class=ok>✓</span>';
  else if(next){right=techOk?`<button class="btn sm ${canPay(m.cost)?'primary':''}" ${canPay(m.cost)?'':'disabled'} onclick="upgradeMil(${i})">${r.mil?'⬆ Yükselt':'🏗 Kur'}<br><small>${costTxt(m.cost)}</small></button>`:`<small class=muted>🔒 ${techName('ure',m.tech)}</small>`}
  else right=`<small class=muted>${techOk?'':'🔒 '+techName('ure',m.tech)}</small>`;
  h+=`<div class="step ${cur?'cur':done?'done':next&&techOk?'':'lock'}"><div class=lv>${ROM[k]}</div><div class=info><b>${m.ad}</b> <span style="font-size:12px">· açar: ${nu.map(q=>UNITS[q].e+' '+UNITS[q].ad).join(', ')}</span><small>+${fl(m.auto*M.autoMult)} üretim puanı/tur · kapasite ${m.lim}/tur${m.disc?` · maliyet -%${m.disc*100}`:''}</small></div>${right}</div>`}
 h+='</div>';
 if(!r.mil)return h+'<p class=muted>Bu bölgede birlik yetiştirmek için önce Karakol kur.</p>';
 const at=autoType(i),left=recLeft(i);
 h+=`<h4>Otomatik üretim</h4><div class=rec><label class=switch><input type=checkbox ${r.auto?'checked':''} onchange="toggleAuto(${i})"> Her tur</label><b>${autoRate(i)}</b>
 <select onchange="setAutoU(${i},this.value)">${UK.filter(k=>r.mil>=UNITS[k].mil).map(k=>`<option value=${k} ${k===at?'selected':''}>${UNITS[k].e} ${UNITS[k].ad}</option>`).join('')}</select></div>
 <small class=muted>Tanesi ${costTxt(unitCost(i,at))}. Ağır birlikler daha fazla üretim puanı harcar (piyade/okçu 1, süvari/kuşatma 2, yeniçeri 3).</small>
 <h4>Birlik topla</h4><small class=muted>Bu tur kalan kapasite: <b>${left}</b> puan · Toplanan birlikler bir sonraki tur hazır olur.</small>`;
 for(const k of UK){const U=UNITS[k],un=r.mil>=U.mil,c=unitCost(i,k),mx=un?Math.max(0,Math.min(fl(left/U.w),maxAfford(c))):0;
  h+=`<div class=card style="margin-top:6px;${un?'':'opacity:.55'}"><div class=rh style="justify-content:space-between"><span>${U.e} <b>${U.ad}</b> <small class=muted>⚔${U.atk} 🛡${U.def} · ${U.w} puan</small></span><span class=muted style="font-size:12px">${r.u[k]?'burada '+r.u[k]:''}</span></div>
  <small class=muted>${U.d}</small><small>Maliyet ${costTxt(c)} · bakım ×${U.up}</small>
  ${!un?`<small class=muted>🔒 ${MIL[U.mil].ad} (kademe ${ROM[U.mil]}) gerekli</small>`:mx>0?`<div class=rec><input type=range id=rc${i}${k} min=1 max=${mx} value=${mx} oninput="$('#rv${i}${k}').textContent=this.value"><b id=rv${i}${k} style="min-width:24px">${mx}</b><button class="btn primary sm" onclick="recruit(${i},'${k}',+$('#rc${i}${k}').value)">Topla</button></div>`:`<small class=muted>${left<U.w?'Bu turun kapasitesi doldu.':'Yetersiz kaynak.'}</small>`}</div>`}
 return h}
function rgSur(i){const r=S.regions[i],M=mil(),mx=maxFort(i);
 let h=`<p class=muted style="font-size:12.5px;margin-top:0">Surlar taşla yapılır. Her seviye <b>+${pct(M.fortPer)}</b> savunma verir. Düşman kuşatma araçlarıyla bu bonusun bir kısmını kırabilir. Azami seviye Savunma dalı teknolojileriyle artar.</p><div class=ladder>`;
 for(let k=1;k<=Math.max(5,mx);k++){const done=r.fort>=k,next=r.fort+1===k,avail=k<=mx;let right='';

  else if(!avail)right=`<small class=muted>🔒 ${k-(mx-M.maxFort)<=4?techName('sav',2):techName('sav',3)}</small>`;
  h+=`<div class="step ${done?'done':next&&avail?'cur':'lock'}"><div class=lv>${k}</div><div class=info><b>Sur seviyesi ${k}</b><small>Toplam sur bonusu +${pct(k*M.fortPer)}</small></div>${right}</div>`}
 h+=`</div><h4>Güncel savunma çarpanı</h4>${defParts(i,0).map(([k,v])=>`<div class=kv><span>${k}</span><span>+${pct(v)}</span></div>`).join('')}<div class=kv><span>🔥 Moral</span><span>×${moraleMult(S.morale).toFixed(2)}</span></div><div class=kv><span>Toplam</span><b>×${defMult(i,0).toFixed(2)}</b></div>`;

function techState(b,k){return S.tech[b]>k?'done':S.tech[b]===k?'avail':'lock'}
function openTech(){openWin('tech',()=>'📜 Teknoloji Ağacı',winTech,640)}
function winTech(){let h=`<p class=muted style="margin-top:0">📜 Bilgi: <b style="color:var(--text)">${fl(S.res.bilgi)}</b> (${sgn(economy().net.bilgi)}/tur). Her dal kademe kademe ilerler. Bir kademeyi açtığında o dalın bir sonraki kademesi aktif olur. Ayrıntılar için teknolojiye tıkla.</p>
 <div class=tree><div></div>${[1,2,3,4].map(k=>`<div class=th>Kademe ${ROM[k]}</div>`).join('')}`;
 BR.forEach(b=>{h+=`<div class=brn>${b.e} ${b.ad}</div>`;b.t.forEach((t,k)=>{const st=techState(b.id,k);
  h+=`<div class="node ${st} n${k}" onclick="openTechWin('${b.id}',${k})">${st==='done'?'✓ ':st==='lock'?'🔒 ':''}${t.ad}<small>${st==='done'?'Açıldı':st==='avail'&&S.res.bilgi>=TCOST[k]?'<span class=good>📜 '+TCOST[k]+' · hazır</span>':'📜 '+TCOST[k]}</small></div>`})});
 return h+'</div>'}
function openTechWin(b,k){openWin('tech:'+b+k,()=>{const B=BR.find(x=>x.id===b);return`${B.e} ${B.t[k].ad}`},()=>winTechDetail(b,k),380)}
function winTechDetail(b,k){const B=BR.find(x=>x.id===b),t=B.t[k],st=techState(b,k),e=economy().net.bilgi;
 let h=`<div class=tdh><span style="font-size:32px">${B.e}</span><div><b style="font-size:17px">${t.ad}</b><div class=muted>${B.ad} dalı · Kademe ${ROM[k+1]}</div></div></div>
 <div class=prog>${[0,1,2,3].map(q=>`<i class="${S.tech[b]>q?'d':q===k?'c':''}"></i>`).join('')}</div>
 <h4>Etkisi</h4><p style="margin:0">${t.d}</p>
 <h4>Dalın amacı</h4><p class=muted style="margin:0">${B.d}</p>
 <h4>Gereksinim</h4><p style="margin:0">${k?`${S.tech[b]>=k?'<span class=ok>✓</span>':'<span class=bad>✗</span>'} <a href="#" class=lnk onclick="openTechWin('${b}',${k-1});return false">${B.t[k-1].ad}</a> (Kademe ${ROM[k]})`:'Yok. Dalın ilk kademesi.'}</p>
 <h4>Açtığı</h4><p style="margin:0">${k<3?`<a href="#" class=lnk onclick="openTechWin('${b}',${k+1});return false">${B.t[k+1].ad}</a> (Kademe ${ROM[k+2]})`:'Dalın son kademesi.'}</p>
 <div class=kv style="margin-top:12px"><span>Maliyet</span><b>📜 ${TCOST[k]}</b></div><div class=kv><span>Mevcut bilgi</span><span>${fl(S.res.bilgi)} (${sgn(e)}/tur)</span></div>`;
 if(st==='done')h+='<button class="btn wide" disabled>✓ Araştırıldı</button>';
 else if(st==='lock')h+=`<button class="btn wide" disabled>🔒 Önce ${B.t[S.tech[b]].ad} araştırılmalı</button>`;
 else{const ok=S.res.bilgi>=TCOST[k],eta=e>0?Math.ceil((TCOST[k]-S.res.bilgi)/e):null;
  h+=`<button class="btn wide ${ok?'primary':''}" ${ok?'':'disabled'} onclick="research('${b}',${k})">${ok?'📜 Araştır':`Yetersiz bilgi${eta?` · ~${eta} tur`:''}`}</button>`}
 return h}

 <h4>Bölgelere göre üretim</h4><div style="overflow:auto"><table><tr><th>Bölge</th>${RES.map(r=>`<th>${r.e}</th>`).join('')}<th>Alan</th></tr>`;
 o.forEach(i=>{const y=production(i);h+=`<tr><td><a href="#" class=lnk onclick="openRegionWin(${i},'alan');return false">${MAP.regions[i].name}${S.regions[i].capital?' ★':''}</a></td>${RES.map(r=>`<td>${y[r.k]?r1(y[r.k]):'<span class=muted>·</span>'}</td>`).join('')}<td>${S.regions[i].fields.length}/${slots(i)}</td></tr>`});
 h+='</table></div><h4>Tüm kaynak alanları</h4>';
 let any=false;o.forEach(i=>S.regions[i].fields.forEach((f,k)=>{any=true;const F=FIELD[f.t];let act;
  if(f.lv>=M.maxField)act=`<small class=muted>${f.lv>=5?'Azami':'🔒 '+techName(...fieldReq(f.lv+1))}</small>`;else{const c=upFieldCost(f);act=`<button class="btn sm" ${canPay(c)?'':'disabled'} onclick="upgradeField(${i},${k})">⬆ ${costTxt(c)}</button>`}

 if(!any)h+='<p class=muted>Henüz kaynak alanın yok.</p>';

function winArmy(){const e=economy(),M=mil(),mm=moraleMult(S.morale),o=own();const armed=fl(S.res.demir/IRON),siegeLv=fl(S.res.odun/(WOOD*M.woodMult));
 const turnsT=e.net.tahil<0?fl(S.res.tahil/-e.net.tahil):null,turnsA=e.net.altin<0?fl(S.res.altin/-e.net.altin):null;
 const totAuto=o.reduce((s,i)=>s+(S.regions[i].auto?autoRate(i):0),0);
 const pow=[0,1,2,3].map(f=>({f,reg:S.regions.filter(r=>r.owner===f).length,tr:S.regions.filter(r=>r.owner===f).reduce((s,r)=>s+r.troops,0)}));const maxT=Math.max(1,...pow.map(p=>p.tr));

 `+unitTable(o)+`<h4>Askeri kuruluşlar</h4>`;
 const ms=o.filter(i=>S.regions[i].mil);
 h+=ms.length?`<table><tr><th>Bölge</th><th>Kuruluş</th><th>Üretim</th><th>Oto</th><th></th></tr>${ms.map(i=>{const r=S.regions[i];return`<tr><td>${MAP.regions[i].name}</td><td>${MIL[r.mil].ad} <span class=muted>${ROM[r.mil]}</span></td><td>+${autoRate(i)}</td><td><input type=checkbox ${r.auto?'checked':''} onchange="toggleAuto(${i})"></td><td><button class="btn sm" onclick="openRegionWin(${i},'ask')">Yönet</button></td></tr>`}).join('')}</table>`:'<p class=muted>Hiç askeri kuruluşun yok.</p>';
 h+=`<p class=muted style="font-size:12px">Yeni bir bölgede Karakol kurmak için o bölgenin penceresindeki Askeri Kuruluş sekmesini kullan.</p>
 <h4>⚔️ Saldırı</h4><div class=kv><span>Teknoloji bonusu</span><span>+${pct(M.atk)}</span></div><div class=kv><span>⚒️ Demir donanımı</span><span>+${pct(M.equip)} (stok ${armed} askeri donatır)</span></div>
 <div class=kv><span>🌊 Nehir geçişi</span><span>×${M.river} (köprüden cezasız)</span></div><div class=kv><span>Tam donanımlı çarpan</span><b>×${((1+M.atk+M.equip)*mm).toFixed(2)}</b></div>
 <h4>🛡️ Savunma</h4><div class=kv><span>Savunma teknolojisi</span><span>+${pct(M.def)}</span></div><div class=kv><span>🧱 Sur seviyesi başı</span><span>+${pct(M.fortPer)} (azami ${M.maxFort})</span></div><div class=kv><span>Savunmada kayıp azaltma</span><span>${pct(1-M.defLoss)}</span></div>
 <h4>🪵 Kuşatma</h4><div class=kv><span>Kuşatma etkinliği</span><span>${pct(M.siege)}</span></div><div class=kv><span>Odun stoku</span><span>${siegeLv} sur seviyesine yeter</span></div>
 <h4>🌾 İkmal</h4><div class=kv><span>Tahıl: üretim / ordu gideri</span><span>${sgn(e.gross.tahil)} / -${r1(e.up.tahil)}</span></div><div class=kv><span>Altın: üretim / maaş</span><span>${sgn(e.gross.altin)} / -${r1(e.up.altin)}</span></div>
 ${turnsT!=null?`<p class=bad>Tahıl ${turnsT} tur sonra bitecek, sonra açlık başlar!</p>`:''}${turnsA!=null?`<p class=bad>Hazine ${turnsA} tur sonra boşalacak!</p>`:''}
 <h4>👁️ İstihbarat & komuta</h4><div class=kv><span>Görüş</span><span>${M.spy?'Kesin bilgi':M.sight+' bölge uzağa kadar tahmini'}</span></div><div class=kv><span>Hareket</span><span>${M.roads?'Yol ağı: tüm kendi toprakların':'Sadece komşu bölgeler'}</span></div><div class=kv><span>Zaferde kayıp azaltma</span><span>${pct(1-M.lossMult*M.conqLoss)}</span></div>
 <h4>Güç dengesi</h4>${pow.map(p=>`<div class=kv><span><span class=dot style="background:${rgb(FAC[p.f].col)}"></span> ${FAC[p.f].ad}</span><span>${p.reg} bölge · ${p.f===0||M.spy?p.tr:'?'} asker</span></div>${p.f===0||M.spy?`<div class=bar><i style="width:${p.tr/maxT*100}%;background:${rgb(FAC[p.f].col)}"></i></div>`:''}`).join('')}`;

 return`<h4>Birlik türleri</h4><table><tr><th>Birlik</th><th>⚔</th><th>🛡</th><th>Puan</th><th>Bakım</th><th>Açan kuruluş</th><th>Sende</th></tr>${UK.map(k=>{const U=UNITS[k];return`<tr><td title="${U.d}">${U.e} ${U.ad}</td><td>${U.atk}</td><td>${U.def}</td><td>${U.w}</td><td>×${U.up}</td><td>${MIL[U.mil].ad}</td><td><b>${tot[k]}</b></td></tr>`}).join('')}</table>
 <p class=muted style="font-size:12px;margin:6px 0 0">🐎 Süvari ova/vadide +%30, dağ/ormanda -%30 saldırır. 🪨 Her kuşatma takımı sur bonusunun %8'ini kırar (azami %60). 🏹 Okçular savunmada ×1,6 güçlüdür.</p>`}
function openLog(){openWin('kayit',()=>'📖 Kayıt',()=>'<div class=log>'+S.log.slice().reverse().map(l=>`<p class=${l.c}><span class=t>Yıl ${l.t}</span>${l.m}</p>`).join('')+'</div>',420)}

 +`<span class=r title="Moral: tüm saldırı ve savunma gücünü çarpar (×${moraleMult(S.morale).toFixed(2)}).">🔥 <b class="${S.morale<50?'neg':''}">${Math.round(S.morale)}</b></span><span class=r title="Toplam asker">🛡 <b>${e.troops}</b></span>`;

 <div class=stats><div><span>Asker</span><b>${vt.txt}</b>${mine?`<small>hazır: ${r.ready}</small>`:''}</div><div><span>Sur</span><b>${r.fort?'♜'.repeat(r.fort):'—'}</b></div><div><span>Savunma</span><b>×${defMult(i,0).toFixed(2)}</b></div></div>

 ${mine?`<div class=kv style="margin-top:8px"><span>Kaynak alanları</span><span>${r.fields.map(f=>FIELD[f.t].e+f.lv).join(' ')||'—'} (${r.fields.length}/${slots(i)})</span></div><div class=kv><span>Askeri kuruluş</span><span>${r.mil?`${MIL[r.mil].ad} · +${autoRate(i)}/tur`:'yok'}</span></div>`:''}
 <button class="btn wide ${mine?'primary':''}" onclick="openRegionWin(${i})">${mine?'🏛 Bölgeyi Yönet':'🔍 Ayrıntılar'}</button>`;

 $('#side').innerHTML=h}
function refresh(){computeVision();draw();renderHeader();renderSide();renderAllWins();save()}

function showHelp(){modal(`<h3>⚔ Fetih: Nasıl oynanır?</h3>
<p><b>Kuruluş:</b> Oyun başında ${FUND} akçelik hazineyle başkentine 1–2 <b>kaynak alanı</b> satın alırsın: tarla, kereste, taş ocağı, demir madeni, pazar ya da medrese.</p>
<p><b>Ekonomi:</b> Alanları seviye atlatarak üretimi artır, yeni bölgelerde yeni alanlar kur. Verim araziye göre değişir.</p>
<p><b>Ordu:</b> Askeri kuruluşlar her tur otomatik asker yetiştirir: Karakol → Kışla → Talimhane → Ordugâh → Harbiye. Üst kademeler <b>Askeri Üretim</b> teknolojileriyle açılır.</p>
<p><b>Birlikler:</b> 🗡️ Piyade, 🏹 Okçu (savunma), 🐎 Süvari (ovada hücum), 🪨 Kuşatma Takımı (sur kırar) ve ⚔️ Yeniçeri (seçkin). Her kuruluş kademesi yeni bir tür açar. Saldırırken hangi birlikleri göndereceğini seçersin.</p>
<p><b>Teknoloji:</b> 6 dal ve her dalda 4 kademe var. Bir kademeyi açınca sonraki aktif olur. Her teknolojinin kendi penceresi var.</p>
<p><b>Harita:</b> 🏔️ Sıradağlar geçilmezdir, geçitler stratejik darboğazlardır. 🌊 Nehirden saldırı cezalıdır, 🌉 köprüden geçiş cezasızdır. Liman, kavşak, harabe gibi özel bölgeler bonus verir.</p>
<p><b>Fetih:</b> Kendi bölgeni seç, sonra komşu bölgeye tıkla. Çift tıklarsan bölge yönetim penceresi açılır. İlk ${GRACE} yıl rakipler sana saldırmaz.</p>
<p class=muted style="font-size:12px">Pencereleri başlıklarından sürükleyebilirsin. Oyun tarayıcıya otomatik kaydedilir.</p>
<div class=row><button class="btn primary" onclick="closeModal()">Başla</button></div>`)}
function askNew(){modal(`<h3>Yeni oyun?</h3><p>Mevcut oyunun silinir ve yeni bir harita oluşturulur.</p><div class=row><button class=btn onclick="closeModal()">Vazgeç</button><button class="btn danger" onclick="startNew()">Yeni Oyun</button></div>`)}
function startNew(){closeModal();closeAllWins();newGame(fl(Math.random()*1e9));fit();refresh();openSetup();showHelp()}
window.addEventListener('resize',fit);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalBg').style.display==='flex'&&!S.over)closeModal();else{ui.sel=null;refresh()}}});
if(!load()){newGame(fl(Math.random()*1e9));fit();refresh();openSetup();showHelp()}else{fit();refresh();if(S.phase==='kurulus')openSetup();if(S.over)afterModal()}
</script>
</body>
</html>
