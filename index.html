<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fetih</title>
<style>
:root{--bg:#16120e;--panel:#221c16;--panel2:#2d251d;--line:#4a3d2e;--text:#efe6d6;--muted:#a99b84;--accent:#d9a441;--good:#86b86f;--bad:#e0635c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.title{font:800 17px Georgia,serif;color:var(--accent);letter-spacing:1px}
.res{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.r{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:help;white-space:nowrap}
.r b{font-variant-numeric:tabular-nums}
.r .inc{font-size:11px;margin-left:3px}
.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}
main{flex:1;display:flex;min-height:0}
#mapWrap{flex:1;position:relative;min-width:0;min-height:0;background:#0d1a26;overflow:hidden;touch-action:none}
#view{display:block;cursor:grab}
#view.drag{cursor:grabbing}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(34,28,22,.9);color:var(--text);font-size:17px;cursor:pointer}
.mapctl button:hover{border-color:var(--accent)}
.hint{position:absolute;left:10px;bottom:10px;background:rgba(20,16,12,.8);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--muted);pointer-events:none}
#tip{position:absolute;pointer-events:none;background:rgba(20,16,12,.95);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;display:none;max-width:320px;z-index:5}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1a26;font:600 18px Georgia,serif;color:var(--accent);z-index:6}
aside{width:420px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 2px;cursor:pointer;font:inherit;font-size:13px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);background:var(--panel)}
#panel{flex:1;overflow:auto;padding:12px 14px}
.foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}
.btn.danger{background:#7a2a24;border-color:#a8433b}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.big{flex:1;padding:10px;font-size:15px}
.btn.wide{width:100%;margin-top:10px}
h2{margin:0;font:700 19px Georgia,serif}h3{margin:0 0 10px;font-family:Georgia,serif}h4{margin:16px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.rh{display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.4);vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats>div{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stats span{display:block;font-size:11px;color:var(--muted)}
.stats b{font-size:16px}.stats small{display:block;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--panel2);border-radius:4px;padding:2px 6px;font-size:12px}
.feat{background:#3a2f1f;border:1px solid #6b5530;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:12.5px}
.warn{background:#3d1f1b;border:1px solid #7a3a30;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:12.5px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #3a3025}
.item small{display:block;color:var(--muted);font-size:11.5px}
.ok{color:var(--good);font-weight:700}
.rec{display:flex;align-items:center;gap:8px;margin-top:6px}
.rec input[type=range]{flex:1}
input[type=range],input[type=checkbox]{accent-color:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit;font-size:12.5px}
.bar{height:8px;background:#3a3025;border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #3a3025;font-size:13px}
.kv span:first-child{color:var(--muted)}
.log p{margin:0 0 6px;font-size:13px}
.log .t{color:var(--muted);font-size:11px;margin-right:4px}
.good{color:var(--good)}.bad{color:var(--bad)}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.sub{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}
.sub button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:4px 11px;cursor:pointer;font:inherit;font-size:12.5px}
.sub button.on{background:var(--accent);color:#1b1712;border-color:var(--accent);font-weight:700}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.card small{font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.fundbox{background:#3a2f1f;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:15px}
.stars{color:var(--accent);letter-spacing:1px}
.step{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--panel2)}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step.done{opacity:.65}.step.lock{opacity:.5}
.step .info{flex:1}.step small{display:block;color:var(--muted);font-size:11.5px}
.lv{font-weight:800;width:28px;height:28px;border-radius:50%;background:#3f3324;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
.step.done .lv{background:#3d5530;color:#cfe8bf}
.tree{display:grid;grid-template-columns:92px repeat(4,1fr);gap:6px 12px}
.tree .th{font-size:10.5px;color:var(--muted);text-align:center;text-transform:uppercase}
.tree .brn{font-weight:700;font-size:12px;display:flex;align-items:center}
.node{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:11.5px;cursor:pointer;background:var(--panel2);position:relative;font-weight:600;line-height:1.25}
.node small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.node:hover,.node.sel{border-color:var(--accent)}
.node.sel{box-shadow:0 0 0 2px var(--accent)}
.node.done{border-color:#5d7f48;background:#26301f}
.node.avail{border-color:#b98a35}
.node.lock{opacity:.5}
.node::before{content:'›';position:absolute;left:-10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.node.n0::before{content:none}
.tdet{margin-top:12px;border:1px solid var(--accent);border-radius:8px;padding:10px 12px;background:#2a2219}
.prog{display:flex;gap:4px;margin:10px 0}
.prog i{flex:1;height:6px;border-radius:3px;background:#3a3025}
.prog i.d{background:var(--good)}.prog i.c{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 5px;border-bottom:1px solid #3a3025;text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.urow{display:grid;grid-template-columns:130px 1fr 30px 34px;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.switch{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#modal.wide{width:min(680px,100%)}
#modal.wide:has(.wz){width:min(880px,100%)}
.row{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px}
.chance{font-size:28px;font-weight:800;text-align:center;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3a2f22;border:1px solid var(--accent);padding:8px 14px;border-radius:6px;display:none;z-index:1001}
#bars{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 16px));display:flex;flex-direction:column;gap:6px;z-index:1002;pointer-events:none}
.bar-n{pointer-events:auto;display:flex;align-items:flex-start;gap:8px;background:#3a2f22;border:1px solid var(--accent);border-radius:8px;padding:7px 8px 7px 12px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.bar-n>span{flex:1;min-width:0;overflow-wrap:anywhere}.bar-n.err{background:#3d1f1b;border-color:#a8433b}.bar-n .btn.sm{flex:none}.bar-n span .btn{margin-left:4px}
.savebox{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ver{font-size:11px;color:var(--muted);text-align:right;margin-top:8px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:8px;background:#3a3025;white-space:nowrap}.tag.bad{color:var(--bad)}.tag.good{color:var(--good)}
.dynbox,.mutbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px}
.rivals{display:flex;gap:5px;flex-wrap:wrap;margin:-2px 0 4px}
.wz .btn{min-height:40px}.wz .btn.wide{display:block;text-align:left;margin-top:8px}
.wz-steps{display:flex;gap:3px;margin:0 0 10px;font-size:11.5px}.wz-steps span{flex:1;text-align:center;padding:4px 1px;border-bottom:3px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz-steps span.on{border-color:var(--accent);color:var(--text);font-weight:700}.wz-steps span.done{border-color:#7d6a3e}
.wzc{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}.pick:hover{border-color:#8a7140}.pick.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:#33291d}.pick.lockd{opacity:.55;cursor:default}
.pick small{line-height:1.3}.pick .det{display:flex;flex-direction:column;gap:4px}.mobdet{display:none}
@media (max-width:520px){.wzc2{grid-template-columns:1fr 1fr;gap:6px}.wzc2 .pick{padding:7px 8px}.wzc2 .pick .det{display:none}.wz .cards{grid-template-columns:1fr 1fr;gap:6px}.wz .card .ask{display:none}.mobdet{display:block}#modal{padding:14px}.wz-nav{bottom:-14px}}
.wz-nav{position:sticky;bottom:-18px;background:var(--panel);padding:10px 0 4px;margin:12px 0 -4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);z-index:2}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn{flex:1 1 70px;line-height:1.2}
.evo{display:flex;flex-direction:column;gap:8px}.evo .btn{min-height:44px;text-align:left;width:100%;line-height:1.3}.evo .btn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.evo .btn b{color:var(--accent)}
.stones{display:flex;gap:4px;margin:2px 0 6px}.stones span{flex:1;text-align:center;color:var(--muted);font-size:17px;line-height:1.1}.stones span.d{color:var(--good)}.stones span.c{color:var(--accent)}.stones small{display:block;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.goal.on{border-color:var(--accent)}
.tabs .sm{display:none}
/* 1c: bitiş ekranı ve miras */
.end-h{display:flex;gap:12px;align-items:flex-start}.end-h canvas{width:150px;height:auto;border-radius:6px;border:1px solid var(--line);flex:none;background:#0d1a26}.end-h h3{margin:0 0 4px}.end-h p{margin:0 0 4px}
.end-sc{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:12px 0 6px;padding:8px 12px;border:1px solid var(--accent);border-radius:8px;background:#2a2219}#endSc{font:800 34px Georgia,serif;color:var(--accent);display:block;line-height:1.1;font-variant-numeric:tabular-nums}.end-rk{text-align:right;font-size:13px}.tag.rec{font-size:13px;padding:3px 9px;font-weight:800}
.end-dg{font-size:13px;margin:6px 0;background:#3d1f1b;border:1px solid #7a3a30;border-radius:6px;padding:7px 9px}
.end-rw{display:flex;flex-direction:column;gap:6px;margin:8px 0}.beat{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;font-size:13px;padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}.beat.on{opacity:1;transform:none}.beat.big{font-size:15.5px;border-color:var(--accent);background:#3a2f1f;box-shadow:0 0 0 1px var(--accent) inset}.beat.mp b{color:var(--accent)}.beat .bar{margin-top:5px}
@media (prefers-reduced-motion:reduce){.beat{transition:none;opacity:1;transform:none}}
.end .btn{min-height:40px}.end-b{display:flex;flex-direction:column;gap:6px;margin-top:10px}.end-b .btn{min-height:40px}.end-main{font-size:16px;padding:10px 12px;text-align:center}.end-main small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.btn.hot{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset}
.end-d{margin-top:10px;font-size:13px}.end-d summary{cursor:pointer;padding:9px 0;color:var(--muted);min-height:40px}.end-d canvas{width:100%;height:auto;margin-top:8px;background:#1b1612;border-radius:6px}.end-d p{margin:6px 0}
.achs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.achs .card.got{border-color:#5d7f48;background:#26301f}.mir .item{min-height:44px}.mir .btn{min-height:40px}.mir .item>span{flex:none}.mir .item .btn{white-space:nowrap}
@media (max-width:520px){.end-h canvas{width:96px}#endSc{font-size:28px}.end-h h3{font-size:16px}}
.inp{width:100%;min-height:40px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
@media (max-width:520px){.tabs button{font-size:12px;padding:9px 1px}.tabs .lg{display:none}.tabs .sm{display:inline}header .title{display:none}header{padding:5px 8px}.r{padding:2px 6px}.r .lg{display:none}.res{gap:4px}}
@media (max-width:860px){main{flex-direction:column}aside{width:auto;height:46vh;border-left:0;border-top:1px solid var(--line)}.tree{grid-template-columns:70px repeat(4,minmax(70px,1fr))}}
</style>

<body>
<header>
  <span class="title">⚔ FETİH</span>
  <div class="res" id="res"></div>
</header>
<main>
  <div id="mapWrap">
    <canvas id="view"></canvas>
    <div class="mapctl"><button onclick="zoomBy(1.3)" title="Yakınlaştır">＋</button><button onclick="zoomBy(1/1.3)" title="Uzaklaştır">－</button><button onclick="fitCam()" title="Tüm harita">⤢</button><button onclick="focusSel()" title="Seçili bölgeye git">◎</button></div>
    <div class="hint">Sol tık: seç · Sağ tık: saldır / taşı · Sürükle: kaydır · Tekerlek: yakınlaştır</div>
    <div id="tip"></div>
    <div id="loading">Harita çiziliyor…</div>
  </div>
  <aside>
    <nav class="tabs" id="tabs">
      <button data-t="bolge">🏰 Bölge</button><button data-t="eko">💰 <span class=lg>Ekonomi</span><span class=sm>Eko</span></button><button data-t="ordu">⚔ Ordu</button><button data-t="hedef">🏆 Hedef</button><button data-t="tek">📜 <span class=lg>Teknoloji</span><span class=sm>Tekno</span></button><button data-t="kayit">📖 Kayıt</button>
    </nav>
    <div id="panel"></div>
    <div class="foot">
      <button class="btn" onclick="askNew()" title="Yeni oyun">↻</button>
      <button class="btn" onclick="showHelp()" title="Nasıl oynanır">?</button>
      <button class="btn primary big" id="endBtn" onclick="endTurn()">Turu Bitir ▶</button>
    </div>
  </aside>
</main>
<div id="modalBg"><div id="modal"></div></div>
<div id="toast"></div>
<div id="bars"></div>

const $=s=>document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(rng){const P=256,g=new Float32Array(P*P);for(let i=0;i<g.length;i++)g[i]=rng();const sm=t=>t*t*(3-2*t);
 return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,i0=((xi%P)+P)%P,j0=((yi%P)+P)%P,i1=(i0+1)%P,j1=(j0+1)%P;
 const a=g[j0*P+i0],b=g[j0*P+i1],c=g[j1*P+i0],d=g[j1*P+i1],u=sm(xf),v=sm(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}}
function fbm(n,x,y,o){let s=0,a=.5,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f,y*f);t+=a;a*=.5;f*=2}return s/t}
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const pct=v=>Math.round(v*100)+'%';
const r1=v=>Math.round(v*10)/10;
const sgn=v=>{v=r1(v);return(v>=0?'+':'')+v};
const fl=Math.floor;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function costTxt(c){return Object.entries(c).filter(([,v])=>v).map(([k,v])=>RM[k].e+r1(v)).join(' ')}
function canPay(c){return Object.entries(c).every(([k,v])=>S.res[k]>=v-1e-9)}
function pay(c){for(const[k,v]of Object.entries(c))S.res[k]-=v}
function scaleC(c,m){const o={};for(const k in c)o[k]=Math.round(c[k]*m*10)/10;return o}
function addY(t,y,m=1){for(const[k,v]of Object.entries(y))t[k]=(t[k]||0)+v*m}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}
function segX(ax,ay,bx,by,cx,cy,dx,dy){const ex=bx-ax,ey=by-ay,fx=dx-cx,fy=dy-cy,den=ex*fy-ey*fx;if(Math.abs(den)<1e-9)return null;
 const t=((cx-ax)*fy-(cy-ay)*fx)/den,u=((cx-ax)*ey-(cy-ay)*ex)/den;return t>=0&&t<=1&&u>=0&&u<=1?[ax+t*ex,ay+t*ey]:null}
const pkey=(a,b)=>a<b?a*1000+b:b*1000+a;
// Oyun içi belirlenimci RNG: mulberry32, durumu kayıtta (S.rs). Savaş, AI ve olaylar bunu kullanır; UI rastgeleliği Math.random'da kalır.
function rnd(){let t=(S.rs=(S.rs+0x6D2B79F5)|0);t=Math.imul(t^t>>>15,1|t);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

  if(k==='nBase'||k==='aiGain')o[k]*=v;else if(k==='nEvery')o[k]=Math.min(o[k],v);else if(k==='coalAt')o[k]=o[k]==null?v:Math.min(o[k],v);else o[k]=v}}return o}

function normCfg(c){c=Object.assign({},CFG_KLASIK,c||{});if(!DYN[c.dyn])c.dyn='klasik';if(!MAPTYPES[c.map])c.map='kita';if(!SIZES[c.size])c.size='orta';if(!DIFFS[c.diff])c.diff='cirak';
 c.muts=[...new Set((c.muts||[]).filter(m=>MUTS[m]))].slice(0,2);if(mutBanned(c.muts,c.diff))c.muts=c.muts.slice(0,1);c.dice=!!c.dice&&c.muts.length>0;
 // 1c: günlük (tarih anahtarı), antrenman, rövanş, başlangıç bonusları (günlükte kapalı), hedef başarım
 c.daily=typeof c.daily==='string'&&/^\d{4}-\d\d-\d\d$/.test(c.daily)?c.daily:null;c.train=!!c.train;c.rematch=!!c.rematch;c.bonus=c.daily?[]:[...new Set((Array.isArray(c.bonus)?c.bonus:[]).filter(b=>BONUS[b]))].slice(0,2);c.target=ACHM[c.target]?c.target:null;
 const D=DIFFS[c.diff],Zs=SIZES[c.size],fx=cfgFx(c),St=startOf(c);
 c.mutX=+clamp(c.muts.reduce((m,k)=>m*MUTS[k].x,1)*(c.dice?1.1:1),.8,2).toFixed(3);
 c.fund=Math.max(0,St.fund+D.fund-260);c.grace=Math.max(3,(fx.grace??12)+D.grace-12);c.ais=Array.from({length:Zs.nAI},(_,k)=>k+1);
 c.neutral=+(D.neutral*fx.nBase*Zs.nBase).toFixed(3);c.coalAt=fx.coalAt??D.coalAt;
 // 1b: ferman (beyan edilen zafer yolu); ev/alt: olaylar ve alternatif zaferler (yalnız testte kapatılır); pers: bütün rakiplere tek kişilik (test)
 c.ferman=VIC[c.ferman]?c.ferman:null;c.ev=c.ev!==false;c.alt=c.alt!==false;if(!AIPERS[c.pers])delete c.pers;return c}

function mapParams(c){c=c||{};const T=MAPTYPES[c.map]||MAPTYPES.kita,Zs=SIZES[c.size]||SIZES.orta,P=Object.assign({},T,{feat:Object.assign({},T.feat),gecit:T.gecit.slice()});
 if(Zs.mult!==1){P.sites=Math.round(T.sites*Zs.mult);P.minD=Math.round(Zs.minD*T.minD/98);for(const k in P.feat)P.feat[k]=Math.max(1,Math.round(P.feat[k]*Zs.mult));P.maden=Math.round(T.maden*Zs.mult);P.gecit[1]=Math.round(T.gecit[1]*Zs.mult);P.rivers=Math.round(T.rivers*Math.sqrt(Zs.mult))}

 if(!(ra>rd))return defeat(0,b);const fr=winFr(0,b),SV=scaleU(A,fr);if(sumU(SV)<1)SV[UK.find(k=>A[k])]=1;addU(F,SV,false);
 const st=lootStore(to),got={};for(const k in st){got[k]=st[k]*.4;S.res[k]+=got[k]}
 const kill=takeProp(T.u,Math.ceil(T.troops*.25));remU(T,kill,true);T.raid=S.turn+3;if(S.stats)S.stats.yagmaN++;S.morale=Math.min(mil().maxMorale,S.morale+2);
 return{win:true,raid:true,sent:n,surv:sumU(SV),lost:n-sumU(SV),dLost:sumU(kill),got}}
function conquer(i,o,comp,fr){
 const r=S.regions[i],old=r.owner,g=MAP.regions[i],store=o===0?lootStore(i):null,wasCap=r.capital;let loot=null;r.owner=o;r.u=Object.assign(Z(),comp);r.rd=Z();sync(r);r.fort=Math.max(0,r.fort-1);r.pop*=o===0?mil().conqPop:.7;r.raid=0;
 if(r.mil>1)r.mil--;r.fields.forEach(f=>{if(f.lv>1)f.lv--});
 if(o===0){r.auto=true;const rate=lootRate(fr==null?.7:fr);loot={store,rate,got:{},lost:{}};for(const k in store){loot.got[k]=store[k]*rate;loot.lost[k]=store[k]-loot.got[k];S.res[k]+=loot.got[k]}}
 if(old===0)S.morale=Math.max(0,S.morale-6);
 if(r.capital){r.capital=false;if(old!==NEUTRAL){const rest=S.regions.map((x,k)=>k).filter(k=>S.regions[k].owner===old);
  if(rest.length){const c=rest.sort((a,b)=>S.regions[b].troops-S.regions[a].troops)[0];S.regions[c].capital=true;
   if(old===0){S.morale=Math.max(0,S.morale-20);log(`Başkentin ${g.name} düştü! Yeni başkent: ${MAP.regions[c].name}. Moral -20.`,'bad')}
   else log(`${facName(old)} başkenti ${g.name}'i kaybetti; yeni başkent ${MAP.regions[c].name}.`)}}}
 if(old>0&&old<NEUTRAL&&!S.regions.some(x=>x.owner===old))log(`${facName(old)} yıkıldı!`,'good');
 if(wasCap&&S.stats)capFall(i,old,o);
 if(isAI(old)&&S.ai&&S.ai[old])S.ai[old].lost=(S.ai[old].lost||0)+1;
 if(old===0&&S.ai)for(const f of S.cfg.ais)if(isVas(f)&&g.adj.some(j=>S.regions[j].owner===f))S.ai[f].vlost=(S.ai[f].vlost||0)+1;
 return loot}
// Başkent düştü: Büyük Eser geriler, koalisyon üyesi çekilir ("Kılıç kırıldı"), rakibin eser yarışı sıfırlanır
function capFall(i,old,o){const W=S.wonder,C=S.coal,A=S.aiW;
 if(old===0){S.stats.capLost++;if(W.stage||W.build){const b=W.stage;W.stage=Math.max(0,W.stage-VIC.medeniyet.capLoss);W.build=0;log(`📜 Başkent düştü: Büyük Eser ${b} → ${W.stage} aşamaya geriledi.`,'bad')}}
 if(!isAI(old))return;
 if(C&&C.on&&C.mem.includes(old)){C.mem=C.mem.filter(x=>x!==old);C.out.push(old);if(o===0)S.stats.coalBroken++;
  log(`🗡 Kılıç kırıldı: ${facName(old)} başkentini kaybetti ve koalisyondan çekildi.`,'good');if(!C.mem.length){C.on=false;C.cd=S.turn+10;log('🤝 Koalisyon dağıldı: son üye de çekildi.','good')}}
 if(A.f===old&&(A.stage||S.medClosed===old)){log(`📜 ${facName(old)} başkentini kaybetti: Büyük Eseri yıkıldı.`,'good');A.stage=0;A.next=S.turn+VIC.medeniyet.aiEvery;if(S.medClosed===old){S.medClosed=null;log('📜 Medeniyet yolu yeniden açıldı.','good')}}}

// ======================= EKONOMİ & NÜFUS =======================
function maxPop(i){const g=MAP.regions[i],r=S.regions[i];let m=TER[g.terrain].pop+(r.capital?25:0)+(g.feat==='liman'||g.feat==='kavsak'?10:0)+(g.feat==='verimli'?15:0);for(const f of r.fields)if(f.t==='tarla')m+=6*f.lv;return m}
const popFloor=i=>Math.ceil(maxPop(i)*.25);
const draftable=i=>Math.max(0,fl(S.regions[i].pop-popFloor(i)));
const workforce=i=>clamp(S.regions[i].pop/(maxPop(i)*.5),.4,1);
function slots(i){const g=MAP.regions[i],r=S.regions[i];return TER[g.terrain].slots+(r.capital?1:0)+(g.feat==='verimli'?1:0)}
function fieldEff(i,t){const g=MAP.regions[i],F=FIELD[t];let e=F.eff[g.terrain]||1;if(g.feat==='verimli'&&(t==='tarla'||t==='pazar'))e*=1.5;if(g.feat==='damar'&&(t==='demir'||t==='tasocagi'))e*=1.6;return e}
function fieldOut(i,f,lv=f.lv){const F=FIELD[f.t],M=mil();let v=F.base*LVM[lv]*fieldEff(i,f.t)*M.fieldMult*(S.regions[i].owner===0?workforce(i):1);if(F.r==='tahil')v*=M.tarla;if(F.r==='altin')v*=M.altinMult;
 if(M.fieldBy[f.t])v*=M.fieldBy[f.t];if(M.fieldAll!==1)v*=M.fieldAll;if(M.resMult[F.r])v*=M.resMult[F.r];if(F.r==='tahil'&&S.buffs&&S.buffs.length&&S.regions[i].owner===0)v*=buffMul('tarla');return v}
function prodParts(i){const g=MAP.regions[i],r=S.regions[i],p=[],M=mil(),am=M.altinMult,rm=M.resMult,fy=r.owner===0&&g.feat&&M.featY[g.feat]||g.feat&&FEAT[g.feat].y;
 for(const[k,v]of Object.entries(TER[g.terrain].y))p.push([TER[g.terrain].ad,k,(k==='altin'?v*am:v)*(rm[k]||1)]);
 if(fy)for(const[k,v]of Object.entries(fy))p.push([FEAT[g.feat].ad,k,k==='altin'?v*am:v]);
 if(r.capital)for(const[k,v]of Object.entries({tahil:2,altin:3,demir:2,bilgi:3}))p.push(['★ Başkent',k,k==='altin'?v*am:v]);
 r.fields.forEach(f=>p.push([`${FIELD[f.t].e} ${FIELD[f.t].ad} Sv.${f.lv}`,FIELD[f.t].r,fieldOut(i,f)]));return p}
function production(i){const r=S.regions[i],y={},m=(r.raid>S.turn?.5:1)*(r.qt>S.turn?.5:1);prodParts(i).forEach(([,k,v])=>y[k]=(y[k]||0)+v*m);return y}
function economy(){const gross={tahil:0,odun:0,tas:0,demir:0,altin:0,bilgi:0};let troops=0,uw=0,pop=0,mpop=0;
 own().forEach(i=>{const r=S.regions[i];addY(gross,production(i));troops+=r.troops;pop+=r.pop;mpop+=maxPop(i);uw+=UK.reduce((s,k)=>s+r.u[k]*UNITS[k].up,0)});
 const M=mil(),up={tahil:uw*.15*M.upkeep*M.upTahil,altin:uw*M.upGoldRate*M.upkeep*M.upGold},net={};
 if(S.flags){const mc=S.flags.merc;if(mc&&mc.u>S.turn)up.altin+=3;for(const f of S.cfg.ais)if(isVas(f))gross.altin+=VIC.hegemonya.tribute(aiRegs(f))}for(const k in gross)net[k]=gross[k]-(up[k]||0);
 return{gross,up,net,troops,pop,mpop}}
// Ganimet: fethedilen bölgenin stoğu (üretim + garnizon sandığı). Yalnızca bir kısmı ele geçer, kalanı yangın ve yağmada zayi olur.
function lootStore(i,tr){const r=S.regions[i],g=MAP.regions[i],y=production(i),t=tr==null?r.troops:tr,s={};
 for(const k of['tahil','odun','tas','demir','altin'])s[k]=(y[k]||0)*8;
 s.tahil+=t*1.2;s.altin+=8+t*.9;s.demir+=t*.25;s.bilgi=8+(y.bilgi||0)*6+(g.feat==='harabe'?6:0);
 if(r.capital)for(const k in s)s[k]*=1.5;return s}
const lootRate=fr=>clamp(.3+.3*fr+mil().loot+(S.buffs&&hasBuff('bey')?.1:0),.25,mil().lootCap);
const lootLine=(st,rate)=>Object.entries(st).filter(([k,v])=>v*rate>=.5).map(([k,v])=>RM[k].e+Math.round(v*rate)).join(' ')||'—';
function lootHtml(L){if(!L)return'';const ks=Object.keys(L.store).filter(k=>L.store[k]>=.5);
 return`<h4>💰 Ganimet · bölge stokunun %${Math.round(L.rate*100)}'i ele geçti</h4><table><tr><th>Kaynak</th><th>Bölge stoku</th><th>Alınan</th><th>Zayi</th></tr>${ks.map(k=>`<tr><td>${RM[k].e} ${RM[k].ad}</td><td>${Math.round(L.store[k])}</td><td class=pos>+${Math.round(L.got[k])}</td><td class=neg>-${Math.round(L.lost[k])}</td></tr>`).join('')}</table><p class=muted style="font-size:12px;margin:6px 0 0">Kalan kısım savaşta yangın, yağma ve bozulmayla zayi oldu. Ne kadar az kayıp verirsen o kadar çok kurtarırsın.</p>`}
function popGrowth(i){const r=S.regions[i],mx=maxPop(i);return Math.max(0,Math.min(mx-r.pop,(mx-r.pop)*.08*(r.owner===0?mil().growth:1)+.5))}
const fieldCount=()=>own().reduce((s,i)=>s+S.regions[i].fields.length,0);
function newFieldCost(t){return scaleC(FIELD[t].cost,1+.2*fieldCount())}
function upFieldCost(f){return scaleC(FIELD[f.t].cost,Math.pow(f.lv+1,1.7))}
function fieldReq(lv){return lv<=2?null:lv===3?['eko',1]:lv===4?['eko',2]:['eko',4]}
function surCost(i){const lv=S.regions[i].fort+1,d=S.flags&&S.flags.bdisc||0;return{tas:Math.round(20*lv*mil().surDisc*(1-d)),odun:Math.round(10*(1-d))}}
const milCost=k=>S.flags&&S.flags.bdisc?scaleC(MIL[k].cost,1-S.flags.bdisc):MIL[k].cost;

function autoType(i){const r=S.regions[i],k=r.autoU;return UNITS[k]&&r.mil>=unitMil(k)?k:'piy'}
function recLeft(i){const r=S.regions[i];return r.mil?MIL[r.mil].lim-r.rec:0}
function maxAfford(c){return fl(Math.min(...Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>S.res[k]/v)))}
function autoRate(i){const r=S.regions[i];return r.mil?fl(MIL[r.mil].auto*mil().autoMult/UNITS[autoType(i)].w):0}
function canRecruit(i,k){const U=UNITS[k];return Math.max(0,Math.min(fl(recLeft(i)/U.w),maxAfford(unitCost(i,k)),fl(draftable(i)/U.pop)))}

const fundCost=t=>{const fc=startOf(cfgOf()).fundCost;return fc&&fc[t]!=null?fc[t]:FIELD[t].fund};
function buyStart(t){const c=capIdx(),fc=fundCost(t);if(S.phase!=='kurulus'||S.fund<fc||S.regions[c].fields.length>=slots(c))return;S.fund-=fc;
 const lv=t==='tarla'&&(cfgOf().bonus||[]).includes('ciftci')&&!S.regions[c].fields.some(f=>f.t==='tarla')?2:1;S.regions[c].fields.push({t,lv});refresh()}
function unbuyStart(k){const c=capIdx(),f=S.regions[c].fields[k];if(S.phase!=='kurulus'||!f||f.gift)return;S.fund+=fundCost(f.t);S.regions[c].fields.splice(k,1);refresh()}

function autoSetup(){const c=capIdx(),W0={tarla:1.6,pazar:1.5,medrese:2};const pick=Object.keys(FIELD).map(k=>({k,v:fieldOut(c,{t:k,lv:1})*(W0[k]||1)})).sort((a,b)=>b.v-a.v);
 for(const p of pick){if(S.fund>=fundCost(p.k))buyStart(p.k)}if(!S.regions[c].fields.length&&S.fund>=0)S.regions[c].fields.push({t:pick[0].k,lv:1})}

 log(`Kuruluş tamamlandı: ${S.regions[c].fields.map(f=>FIELD[f.t].ad).join(', ')}.${S.fund?` Kalan ${S.fund} akçe hazineye aktarıldı.`:''} Barış dönemi: rakipler ${S.cfg.grace}. yıla kadar sana saldırmaz.`,'good');
 S.fund=0;S.phase='oyun';closeModal();ui.tab='bolge';ui.rtab='tesis';refresh()}
function buildField(i,t){const c=newFieldCost(t),r=S.regions[i];if(r.owner!==0||r.fields.length>=slots(i)||!canPay(c))return;pay(c);r.fields.push({t,lv:1});log(`${MAP.regions[i].name}: ${FIELD[t].ad} kuruldu.`);refresh()}
function upgradeField(i,k){const r=S.regions[i],f=r.fields[k];if(!f||r.owner!==0||f.lv>=mil().maxField)return;const c=upFieldCost(f);if(!canPay(c))return;pay(c);f.lv++;log(`${MAP.regions[i].name}: ${FIELD[f.t].ad} Sv.${f.lv} oldu.`);refresh()}
function upgradeMil(i){const r=S.regions[i],nx=r.mil+1;if(r.owner!==0||nx>5||S.tech.ure<MIL[nx].tech||!canPay(milCost(nx)))return;pay(milCost(nx));S.flags.bdisc=0;r.mil=nx;log(`${MAP.regions[i].name}: ${MIL[nx].ad} kuruldu (kademe ${nx}).`,'good');refresh()}

function buildSur(i){const r=S.regions[i],c=surCost(i);if(r.owner!==0||r.fort>=maxFort(i)||!canPay(c))return;pay(c);r.fort++;S.flags.bdisc=0;S.stats.surBuilt++;log(`${MAP.regions[i].name}: sur seviyesi ${r.fort}.`);refresh()}
function recruit(i,k,n){const r=S.regions[i],U=UNITS[k],c=unitCost(i,k);if(r.owner!==0||!r.mil||r.mil<unitMil(k))return;n=Math.min(n,canRecruit(i,k));if(n<1)return;
 for(const q in c)S.res[q]-=c[q]*n;addU(r,{[k]:n},false);r.rec+=n*U.w;r.pop-=n*U.pop;S.stats.recruited[k]+=n;log(`${MAP.regions[i].name}: ${n} ${U.ad} toplandı.`);refresh()}
function research(b,k){if(S.tech[b]!==k||S.res.bilgi<tcost(k))return;S.res.bilgi-=tcost(k);S.tech[b]++;if(S.flags.tdisc>S.turn)S.flags.tdisc=0;const B=BR.find(x=>x.id===b);
 log(`Teknoloji: ${B.t[k].ad} (${B.ad} ${ROM[k+1]}) geliştirildi.`,'good');if(k<3){ui.tsel=b+(k+1);toast(`🔓 ${B.t[k+1].ad} artık araştırılabilir`)}refresh()}
function canMove(from,to){if(from===to||S.regions[to].owner!==0||S.regions[from].owner!==0)return false;if(MAP.regions[from].adj.includes(to))return true;if(!mil().roads)return false;
 const seen=new Set([from]),q=[from];while(q.length){const c=q.shift();for(const j of MAP.regions[c].adj){if(seen.has(j)||S.regions[j].owner!==0)continue;if(j===to)return true;seen.add(j);q.push(j)}}return false}

 if(S.res.altin<0){S.res.altin=0;ok=false;S.morale-=8;ev.push({m:'Hazine boş! Maaşlar ödenemedi, moral -8.',c:'bad'})}
 const st=S.stats;st.famine+=famine?1:0;st.famineStreak=famine?st.famineStreak+1:0;
 let made=0,noPop=0;own().forEach(i=>{const r=S.regions[i];if(!r.mil||!r.auto)return;const ut=autoType(i),U=UNITS[ut],c=unitCost(i,ut),n=Math.min(autoRate(i),maxAfford(c),fl(draftable(i)/U.pop));
  if(n<autoRate(i)&&draftable(i)<U.pop*autoRate(i))noPop++;if(n>0){for(const k in c)S.res[k]-=c[k]*n;addU(r,{[ut]:n},false);r.pop-=n*U.pop;made+=n;st.recruited[ut]+=n}});
 if(made)log(`Askeri kuruluşlar ${made} birlik yetiştirdi.${noPop?` (${noPop} bölgede nüfus yetersiz)`:''}`);
 S.regions.forEach((r,i)=>{if(r.owner===BLOCK)return;if(r.owner===0&&famine)r.pop*=.95;else r.pop+=popGrowth(i)});
 const mabet=own().filter(i=>MAP.regions[i].feat==='mabet').length,gecit=M.gecitMorale?own().filter(i=>MAP.regions[i].feat==='gecit').length*M.gecitMorale:0;
 if(ok)S.morale=Math.min(M.maxMorale,S.morale+M.moraleRec+mabet*2+gecit);S.morale=Math.max(0,S.morale);
 const rg=S.buffs.find(b=>b.k==='regen');if(rg&&st.lastAtk!==S.turn){const v=Math.min(2,rg.v);S.morale=Math.min(M.maxMorale,S.morale+v);rg.v-=v;if(rg.v<=0)S.buffs=S.buffs.filter(b=>b!==rg)}
 updateCoal(ev);
 for(const f of S.cfg.ais)aiTurn(f,ev);
 S.regions.forEach(r=>{if(r.owner===NEUTRAL&&S.turn%fx.nEvery===0&&r.troops<r.base*fx.nCap)addU(r,{piy:1},false)});
 if(fx.plague&&S.turn>=fx.plague&&S.turn%fx.plague===0)plague(ev);
 tick1b(ev);
 S.turn++;S.regions.forEach(r=>{if(r.u){r.rd=Object.assign(Z(),r.u);sync(r)}r.rec=0});
 if(S.turn===S.cfg.grace)ev.push({m:'Barış dönemi sona erdi. Rakipler artık sana saldırabilir!',c:'bad'});
 for(const f in S.truce)if(S.truce[f]===S.turn)ev.push({m:`${facName(+f)} ile ateşkes sona erdi.`,c:''});
 S.buffs=S.buffs.filter(buffOn);rollEvent(ev);
 if(!S.flags.declN&&declOk()){S.flags.declN=S.turn;ev.push({m:'👑 Gücün rakiplerinin toplamının 1,5 katını aştı: Hedef sekmesinden zaferi ilan edip oyunu erken bitirebilirsin.',c:'good'})}
 ev.forEach(x=>log(x.m,x.c));checkEnd();refresh();saveNow();

 if(ev.length)modal(`<h3>📯 Yıl ${S.turn} raporu</h3>${ev.map(x=>`<p class=${x.c}>${x.m}</p>`).join('')}<div class=row><button class="btn primary" onclick="closeModal();showEvent()">Tamam${S.evQ.length?' ›':''}</button></div>`,'rep');else showEvent()}

function plaguePick(){const o=own();if(!o.length)return null;const c=o[fl(rnd()*o.length)],nb=MAP.regions[c].adj.filter(j=>S.regions[j].owner!==BLOCK),hit=[c];
 while(hit.length<4&&nb.length)hit.push(nb.splice(fl(rnd()*nb.length),1)[0]);return hit}
function plagueHit(hit){let dead=0;for(const i of hit){const r=S.regions[i];if(r.owner===BLOCK)continue;r.pop*=.7;const k=Math.ceil(r.troops*.1);if(k){remU(r,takeProp(r.u,k),false);dead+=k}}if(S.stats)S.stats.plagues++;return dead}
function plague(ev){const hit=plaguePick();if(!hit)return;const dead=plagueHit(hit);
 ev.push({m:`☠ Kara Veba ${MAP.regions[hit[0]].name} ve çevresinde! ${hit.length} bölgede nüfus %30 azaldı, ${dead} asker öldü.`,c:'bad'})}
const haracCost=f=>40+8*S.regions.filter(r=>r.owner===f).length;
function harac(f){if(!hasAb('harac')||S.phase!=='oyun'||S.over||(S.cd.harac||0)>S.turn||truceOn(f)||isVas(f)||!S.regions.some(r=>r.owner===f))return;const c=haracCost(f);if(S.res.altin<c){toast('Yetersiz altın.');return}
 if(aiPer(f).truce==='2x'&&totTroops()<2*aiTroops(f)){toast(`${facName(f)} haracı reddetti: Saldırgan rakip ancak ondan iki kat güçlüysen ateşkese yanaşır.`);return}
 S.res.altin-=c;setTruce(f,ABIL.harac.truce);S.cd.harac=S.turn+ABIL.harac.cd;S.stats.haracN++;log(`⚓ ${facName(f)} ile ${ABIL.harac.truce} yıllık ateşkes (${c} altın haraç).`,'good');refresh()}

 const t=S.regions[j].troops,m=MAP.regions[j].adj.reduce((s,q)=>s+(S.regions[q].owner===0?S.regions[q].troops:0),0);if(m>=2*Math.max(1,t)&&(!b||t<b.t))b={j,t}}return b}

<p><b>Hanedan ve kartlar:</b> Her hanedanın güçlü ve zayıf yanları, kural kartlarının etkileri <b>Ordu</b> sekmesinin sonunda; üst çubuktaki simgeye tıkla.</p>
<p><b>Zafer (🏆 Hedef sekmesi):</b> ⚔ <b>Fetih</b>: ${c.ais.length} rakibi yık ya da haritanın %${Math.round(SIZES[c.size].conq*100)}'ini al. 📜 <b>Medeniyet</b>: ${VIC.medeniyet.tech} teknoloji + başkentte 5 aşamalı Büyük Eser. 👑 <b>Hegemonya</b>: rakiplerin eski başkentlerinden ${SIZES[c.size].heg}'ini elinde ya da vasalının elinde ${VIC.hegemonya.hold} yıl tut. İlk ${c.grace} yıl rakipler sana saldırmaz.${c.coalAt!=null?` Toprakların %${Math.round(c.coalAt*100)}'e ulaşınca rakipler koalisyon kurar.`:''}</p>
<p><b>Olaylar ve rakipler:</b> Birkaç yılda bir bir olay çıkar; seçimini yapmadan yıl bitmez (1/2/3 tuşları). Her rakibin bir kişiliği vardır (Saldırgan, Tüccar, Savunmacı, Fırsatçı): Haritacılık ile görünür.</p>
<div class=savebox><b style="font-size:12.5px">💾 Kayıt</b><span class=muted style="font-size:12px;flex:1">${ST.ok?'Oyun bu tarayıcıya otomatik kaydedilir.':'Tarayıcı kaydı kapalı.'}</span>${S?`<button class="btn sm" onclick="copyText(exportSave(),'Kayıt panoya kopyalandı.')">📋 Kaydı kopyala</button>`:''}<button class="btn sm" onclick="showImport()">📥 Kayıt yükle</button></div>
<div class=row><button class="btn primary" onclick="closeModal();if(!S||!ART)startNew();else if(S.phase==='kurulus')showSetup()">${S&&ART?'Başla':'Tamam'}</button></div><div class=ver>Fetih v${GAME_VERSION} · kayıt v${SAVE_VER}</div>`,'help')}
function askNew(){startNew()}
function loadMsg(m){const l=$('#loading');if(l)l.textContent=m}
async function boot(fn){if(boot.busy)return;boot.busy=true;$('#loading').style.display='flex';loadMsg('Harita kuruluyor…');await frame();try{return await fn()}finally{$('#loading').style.display=ART?'none':'flex';if(!ART)loadMsg('⚔ Fetih');boot.busy=false}}
function freshStart(){resize();centerOn(capIdx(),Math.max(minZ(),1));refresh();saveNow()}

// ======================= YENİ SEFER SİHİRBAZI (§12) =======================
// Adım 0 karşılama · 1 hanedan · 2 kural kartları · 3 harita/boy/zorluk · 4 kuruluş (showSetup). Mevcut oyun ancak "Başlat"ta silinir.
const WZ={step:0,c:null,draw:[],redrawn:false,seed:''};
const wzSh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=fl(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wizInit(){const l=META.lastCfg,c={dyn:'boru',muts:[],map:'kita',size:'orta',diff:l?'kalfa':'cirak',dice:false,ferman:null,bonus:(META.equipped.bonus||[]).filter(b=>isOpen('bonus',b)).slice(0,bonusSlots()),target:l&&l.target&&!META.ach[l.target]?l.target:null};if(l)for(const k of['dyn','map','size','diff'])if(l[k])c[k]=l[k];
 for(const[k,cat,d]of[['dyn','dyn','boru'],['map','map','kita'],['size','size','orta'],['diff','diff','cirak']])if(!isOpen(cat,c[k]))c[k]=d;
 WZ.c=c;WZ.redrawn=false;WZ.seed='';wizDraw()}
function wizDraw(){WZ.draw=wzSh(META.unlocked.mut.filter(m=>MUTS[m])).slice(0,3);WZ.c.muts=[];WZ.c.dice=false}
function startNew(){if(boot.busy)return;if(!META)loadMeta();wizInit();WZ.step=0;wizShow()}
function wizGo(n){WZ.step=clamp(n,0,3);wizShow();const m=$('#modal');if(m)m.scrollTop=0}
function wizSet(k,v){WZ.c[k]=v;if(k==='diff'&&mutBanned(WZ.c.muts,v)){WZ.c.muts=WZ.c.muts.slice(0,1);toast('Bu iki kart Destan zorlukta birlikte seçilemez.')}wizShow()}
function wizUnlock(cat,id){if(unlockItem(cat,id)){toast('🔓 Açıldı!');if(cat==='mut'&&!WZ.draw.includes(id))WZ.draw.push(id)}wizShow()}
function wizRandDyn(){const o=['klasik',...DYN6].filter(d=>isOpen('dyn',d)&&d!==WZ.c.dyn);if(o.length)WZ.c.dyn=o[fl(Math.random()*o.length)];wizShow()}
function wizMut(m){const c=WZ.c;c.dice=false;if(c.muts.includes(m))c.muts=c.muts.filter(x=>x!==m);else{const n=c.muts.concat(m);if(n.length>2){toast('En fazla 2 kart seçebilirsin.');return}if(mutBanned(n,c.diff)){toast('Bu iki kart birlikte seçilemez.');return}c.muts=n}wizShow()}
function wizDice(){const pool=META.unlocked.mut.filter(m=>MUTS[m]);let p;for(let k=0;k<50;k++){p=wzSh(pool).slice(0,2);if(!mutBanned(p,WZ.c.diff))break}WZ.draw=p.slice();WZ.c.muts=p;WZ.c.dice=true;wizShow()}
function wizRedraw(){if(WZ.redrawn)return;WZ.redrawn=true;wizDraw();wizShow()}
function wizAgain(c){c=c||META.lastCfg;launch(fl(Math.random()*1e9),normCfg({bonus:(META.equipped.bonus||[]).filter(b=>isOpen('bonus',b)),...c,daily:null,train:false,rematch:false}))}
function quickStart(){launch(fl(Math.random()*1e9),normCfg(CFG_HIZLI))}
// Tohum alanı: sayı ya da FTH-… kodu (kod kuralları kurar; kilitli içerik içeren kod antrenman sayılır; FTH-D… günlük)
function wizStart(){const t=String(WZ.seed||'').trim();if(/^fth-/i.test(t)){const p=parseCode(t);if(!p){toast('Kod çözülemedi: FTH-… biçimini kontrol et.');return}if(p.daily){startDaily(p.daily);return}
  const c=normCfg({...p.cfg,ferman:WZ.c.ferman,bonus:WZ.c.bonus,target:WZ.c.target});c.train=lockedIn(c);if(c.train)toast('Kodda kilitli içerik var: oyun antrenman sayılacak.');launch(p.seed,c);return}
 const sd=/^\d{1,9}$/.test(t)?+t:fl(Math.random()*1e9);launch(sd,normCfg(WZ.c))}
// Yeni oyun: son ayar yalnız sıradan oyunlarda hatırlanır (günlük/rövanş/antrenman değil). S.gid: miras çifte ödül koruması için oyun kimliği.
function launch(seed,cfg){if(boot.busy)return;if(!META)loadMeta();if(!cfg.daily&&!cfg.rematch&&!cfg.train){META.lastCfg={dyn:cfg.dyn,muts:cfg.muts.slice(),map:cfg.map,size:cfg.size,diff:cfg.diff,dice:cfg.dice,ferman:cfg.ferman,target:cfg.target};META.equipped.bonus=cfg.bonus.slice()}saveMeta();closeModal();
 boot(async()=>{await newGameAsync(seed,cfg);S.gid=Date.now().toString(36)+'-'+fl(Math.random()*1e9).toString(36);freshStart();showSetup()})}
function wizShow(){const st=WZ.step,steps=['Hanedan','Kartlar','Harita','Kuruluş'];let h='<div class=wz>';
 if(st>0)h+=`<div class=wz-steps>${steps.map((s,k)=>`<span class="${k+1===st?'on':k+1<st?'done':''}">${k+1}. ${s}</span>`).join('')}</div>`;
 modal(h+[wz0,wz1,wz2,wz3][st]()+'</div>','wiz',true)}
function wzNav(mid,next){return`<div class=wz-nav><button class=btn onclick="wizGo(${WZ.step-1})">‹ Geri</button>${mid||''}<span style="flex:1"></span>${next||`<button class="btn primary" onclick="wizGo(${WZ.step+1})">İleri ›</button>`}</div>`}
const unlockBtn=(cat,id)=>{const c=lockCost(cat,id);return c&&META.mp>=c?`<button class="btn sm primary" onclick="event.stopPropagation();wizUnlock('${cat}','${id}')">🔓 Aç (${c} MP)</button>`:''};
function wz0(){const can=!!(S&&ART&&!S.over),l=META.lastCfg;
 if(metaNew()&&!can)return`<h3 style="font-size:22px">⚔ Fetih</h3><p>Tek bir bölgeden başla: kaynak topla, ordunu büyüt, rakip devletleri fethet.</p>
  <button class="btn primary wide" style="min-height:58px;font-size:18px" onclick="quickStart()">⚡ Hızlı Başla</button><p class=muted style="font-size:12px;text-align:center;margin:6px 0 0">${cfgLine(CFG_HIZLI)}</p>
  <p style="text-align:center;margin:16px 0 4px"><a class=lnk style="display:inline-block;padding:10px 4px" onclick="wizGo(1)">Seferi kendim hazırlayayım →</a></p>`;
 return`<h3>⚔ Yeni Sefer</h3>${can?`<button class="btn wide" onclick="closeModal()">▶ Devam et <small class=muted>(${S.turn}. yıl)</small></button>`:''}
  <button class="btn primary wide" onclick="wizGo(1)">🧭 Yeni sefer hazırla</button>
  ${(()=>{const k=dateKey(),st=META.daily.started[k],dc=normCfg(dailyOf(k).cfg);return`<button class="btn wide ${st?'':'hot'}" onclick="startDaily()">📅 Günlük meydan okuma ${st?'<small class=muted>(bugün başlatıldı · tekrar antrenman)</small>':'<span class=good>● bugün oynanmadı</span>'}${META.daily.streak?` · seri ${META.daily.streak}`:''}<br><small class=muted>${cfgShort(dc)} · Kısa</small></button>`})()}
  ${l?`<button class="btn wide" onclick="wizAgain()">↻ Son ayarla, yeni harita<br><small class=muted>${cfgLine(normCfg(l))}</small></button>`:''}
  <button class="btn wide" onclick="quickStart()">⚡ Hızlı Başla<br><small class=muted>${cfgLine(CFG_HIZLI)}</small></button>
  ${can?'<p class=muted style="font-size:12px">Yeni sefer başlayınca mevcut oyunun silinir (miras puanların korunur).</p>':''}
  <button class="btn wide" onclick="showMiras('wiz')">🏛 Miras · <b>${fl(META.mp)} MP</b> <small class=muted>· açılımlar, başarımlar (${ACH.filter(a=>META.ach[a.id]).length}/${ACH.length}), rekorlar</small></button>
  <div class=ver>${ST.ok?'':'Tarayıcı kaydı kapalı · '}Fetih v${GAME_VERSION}</div>`}
function wz1(){const c=WZ.c;let h=`<h3>Hanedanını seç</h3><div class="cards wzc wzc2">`;
 for(const d of['klasik',...DYN6]){const D=DYN[d],op=isOpen('dyn',d),A=D.ab&&ABIL[D.ab];
  h+=`<div class="card pick ${c.dyn===d?'on':''} ${op?'':'lockd'}" ${op?`onclick="wizSet('dyn','${d}')"`:''} role=button><div><b>${D.e} ${D.ad}</b>${d==='klasik'?' <span class=tag>miras ×0,9</span>':''}</div><small class=muted>${D.tema}</small>
  <div class=det>${D.g.map(x=>`<small class=good>✔ ${x}</small>`).join('')}${D.z.map(x=>`<small class=bad>✖ ${x}</small>`).join('')}${A?`<small>★ <b>${A.ad}</b></small>`:''}</div><small class=muted>${startTxt(d)}</small>
  ${op?'':`<small class=muted>${lockTxt('dyn',d)}</small>${unlockBtn('dyn',d)}`}</div>`}
 const A=DYN[c.dyn].ab&&ABIL[DYN[c.dyn].ab];h+='</div><div class=mobdet>'+dynHtml(c.dyn)+'</div>'+(A?`<div class=feat>${DYN[c.dyn].e} ★ <b>${A.ad}:</b> ${A.d}</div>`:'');
 return h+wzNav(`<button class=btn onclick="wizRandDyn()">🎲 Rastgele</button>`)}
function wz2(){const c=WZ.c,n=normCfg(c);let h=`<h3>Kural kartları</h3><p class=muted style="margin-top:0;font-size:12.5px">3 kart çekildi. Birini seç, istersen ikincisini de al. Kartlar oyunu değiştirir ve miras çarpanını artırır.</p><div class="cards wzc">`;
 for(const m of WZ.draw){const M=MUTS[m],t=MUT_TUR[M.tur],on=c.muts.includes(m);
  h+=`<div class="card pick ${on?'on':''}" onclick="wizMut('${m}')" role=button><div><b>${M.e} ${M.ad}</b></div><div><span class="tag ${t[1]}">${t[0]}</span> <span class=muted style="font-size:12px">miras ×${fmtX(M.x)}</span></div><small>${M.d}</small>${on?'<small class=ok>✓ Seçildi</small>':''}</div>`}
 const dots=clamp(Math.round((n.mutX-.85)/.22)+1,1,5),lk=Object.keys(MUTS).filter(m=>!isOpen('mut',m));
 h+=`</div><div class=fundbox style="font-size:13.5px">Kart çarpanı <b>×${fmtX(n.mutX)}</b>${n.dice?' (zar +%10)':''} · toplam miras ×${fmtX(scoreX(n))} · zorluk ${'●'.repeat(dots)}${'○'.repeat(5-dots)}${mutWarn(c.muts)?' <span class="tag good">kolay</span>':''}</div>`;
 if(lk.length)h+=`<details style="font-size:12.5px"><summary class=muted style="cursor:pointer;padding:6px 0">🔒 Kilitli kartlar (${lk.length})</summary>${lk.map(m=>`<div class=item><div>${MUTS[m].e} <b>${MUTS[m].ad}</b><small>${MUTS[m].d}</small></div><span>${unlockBtn('mut',m)||`<small class=muted>${lockTxt('mut',m)}</small>`}</span></div>`).join('')}</details>`;
 return h+wzNav(`<button class=btn onclick="wizDice()" title="2 rastgele kart, miras +%10">🎲 Zar at</button><button class=btn ${WZ.redrawn?'disabled':''} onclick="wizRedraw()" title="Oyun başına 1 kez">↻ Yeniden çek</button>`,
  `<button class=btn onclick="WZ.c.muts=[];WZ.c.dice=false;wizGo(3)" title="Kart almadan devam">Kartsız</button><button class="btn primary" ${c.muts.length?'':'disabled'} onclick="wizGo(3)">İleri ›</button>`)}
// Başlangıç bonusu yuvaları ve hedef başarım (canlı izleme üst çubukta)
function wzBonus(){const ob=META.unlocked.bonus.filter(b=>BONUS[b]),c=WZ.c,n=bonusSlots();if(!ob.length)return`<p class=muted style="font-size:12px;margin:10px 0 0">Başlangıç bonusları mirasla açılır: <a class=lnk onclick="showMiras('wiz')">🏛 Miras</a></p>`;
 return`<h4>Başlangıç bonusu <span style="text-transform:none;letter-spacing:0">(${(c.bonus||[]).length}/${n} yuva)</span></h4><div class=seg>${ob.map(b=>{const on=(c.bonus||[]).includes(b);return`<button class="btn ${on?'primary':''}" onclick="wizBonus('${b}')" title="${esc(BONUS[b].d)}">${BONUS[b].e} ${BONUS[b].ad}<br><small style="font-size:10.5px;opacity:.8">miras ×${fmtX(BONUS[b].x)}</small></button>`}).join('')}</div>`}
function wizBonus(b){const c=WZ.c,a=c.bonus||[];c.bonus=a.includes(b)?a.filter(x=>x!==b):[b].concat(a).slice(0,bonusSlots());wizShow()}
function wzTarget(){const L=ACH.filter(a=>a.lv&&!a.hid&&!META.ach[a.id]);if(!L.length)return'';return`<h4>🎯 Hedef başarım <span style="text-transform:none;letter-spacing:0">(isteğe bağlı, üst çubukta izlenir)</span></h4><select class=inp onchange="WZ.c.target=this.value||null"><option value="">Yok</option>${L.map(a=>`<option value="${a.id}" ${WZ.c.target===a.id?'selected':''}>${a.ad} (+${a.mp} MP): ${a.d}</option>`).join('')}</select>${WZ.c.diff==='cirak'?'<p class=muted style="font-size:12px;margin:4px 0 0">Çırak\'ta yalnız İlk Zafer, Ders Alındı, Altı Ocak ve Vakanüvis açılır.</p>':''}`}
function segBtns(cat,T){return Object.keys(T).map(k=>{const op=isOpen(cat,k),on=WZ.c[cat]===k;return`<button class="btn ${on?'primary':''}" ${op?`onclick="wizSet('${cat}','${k}')"`:'disabled'} title="${esc(op?T[k].d:lockTxt(cat,k))}">${op?'':'🔒 '}${T[k].ad}${cat==='size'?`<br><small style="font-size:10.5px;opacity:.8">${op?T[k].d.split(',')[0]:lockCost(cat,k)+' MP'}</small>`:''}</button>`}).join('')}
function wz3(){const c=WZ.c,n=normCfg(c);let h=`<h3>Harita, boy ve zorluk</h3><h4 style="margin-top:4px">Harita türü</h4><div class="cards wzc wzc2">`;
 for(const k in MAPTYPES){const T=MAPTYPES[k],op=isOpen('map',k);h+=`<div class="card pick ${c.map===k?'on':''} ${op?'':'lockd'}" ${op?`onclick="wizSet('map','${k}')"`:''} role=button><div><b>${T.e} ${T.ad}</b></div><small class=muted>${T.d}</small>${op?'':`<small class=muted>${lockTxt('map',k)}</small>${unlockBtn('map',k)}`}</div>`}
 h+=`</div><h4>Oyun boyu</h4><div class=seg>${segBtns('size',SIZES)}</div><h4>Zorluk</h4><div class=seg>${segBtns('diff',DIFFS)}</div><p class=muted style="font-size:12px;margin:6px 0 0">${DIFFS[c.diff].d} Miras ×${fmtX(DIFFS[c.diff].mp)}.</p>
 <h4>Ferman <span style="text-transform:none;letter-spacing:0">(isteğe bağlı)</span></h4><div class=seg>${[['','Yok'],...Object.keys(VIC).map(k=>[k,VIC[k].e+' '+VIC[k].ad])].map(([k,a])=>`<button class="btn ${(c.ferman||'')===k?'primary':''}" onclick="wizSet('ferman','${k}')">${a}</button>`).join('')}</div><p class=muted style="font-size:12px;margin:6px 0 0">Kazanacağın yolu beyan et: o yoldan kazanırsan miras ×${fmtX(FERMAN.x)}. ${FERMAN.until}. yıla kadar bir kez değiştirebilirsin.</p>
 ${wzBonus()}${wzTarget()}<h4>Tohum ya da kod</h4><input id=wzSeed maxlength=40 placeholder="boş = rastgele · sayı ya da FTH-… kodu" value="${esc(WZ.seed)}" oninput="WZ.seed=this.value" class=inp autocomplete=off>
 <div class=fundbox style="font-size:13px">${cfgLine(n)}<br><span class=muted>Barış ${n.grace} yıl · hazine ${n.fund} akçe · ${n.ais.length} rakip · miras ×${fmtX(scoreX(n))}</span></div>${S&&ART&&!S.over?'<p class=muted style="font-size:12px;margin:0">Mevcut oyunun silinir (miras puanların korunur).</p>':''}`;
 return h+wzNav('',`<button class="btn primary" onclick="wizStart()">Seferi Başlat ▶</button>`)}
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{if(ui.modal==='ev'&&/^[1-9]$/.test(e.key)){e.preventDefault();pickEvent(+e.key-1);return}if(e.key==='Escape'&&ui.modal&&!['setup','over','bozuk','ev','miras'].includes(ui.modal)&&!(ui.modal==='wiz'&&!ART))closeModal()});
async function start(){if(!storeCheck())note('st','⚠ Tarayıcı kaydı kapalı: ilerleme kaydedilmeyecek.'+(ST.rd?' (Var olan kayıt okunabiliyor ama üzerine yazılamıyor.)':''),'warn');loadMeta();
 let ok=false;await boot(async()=>{resize();const r=readSave();
  if(r&&!r.bad){try{await adoptSaveAsync(r.s);ok=true;if(r.key!==SAVE&&saveNow())stDel(r.key)}catch(e){r.bad=true;r.why=e.message}}
  if(r&&r.bad)backupBad(r);
  if(ok){centerOn(ui.sel??0,Math.max(minZ(),1));refresh();if(S.phase==='kurulus')showSetup();else if(S.over)afterModal();else showEvent()}});
 if(!ok){if(ST.bad)showBad();else startNew()}}
if(!TEST)start();
</script>
